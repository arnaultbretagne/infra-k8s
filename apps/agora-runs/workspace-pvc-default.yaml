# Quick unblock (2026-08-06, operator's explicit ask): apps/web's own UI form defaults its
# "Workspace reference" field to this literal name — nothing in the product provisions a workspace
# PVC on demand (docs/specs/08-session-runtime-control.md documents "workspace mount reference" as
# an INPUT the caller must already have, never describes how one gets created). This is ONE shared
# volume for testing, not per-Workstream isolation — a real auto-provisioning design is a separate,
# not-yet-decided follow-up.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-default
  namespace: agora-runs
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 256Mi
