apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agora-runs
# No RBAC here: its two Roles were bound to ServiceAccounts of the retired stack in `agora`
# (session-runtime-controller, agora-broker), gone since 2026-09-08. A binding outlives its subject,
# so any ServiceAccount later created under either name would have inherited its grants here (Pod
# and ServiceAccount create/delete, Pod reads).
resources:
  - namespace.yaml
  - quota.yaml
  - limitrange.yaml
  - networkpolicy.yaml
  - onecli-ca.yaml
  - onecli-stubs.secrets.yaml
  - ghcr-pull.secrets.yaml
