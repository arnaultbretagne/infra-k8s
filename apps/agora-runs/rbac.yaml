# Scopes the Session Runtime controller's ServiceAccount (apps/agora/controller.yaml, namespace
# `agora`) to pod/serviceaccount CRUD in THIS namespace only — docs/specs/11-security.md: "Only
# the Session Runtime controller ServiceAccount may create/delete Session Runtime workloads."
# Mirrors infrastructure/configs/agent-runs/rbac.yaml's own cross-namespace-subject pattern (the
# manager's ServiceAccount lives in `agent`, this Role lives in `agent-runs`) and
# apps/session-runtime-controller/live-verification/03-role.yaml's already-live-verified rule set
# (P04) — serviceaccounts CRUD included because pod-spec.ts materializes one ServiceAccount per
# Session (`serviceAccountName(sessionId)`), not a single shared identity.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: session-runtime-controller
  namespace: agora-runs
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: session-runtime-controller
  namespace: agora-runs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: session-runtime-controller
subjects:
  - kind: ServiceAccount
    name: session-runtime-controller
    namespace: agora
---
# Found live, P11: relay.ts (apps/broker) derives the connecting Session Runtime Pod's workload
# identity from its own real source IP — no service mesh exists in this cluster to inject an
# X-Workload-Identity header the way relay.ts's own module doc originally assumed, so every real
# relay CONNECT failed closed until this was wired. Read-only, get/list pods ONLY — no watch, no
# serviceaccounts, no create/delete — a deliberately narrower grant than the controller's own above.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agora-broker-pod-lookup
  namespace: agora-runs
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agora-broker-pod-lookup
  namespace: agora-runs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agora-broker-pod-lookup
subjects:
  - kind: ServiceAccount
    name: agora-broker
    namespace: agora
