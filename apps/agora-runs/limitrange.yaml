# Safety defaults matching packages/agent-registry's own per-Agent resources block (first-pass
# estimate, same as CLAUDE_CODE_DEFINITION/CODEX_DEFINITION already use) — same reasoning as
# infrastructure/configs/agent-runs/limitrange.yaml's own.
apiVersion: v1
kind: LimitRange
metadata:
  name: agora-runs-limits
  namespace: agora-runs
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 250m
        memory: 256Mi
      default:
        cpu: "1"
        memory: 1Gi
      max:
        memory: 1536Mi
