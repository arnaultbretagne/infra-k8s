# Pull credential for the private GHCR images of the Agora repo
# (ghcr.io/arnaultbretagne/agora-{web,controller,broker}). Recreated on 2026-09-01 during the
# g4 cutover: the old cluster held this Secret only imperatively, so it was NOT in Git and the
# fresh cluster came up with `FailedToRetrieveImagePullSecret`. The historic credential turned
# out to be a `gho_` OAuth token from a `gh auth login`, which is why it was invisible in the
# account PAT list; it is replaced here by a classic PAT scoped to `read:packages` only.
#
# agora-runs runs no permanent workload: it is the sandbox namespace in which the Agora
# controller creates Session Runtime Pods on the fly. controller.yaml pins
# `AGORA_NAMESPACE=agora-runs` and `IMAGE_PULL_SECRET_NAME=ghcr-pull`, so the same Secret must
# exist here for those dynamically created pods to pull.
