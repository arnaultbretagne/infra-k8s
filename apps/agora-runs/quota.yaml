# Blast-radius bound for the harness Pods, sized against MEASURED usage rather than the estimate the
# first pass carried (the 2026-07-04 double-freeze lesson: on a swapless box the bound that matters
# is memory actually used, not the ceiling declared).
#
# Measured 2026-09-08 on this cluster: a live claude-code Pod holds **531 Mi** and 31m of CPU
# against a 1Gi/1000m limit. Eight of them is ~4.2 Gi of real memory on a node with 32.5 Gi
# allocatable and 24% of it requested — comfortable — while the declared limits stay a ceiling
# nothing has ever approached.
#
# Why eight and not four: four filled up in a single afternoon of ordinary use, and the cluster then
# answered every new conversation with a Pod that never came — BUILD looping on `create_pod` →
# `unknown`, which reads from the product as "nothing is provisioned" with no cause anywhere. Four
# is one operator with four conversations open.
#
# EIGHT IS NOT A FIX FOR WHAT FILLED IT. Nothing today powers a Workstream down because nobody is
# using it, so Pods accumulate until this number stops them — a bigger number postpones that by an
# afternoon. The retired implementation had an idle reaper for exactly this
# (`apps/web/src/idle-reaper.ts` at archive/pre-design-cleanup-2026-09-05) and it is owed here;
# docs/master-plan.md carries it.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: agora-runs-quota
  namespace: agora-runs
spec:
  hard:
    pods: "8"
    # Per Pod, counting gVisor's own ~20m/64Mi of scheduler overhead: 270m/320Mi requested,
    # 1020m/1088Mi limited. Eight of them, with drift headroom.
    requests.cpu: "2400m"   # 8 × 270m = 2160m
    requests.memory: 2800Mi # 8 × 320Mi = 2560Mi
    limits.cpu: "9000m"     # 8 × 1020m = 8160m
    limits.memory: 10Gi     # 8 × 1088Mi = 8704Mi
