# pod-spec.ts (apps/session-runtime-controller) hardcodes this ConfigMap's name/key — it does not
# create or sync it itself (P11 finding: AGORA_ONECLI_CA_PEM at controller startup is validated but
# never actually consumed for Pod construction). Deployment-provisioned, matching the doc comment
# there. Public trust cert (agora-onecli's own gateway CA) — no confidentiality need, plaintext in
# git is correct here.
#
# RE-CAPTURED 2026-09-07, a THIRD drift: the g4 cutover gave OneCLI a new /app/data, so the gateway
# regenerated its CA on 2026-09-01 and this file still held the 2026-08-06 one. Nothing detects that
# — the harness Pod mounts whatever is here and every provider call fails deep inside the agent with
# "Self-signed certificate detected. Check your proxy or corporate SSL certificates", which names
# neither this file nor OneCLI. It cost an hour of the first live deployment.
#
# The CA is generated by OneCLI, so a copy in git is a copy that can go stale. Until something syncs
# it (or the Pod reads it from a source OneCLI itself writes), the check is: the notBefore here must
# match `kubectl -n agora-onecli exec deploy/onecli -- cat /app/data/gateway/ca.pem`.
