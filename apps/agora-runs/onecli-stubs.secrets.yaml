# pod-spec.ts's onecli-stubs projected volume (Secret, fixed 2026-08-06 per P11 finding —
# see the agora repo's pod-spec.ts commit). Two harnesses, two very different sensitivity levels:
#
# - claude-code-oauth-token: agents/claude-code/src/bridge-server.ts's own doc comment — "the same
#   fixed, non-secret placeholder every Session gets", never a real bearer. Real Claude Max auth
#   happens transparently at the Broker relay/OneCLI gateway layer, not via this file.
# - codex-auth-json: agents/codex/src/bridge-server.ts's ensureCodexAuthStub reads {idToken,
#   accountId} from here. Unlike the Claude placeholder, this MUST be the real linked ChatGPT
#   account's id_token — codex-acp validates it locally as a genuinely-identifying-the-account JWT
#   before any request can succeed (the P10 live-verification bug, agents/codex/SPIKE.md). Not a
#   bearer credential on its own, but real account-identifying content — hence Secret, not
#   ConfigMap (this pass's fix). Sourced from the operator's own already-authenticated local
#   ~/.codex/auth.json, same method plans/10's Evidence already used.
