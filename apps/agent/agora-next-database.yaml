# The refactoring branch's own product database (docs/adr/0010-capability-grants.md's "runs as
# facts" schema, contracts/database/*.sql) — a NEW database inside the SAME agora-pg cluster
# (cnpg.yaml), not a new cluster and not the OLD `agora` database the currently-live channels-era
# hub still owns. Declarative CNPG Database CRD — reconciled by the operator, no manual
# `CREATE DATABASE` needed.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: agora-next
  namespace: agent
spec:
  name: agora_next
  owner: agora_next_owner
  cluster:
    name: agora-pg
  # This database's own lifecycle is owned by this CRD, not by whatever created it — deleting this
  # resource drops the database. Deliberate: this is the disposable, not-yet-live side of the
  # cutover until P11 says otherwise.
  databaseReclaimPolicy: delete
