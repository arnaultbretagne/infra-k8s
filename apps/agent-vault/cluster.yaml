apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: agent-vault-pg
  namespace: agent-vault
spec:
  instances: 1
  priorityClassName: bretagne-critical
  resources:
    requests:
      cpu: 30m
      memory: 256Mi
    limits:
      memory: 512Mi
  monitoring:
    enablePodMonitor: true
  storage:
    size: 1Gi
    storageClass: local-path
  bootstrap:
    initdb:
      database: agentvault
      owner: agentvault
  backup:
    barmanObjectStore:
      destinationPath: s3://bretagne-pg-backups/agent-vault
      endpointURL: https://938f9d4cdcf888eddea773d0f68615bc.r2.cloudflarestorage.com
      s3Credentials:
        accessKeyId:
          name: cnpg-s3-creds
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-s3-creds
          key: SECRET_ACCESS_KEY
      wal:
        compression: snappy
    retentionPolicy: 3d
  imageName: ghcr.io/cloudnative-pg/postgresql:17
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: agent-vault-pg-daily
  namespace: agent-vault
spec:
  schedule: 0 45 3 * * *
  immediate: true
  cluster:
    name: agent-vault-pg
  backupOwnerReference: self
