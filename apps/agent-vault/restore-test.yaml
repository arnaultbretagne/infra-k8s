apiVersion: batch/v1
kind: CronJob
metadata:
  name: agent-vault-pg-restore-test
  namespace: agent-vault
spec:
  schedule: 15 5 * * *
  timeZone: Etc/UTC   # same clock as the CNPG ScheduledBackups; unset = the node's zone (g4: Europe/Zurich)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 600
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 26
            runAsGroup: 102
            fsGroup: 102
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: restore-test
            image: ghcr.io/cloudnative-pg/postgresql:17
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: cnpg-s3-creds
                  key: ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: cnpg-s3-creds
                  key: SECRET_ACCESS_KEY
            - name: PGDATA
              value: /tmp/pgdata
            command:
            - bash
            - -euo
            - pipefail
            - -c
            - |
              S3_DEST="s3://bretagne-pg-backups/agent-vault"
              S3_ENDPOINT="https://938f9d4cdcf888eddea773d0f68615bc.r2.cloudflarestorage.com"
              SERVER="agent-vault-pg"
              barman-cloud-restore --endpoint-url "$S3_ENDPOINT" "$S3_DEST" "$SERVER" latest "$PGDATA"
              chmod 700 "$PGDATA"
              # Replay archived WAL; disable CNPG paths absent from this disposable pod.
              cat >> "$PGDATA/postgresql.auto.conf" <<PGCONF
              restore_command = 'barman-cloud-wal-restore --endpoint-url $S3_ENDPOINT $S3_DEST $SERVER %f %p'
              recovery_target = immediate
              recovery_target_action = promote
              ssl = off
              archive_mode = off
              logging_collector = off
              unix_socket_directories = '/tmp'
              PGCONF
              touch "$PGDATA/recovery.signal"
              { printf '%s\n' "local all all trust" "host all all 127.0.0.1/32 trust" "host all all ::1/128 trust"; cat "$PGDATA/pg_hba.conf"; } > "$PGDATA/pg_hba.conf.tmp"
              mv "$PGDATA/pg_hba.conf.tmp" "$PGDATA/pg_hba.conf"
              pg_ctl -D "$PGDATA" -o "-p 5433 -c listen_addresses=localhost" start -w -t 60
              trap 'pg_ctl -D "$PGDATA" stop -m fast' EXIT
              # More than SQL readiness: the encryption identity and proxy CA must exist.
              IDENTITY=$(psql -h localhost -p 5433 -U postgres -d agentvault -v ON_ERROR_STOP=1 -tAc \
                "SELECT (EXISTS (SELECT 1 FROM master_key WHERE id=1 AND octet_length(dek_ciphertext)>0) AND EXISTS (SELECT 1 FROM ca_state WHERE octet_length(root_cert)>0 AND octet_length(root_key_ct)>0))::int;")
              test "$IDENTITY" = 1
              echo "Restore test PASSED: encrypted master key and proxy CA present"
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                memory: 256Mi
            volumeMounts:
            - name: tmp
              mountPath: /tmp
          volumes:
          - name: tmp
            emptyDir:
              sizeLimit: 2Gi
          automountServiceAccountToken: false
        metadata:
          labels:
            app: agent-vault-pg-restore-test
