apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny
  namespace: agent-vault
spec:
  endpointSelector: {}
  ingress: []
  egress: []
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agent-vault
  namespace: agent-vault
spec:
  endpointSelector:
    matchLabels:
      app: agent-vault
  ingress:
  # kubelet probes
  - fromEntities:
    - host
    toPorts:
    - ports:
      - port: '14321'
        protocol: TCP
      - port: '14322'
        protocol: TCP
  # The oauth2-proxy gate — same-namespace, management UI/API port only (never the MITM proxy
  # port: human operators never need it, and it must stay in-cluster).
  - fromEndpoints:
    - matchLabels:
        app: oauth2-proxy
    toPorts:
    - ports:
      - port: '14321'
        protocol: TCP
  # Agora's sandboxes go out through the MITM proxy with a proxy-only session (docs/credentials.md
  # on arnaultbretagne/agora). The other half is apps/agora-sandboxes/networkpolicy.yaml.
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: agora-sandboxes
        app.kubernetes.io/part-of: agora-sandboxes
    toPorts:
    - ports:
      - port: '14322'
        protocol: TCP
  # Agora's lab mints those sessions with its agent token (POST /v1/sessions).
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: agora-lab
        app: lab
    toPorts:
    - ports:
      - port: '14321'
        protocol: TCP
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports:
      - port: '53'
        protocol: UDP
      - port: '53'
        protocol: TCP
  - toEntities:
    - world
    toPorts:
    - ports:
      - port: '443'
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        cnpg.io/cluster: agent-vault-pg
    toPorts:
    - ports:
      - port: '5432'
        protocol: TCP
---
# The oauth2-proxy gate itself — mirrors apps/agora-onecli's own (docs/hosting-an-app.md §7/§10.3).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: oauth2-proxy
  namespace: agent-vault
spec:
  endpointSelector:
    matchLabels:
      app: oauth2-proxy
  ingress:
  # Traefik serves agent-vault.bretagne.dev -> proxy :4180
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: traefik
    toPorts:
    - ports:
      - port: '4180'
        protocol: TCP
  # kubelet probes
  - fromEntities:
    - host
    toPorts:
    - ports:
      - port: '4180'
        protocol: TCP
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports:
      - port: '53'
        protocol: UDP
      - port: '53'
        protocol: TCP
  # -> upstream Agent Vault management UI/API
  - toEndpoints:
    - matchLabels:
        app: agent-vault
    toPorts:
    - ports:
      - port: '14321'
        protocol: TCP
  # -> id.bretagne.dev (OIDC discovery/token). The public IP resolves to the node, then
  # kube-proxy DNATs to the Traefik pod — allow both paths (agora-onecli's own pattern).
  - toEntities:
    - world
    - host
    toPorts:
    - ports:
      - port: '443'
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: traefik
    toPorts:
    - ports:
      - port: '8443'
        protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agent-vault-pg
  namespace: agent-vault
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: agent-vault-pg
  ingress:
  - fromEndpoints:
    - matchLabels:
        app: agent-vault
    toPorts:
    - ports:
      - port: '5432'
        protocol: TCP
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: cnpg-system
        k8s:app.kubernetes.io/name: cloudnative-pg
    toPorts:
    - ports:
      - port: '8000'
        protocol: TCP
      - port: '5432'
        protocol: TCP
  - fromEndpoints:
    - matchLabels:
        cnpg.io/cluster: agent-vault-pg
    toPorts:
    - ports:
      - port: '5432'
        protocol: TCP
      - port: '8000'
        protocol: TCP
  - fromEntities:
    - host
    toPorts:
    - ports:
      - port: '8000'
        protocol: TCP
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: observability
        app.kubernetes.io/name: prometheus
    toPorts:
    - ports:
      - port: '9187'
        protocol: TCP
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports:
      - port: '53'
        protocol: UDP
      - port: '53'
        protocol: TCP
  - toEntities:
    - world
    toPorts:
    - ports:
      - port: '443'
        protocol: TCP
  - toEntities:
    - kube-apiserver
    toPorts:
    - ports:
      - port: '443'
        protocol: TCP
      - port: '6443'
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        cnpg.io/cluster: agent-vault-pg
    toPorts:
    - ports:
      - port: '5432'
        protocol: TCP
      - port: '8000'
        protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: restore-test
  namespace: agent-vault
spec:
  endpointSelector:
