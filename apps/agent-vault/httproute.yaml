apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agent-vault
  namespace: agent-vault
spec:
  parentRefs:
    - name: bretagne-gateway
      namespace: traefik
      sectionName: https-agent-vault
  hostnames:
    - agent-vault.bretagne.dev
  rules:
    - filters:
        # HSTS (S8). Conservative 1-day max-age for the initial rollout.
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: "max-age=86400; includeSubDomains"
      backendRefs:
        - name: oauth2-proxy
          port: 4180
