# rss.bretagne.dev: everything behind the OIDC gate, the API included. Native apps (NetNewsWire,
# Reeder…) would need the Google Reader API (POST /accounts/ClientLogin, /reader/api/0) routed
# straight to Miniflux, outside the gate: not opened.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rss
spec:
  parentRefs:
    - name: bretagne-gateway
      namespace: traefik
      sectionName: https-rss
  hostnames:
    - rss.bretagne.dev
  rules:
    - filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: "max-age=86400; includeSubDomains"
      backendRefs:
        - name: oauth2-proxy
          port: 4180
