# rss.bretagne.dev — the RSS stack: Miniflux, the reader, on its CNPG database, and RSSHub, which
# makes feeds for the sites that publish none. Operators only (OIDC, admin).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rss
resources:
  - namespace.yaml
  - limitrange.yaml
  - postgres.yaml
  - restore-test.yaml
  - oauth2-proxy.secrets.yaml
  - miniflux.yaml
  - rsshub.yaml
  - oauth2-proxy.yaml
  - httproute.yaml
  - networkpolicy.yaml
