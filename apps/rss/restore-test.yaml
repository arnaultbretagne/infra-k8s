# The restore drill (docs/hosting-an-app.md §9.4): pulls the latest base backup and its WAL from R2
# into a throwaway PostgreSQL and checks that Miniflux's core tables came back.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: miniflux-pg-restore-test
spec:
  # In UTC, like the ScheduledBackup it checks (04:30 UTC): without a time zone, a CronJob here runs
  # on Europe/Zurich, and a drill scheduled "after the backup" restores yesterday's. 06:00, after
  # the other drills.
  schedule: "0 6 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 600
      backoffLimit: 0
      template:
        metadata:
          labels:
            # Named so the network policy can find it: the namespace is default-deny, and a drill
            # that cannot reach R2 fails on the wrong thing.
            app: restore-drill
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 26
            runAsGroup: 102
            fsGroup: 102
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: restore-test
              # The 17 line, as agora-pg's drill: the barman-cloud of the 17.4 image answers
              # "Unknown backup 'latest'" on this server's backups (first drill, 2026-10-07), where
              # this one restores them.
              image: ghcr.io/cloudnative-pg/postgresql:17
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: cnpg-s3-creds
                      key: ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: cnpg-s3-creds
                      key: SECRET_ACCESS_KEY
                - name: PGDATA
                  value: /tmp/pgdata
              command:
                - bash
                - -euo
                - pipefail
                - -c
                - |
                  S3_DEST="s3://bretagne-pg-backups/miniflux"
                  S3_ENDPOINT="https://938f9d4cdcf888eddea773d0f68615bc.r2.cloudflarestorage.com"
                  SERVER="miniflux-pg"

                  echo "==> Listing backups..."
                  barman-cloud-backup-list --endpoint-url "$S3_ENDPOINT" "$S3_DEST" "$SERVER"

                  echo "==> Restoring latest backup..."
                  barman-cloud-restore --endpoint-url "$S3_ENDPOINT" "$S3_DEST" "$SERVER" latest "$PGDATA"

                  # barman-cloud-restore leaves PGDATA group-writable (fsGroup); PostgreSQL
                  # refuses to start unless the data dir is 0700/0750.
                  chmod 700 "$PGDATA"

                  # Recover: replay WALs then promote immediately, and neutralise every CNPG
                  # runtime setting that points at /controller/* (absent in this standalone pod).
                  # auto.conf is read last, so these win.
                  cat >> "$PGDATA/postgresql.auto.conf" <<PGCONF
                  restore_command = 'barman-cloud-wal-restore --endpoint-url $S3_ENDPOINT $S3_DEST $SERVER %f %p'
                  recovery_target = immediate
                  recovery_target_action = promote
                  ssl = off
                  archive_mode = off
                  logging_collector = off
                  unix_socket_directories = '/tmp'
                  PGCONF
                  touch "$PGDATA/recovery.signal"

                  # Throwaway pod: passwordless local connections for the health query. PREPEND —
                  # pg_hba is first-match, CNPG's scram rules must not win first.
                  { printf '%s\n' "local all all trust" "host all all 127.0.0.1/32 trust" "host all all ::1/128 trust"; cat "$PGDATA/pg_hba.conf"; } > "$PGDATA/pg_hba.conf.tmp"
                  mv "$PGDATA/pg_hba.conf.tmp" "$PGDATA/pg_hba.conf"

                  echo "==> Starting PostgreSQL..."
                  pg_ctl -D "$PGDATA" -o "-p 5433 -c listen_addresses=localhost" start -w -t 60
                  pg_isready -h localhost -p 5433

                  # Not "are there tables": are Miniflux's core tables there. A restored-but-empty
                  # database answers a generic count just as happily, which is the failure this
                  # drill exists to catch. Miniflux creates them at its first start (RUN_MIGRATIONS).
                  echo "==> Running health query..."
                  CORE=$(psql -h localhost -p 5433 -U postgres -d miniflux -tAc \
                    "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_name IN ('users','feeds','entries','schema_version');")
                  echo "restored core tables present: $CORE of 4"
                  if [ "$CORE" -lt 4 ]; then
                    echo "FAIL: the restored database is missing Miniflux's core tables" >&2
                    exit 1
                  fi
                  pg_ctl -D "$PGDATA" stop -m fast
                  echo "==> Restore test PASSED"
              resources:
                requests: { cpu: 100m, memory: 128Mi }
                limits: { memory: 256Mi }
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 2Gi
