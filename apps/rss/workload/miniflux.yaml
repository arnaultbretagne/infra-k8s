# Miniflux, the reader: polls the subscriptions, keeps the entries and the reading state in
# miniflux-pg. Config-only: the upstream distroless image (non-root 65532, no shell), configured
# by environment (https://miniflux.app/docs/configuration.html).
#
# Who is signed in: oauth2-proxy (oauth2-proxy.yaml) passes the Pocket-ID e-mail in
# X-Forwarded-Email, Miniflux trusts that header from pod addresses only (the network policy admits
# oauth2-proxy alone), and creates the account at the first sign-in. The account has no password:
# the login form is off (DISABLE_LOCAL_AUTH), so the REST API's Basic auth has nothing to match
# either.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: miniflux
spec:
  replicas: 1
  selector:
    matchLabels:
      app: miniflux
  template:
    metadata:
      labels:
        app: miniflux
    spec:
      automountServiceAccountToken: false
      priorityClassName: bretagne-low
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: miniflux
          image: miniflux/miniflux:2.3.3-distroless
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - { name: DATABASE_URL_FILE, value: /etc/miniflux/database/uri }
            - { name: RUN_MIGRATIONS, value: "1" }
            - { name: BASE_URL, value: https://rss.bretagne.dev }
            - { name: HTTPS, value: "1" }
            - { name: AUTH_PROXY_HEADER, value: X-Forwarded-Email }
            - { name: AUTH_PROXY_USER_CREATION, value: "1" }
            # The pod network: the TCP peer, not X-Forwarded-For, is what Miniflux checks.
            - { name: TRUSTED_REVERSE_PROXY_NETWORKS, value: 10.244.0.0/16 }
            - { name: DISABLE_LOCAL_AUTH, value: "1" }
            # RSSHub is a cluster address: without this, Miniflux refuses to fetch it. The network
            # policy keeps the rest of the private ranges (the home LAN included) out of reach.
            - { name: FETCHER_ALLOW_PRIVATE_NETWORKS, value: "1" }
          volumeMounts:
            - name: database
              mountPath: /etc/miniflux/database
              readOnly: true
            - name: tmp
              mountPath: /tmp
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 256Mi }
          startupProbe:
            httpGet: { path: /readiness, port: 8080 }
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:
            httpGet: { path: /readiness, port: 8080 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /liveness, port: 8080 }
            periodSeconds: 30
      volumes:
        - name: database
          secret:
            secretName: miniflux-pg-app
            items:
              - { key: uri, path: uri }
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: miniflux
spec:
  selector:
    app: miniflux
  ports:
    - { port: 8080, targetPort: 8080 }
