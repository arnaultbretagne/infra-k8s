# Every file but index.html is stored gzipped (a ConfigMap cannot hold the bundles' control
# characters as text); gzip_static serves the .gz, gunzip inflates it for a client without gzip.
server {
    listen 8080;
    root /usr/share/nginx/html;
    location / {
        gzip_static always;
        gunzip on;
        index index.html;
    }
}
