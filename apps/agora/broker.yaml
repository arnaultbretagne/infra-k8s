# The Broker (apps/broker): control API (execution grants, agent access relay). Never
# creates/deletes workloads, unlike the controller — but DOES need read-only Kubernetes API access
# now (found live, P11: relay.ts derives the connecting Session Runtime Pod's workload identity
# from its own real source IP, resolved via the K8s API — this cluster has no service mesh to
# inject an X-Workload-Identity header the way relay.ts's own module doc originally assumed).
# Scoped to get/list pods in agora-runs ONLY (apps/agora-runs/rbac.yaml) — no write access, no
# other namespace, nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agora-broker
  namespace: agora
automountServiceAccountToken: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agora-broker
  namespace: agora
spec:
  # Default is 10, i.e. 10 stale ReplicaSets each pinning the image digest it
  # was rolled out with, which is what kubelet image GC counts as "in use".
  # On a single-node box that turned 3 Deployments into 33 undeletable images
  # (~19 agora-web versions alone) and drove HostRootDiskUsageHigh.
  revisionHistoryLimit: 2
  replicas: 1
  selector:
    matchLabels:
      app: agora-broker
  template:
    metadata:
      labels:
        app: agora-broker
    spec:
      serviceAccountName: agora-broker
      automountServiceAccountToken: true
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: broker
          # agora P13 / ADR 0015 — OneCLI credential grants + relay-owned egress.
          # COUPLED to the OneCLI 1.45.0 bump in ../agora-onecli/onecli.yaml: this broker calls
          # `/v1/agents/{id}/grants`, which does not exist before OneCLI 1.44 (404 on 1.43.3,
          # verified live), and the previous broker calls `/v1/policy/publish`, which is 410 Gone
          # from 1.44 on. Neither version works with the other's OneCLI. Land and roll back together.
          # Built from agora main @ f54d37e. Follows the P13 cutover: the reaper now also cleans up
          # the Agent of an ABANDONED Session, not just a revoked one. Found by auditing this
          # instance right after the 1.45.0 upgrade — 15 `sagt-` Agents whose grants had expired up
          # to 2.7 days earlier were protected forever, because only a revoke ever marks a mapping
          # deleted and an abandoned Session is never revoked.
          image: ghcr.io/arnaultbretagne/agora-broker@sha256:0f75f421a8b12ebd919d3563df3b5200e39990ce81ee581098ae4aaf2a994c3c
          env:
            - { name: PORT, value: "8443" }
            - { name: RELAY_PORT, value: "8444" }
            # Found live, P11: relay.ts's own real workload-identity source (k8s-pod-lookup.ts) —
            # matches the controller's own AGORA_NAMESPACE naming exactly.
            - { name: AGORA_NAMESPACE, value: agora-runs }
            - { name: ONECLI_URL, value: http://onecli.agora-onecli.svc.cluster.local:10254 }
            - { name: ONECLI_GATEWAY_URL, value: http://onecli.agora-onecli.svc.cluster.local:10255 }
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: agora-broker-database-url, key: DATABASE_URL }
            - name: BROKER_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef: { name: agora-broker-encryption-key, key: BROKER_ENCRYPTION_KEY }
            - name: ONECLI_API_KEY
              valueFrom:
                secretKeyRef: { name: agora-broker-onecli, key: ONECLI_API_KEY }
            # Same public trust cert the controller mounts into every Session Runtime Pod (P11
            # finding, agora-runs/onecli-ca.yaml) — the broker's own job is only to verify OneCLI
            # itself hasn't drifted from this operator-pinned value (grant-service.ts).
            - name: AGORA_ONECLI_CA_PEM
              valueFrom:
                configMapKeyRef: { name: agora-onecli-ca, key: ca.pem, optional: true }
            # {containerPath, content}[] — matches what pod-spec.ts actually mounts into every
            # Session Runtime Pod (ONECLI_CA_PATH + AUTH_STUBS_DIR/<key> per agora-runs's own
            # onecli-stubs Secret keys). Real content depends on the Claude Max/ChatGPT credential
            # linking pass (plans/11 Evidence, in progress 2026-08-06) — filled in once the
            # agents' real containerConfig is known from OneCLI itself.
            - name: AGORA_ONECLI_CREDENTIAL_STUBS_JSON
              valueFrom:
                secretKeyRef: { name: agora-broker-onecli, key: AGORA_ONECLI_CREDENTIAL_STUBS_JSON, optional: true }
          ports:
            - { containerPort: 8443, name: control }
            - { containerPort: 8444, name: relay }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 384Mi }
          readinessProbe:
            httpGet: { path: /v1/equipment-catalogue, port: 8443 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /v1/equipment-catalogue, port: 8443 }
            periodSeconds: 30
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: agora-broker
  namespace: agora
spec:
  selector:
    app: agora-broker
  ports:
    - { name: control, port: 8443, targetPort: 8443 }
    - { name: relay, port: 8444, targetPort: 8444 }
