# The new system's own human façade (apps/web) — replaces the OLD system's website.yaml for the
# `agora` namespace's own traffic once cutover happens. Talks to agora-controller for Session
# Runtime lifecycle; owns no state of its own beyond the product database.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agora-web
  namespace: agora
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agora-web
  namespace: agora
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agora-web
  template:
    metadata:
      labels:
        app: agora-web
    spec:
      serviceAccountName: agora-web
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # Built from agora main @ 1914e7c. Fixes a blank page: every image built from a clean
          # tree shipped WITHOUT `dist/client/app.js`, because `build-workspaces.mjs` ran a bare
          # `tsc -p <dir>` and @agora/web is the one package whose build is two steps — the second
          # emits the browser bundle. With the file missing, the server's static handler fell
          # through to the API router and answered the page's own `<script>` tag with
          # `401 Bearer required`; the stylesheets live in `public/` and still loaded, so the shell
          # painted and nothing else did.
          image: ghcr.io/arnaultbretagne/agora-web@sha256:ec753f2d513056cffcea5a97fe9984207fd7f128e74fe0104c7b8ea7798cebe3
          env:
            - { name: PORT, value: "8080" }
            - { name: SESSION_RUNTIME_CONTROLLER_URL, value: http://agora-controller.agora.svc.cluster.local:8443 }
            # Found live, P11: apps/web now calls the Broker's real POST /v1/execution-grants
            # (issue) and POST /v1/execution-grants/{id}/renew directly (broker-grant-client.ts) —
            # this env var and its NetworkPolicy egress rule (networkpolicy.yaml) never existed
            # before because that call didn't either (FAKE_EXECUTION_GRANT_REF placeholder).
            - { name: BROKER_CONTROL_BASE_URL, value: http://agora-broker.agora.svc.cluster.local:8443 }
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: agora-web-database-url, key: DATABASE_URL }
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 384Mi }
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 8080 }
            periodSeconds: 30
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: agora-web
  namespace: agora
spec:
  selector:
    app: agora-web
  ports:
    - { port: 8080, targetPort: 8080 }
