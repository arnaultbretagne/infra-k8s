# The new system's own human façade (apps/web) — replaces the OLD system's website.yaml for the
# `agora` namespace's own traffic once cutover happens. Talks to agora-controller for Session
# Runtime lifecycle; owns no state of its own beyond the product database.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agora-web
  namespace: agora
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agora-web
  namespace: agora
spec:
  # Default is 10, i.e. 10 stale ReplicaSets each pinning the image digest it
  # was rolled out with, which is what kubelet image GC counts as "in use".
  # On a single-node box that turned 3 Deployments into 33 undeletable images
  # (~19 agora-web versions alone) and drove HostRootDiskUsageHigh.
  revisionHistoryLimit: 2
  replicas: 1
  selector:
    matchLabels:
      app: agora-web
  template:
    metadata:
      labels:
        app: agora-web
    spec:
      serviceAccountName: agora-web
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # Built from agora main @ 82271f7 (agora#29). One prompt turn in flight per Session:
          # prompts sent while the Agent is working are now queued and dispatched in order instead
          # of racing straight to it. On 2026-08-09 three of them wedged a Session for eleven
          # hours — codex processed them but never answered their JSON-RPC requests, so three
          # Commands stayed `dispatching`, three turns stayed `running`, and an unfinished turn
          # makes a Session ineligible for the idle reaper. See agora
          # `docs/acp-concurrent-prompt-behaviour.md` for why every ACP Agent we can launch forced
          # a queue rather than a refusal.
          #
          # This process now also settles, at startup, prompt Commands no live connection can ever
          # finish — including the three from that incident, which are still non-terminal.
          image: ghcr.io/arnaultbretagne/agora-web@sha256:9e2418596b2b21290fef986c63220d6e0bbec0405d1e74b0e3256bf195167d14
          env:
            - { name: PORT, value: "8080" }
            - { name: SESSION_RUNTIME_CONTROLLER_URL, value: http://agora-controller.agora.svc.cluster.local:8443 }
            # Found live, P11: apps/web now calls the Broker's real POST /v1/execution-grants
            # (issue) and POST /v1/execution-grants/{id}/renew directly (broker-grant-client.ts) —
            # this env var and its NetworkPolicy egress rule (networkpolicy.yaml) never existed
            # before because that call didn't either (FAKE_EXECUTION_GRANT_REF placeholder).
            - { name: BROKER_CONTROL_BASE_URL, value: http://agora-broker.agora.svc.cluster.local:8443 }
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: agora-web-database-url, key: DATABASE_URL }
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 384Mi }
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 8080 }
            periodSeconds: 30
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: agora-web
  namespace: agora
spec:
  selector:
    app: agora-web
  ports:
    - { port: 8080, targetPort: 8080 }
