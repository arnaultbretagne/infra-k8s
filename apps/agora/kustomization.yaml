# agora.bretagne.dev — Agora's server: the client, the execution mechanics (claims in
# agora-sandboxes, bridge connections) and the log on the `agora` database (apps/agora-system); with
# TEST_ROUTES, the page that plays the specs' cases at /test/. Source: arnaultbretagne/agora,
# apps/server and apps/web. Operators only (OIDC, admin).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agora
resources:
  - namespace.yaml
  - limitrange.yaml
  - ghcr-pull.secrets.yaml
  - signing-key.secrets.yaml
  - grants-key.secrets.yaml
  - oauth2-proxy.secrets.yaml
  - log.secrets.yaml
  - server.yaml
  - server-image.yaml
  - oauth2-proxy.yaml
  - httproute.yaml
  - networkpolicy.yaml
# The server's image, by digest: written by Agora's CI when it proposes a new one, with server-image.yaml.
images:
  - name: ghcr.io/arnaultbretagne/agora-server
    digest: sha256:a1fd299875174ab5f157002a738ff1b09fe05a6cbee3b95bc744718533ac6054
