# agora.bretagne.dev — Agora's server: the client, the execution mechanics (claims in
# agora-sandboxes, bridge connections) and the log on the `agora` database (apps/agora-system); with
# TEST_ROUTES, the page that plays the specs' cases at /test/. Source: arnaultbretagne/agora,
# apps/server and apps/web. Operators only (OIDC, admin).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agora
resources:
  - namespace.yaml
  - limitrange.yaml
  - ghcr-pull.secrets.yaml
  - signing-key.secrets.yaml
  - grants-key.secrets.yaml
  - oauth2-proxy.secrets.yaml
  - log.secrets.yaml
  - files.secrets.yaml
  # Who may call the server without a browser: one service token per caller, each standing for one
  # identity (Agora's docs/specs/log.md, "Identity"). `operator`, the person's e-mail: operator tools run
  # from g4; `live-cases`, the cases' owner c45e0000-…: apps/server/scripts/live-cases.ts. Each key is a
  # JSON object, its token read with
  #   sudo -n k0s kubectl -n agora get secret service-tokens -o jsonpath='{.data.operator}' | base64 -d | jq -r .token
  - service-tokens.secrets.yaml
  - gateway-ca.yaml
  - server.yaml
  - server-image.yaml
  - oauth2-proxy.yaml
  - httproute.yaml
  - networkpolicy.yaml
# The server's image, by digest: written by Agora's CI when it proposes a new one, with server-image.yaml.
images:
  - name: ghcr.io/arnaultbretagne/agora-server
    digest: sha256:fff4ea34153c62dffa2316ae1f3559309e331950b3fcb601325ec3899100d2dd
