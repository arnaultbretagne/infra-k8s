# Proves agora-pg's backups are RESTORABLE, not merely present (project-backup-restore-testing):
# pulls the latest base backup from R2 into a throwaway pod, replays WAL to the earliest consistent
# point, starts PostgreSQL and runs a real query against the real product schema.
#
# Same drill as pocket-id's and agora-onecli's. The health query is deliberately schema-specific
# rather than a bare `SELECT 1` or a table count: a restored-but-empty database passes both of
# those, which is precisely the failure this exists to catch (found live 2026-08-07 on the
# agora-onecli drill, where a copy-paste health query masked an otherwise healthy restore).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: agora-pg-restore-test
  namespace: agora
spec:
  # 05:15 — after this cluster's own 03:15 base backup and clear of pocket-id's (04:00) and
  # agora-onecli's (04:45) drills, so no two restore pods contend on this single node.
  schedule: "15 5 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 600
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 26
            runAsGroup: 102
            fsGroup: 102
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: restore-test
              image: ghcr.io/cloudnative-pg/postgresql:17
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: cnpg-s3-creds
                      key: ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: cnpg-s3-creds
                      key: SECRET_ACCESS_KEY
                - name: PGDATA
                  value: /tmp/pgdata
              command:
                - bash
                - -euo
                - pipefail
                - -c
                - |
                  S3_DEST="s3://bretagne-pg-backups/agora"
                  S3_ENDPOINT="https://938f9d4cdcf888eddea773d0f68615bc.r2.cloudflarestorage.com"
                  # NOT the cluster name — cluster.yaml sets an explicit serverName so this
                  # cluster's barman history never collides with the retired channels-era
                  # cluster's, which also lived under this same destinationPath.
                  SERVER="agora-product"

                  echo "==> Listing backups..."
                  barman-cloud-backup-list --endpoint-url "$S3_ENDPOINT" "$S3_DEST" "$SERVER"

                  echo "==> Restoring latest backup..."
                  barman-cloud-restore --endpoint-url "$S3_ENDPOINT" "$S3_DEST" "$SERVER" latest "$PGDATA"

                  # barman-cloud-restore leaves PGDATA group-writable (fsGroup); PostgreSQL
                  # refuses to start unless the data dir is 0700/0750.
                  chmod 700 "$PGDATA"

                  # Recover: replay WALs then promote immediately. Also neutralise the
                  # CNPG-managed runtime config that doesn't exist in this standalone pod:
                  # TLS certs live at /controller/certificates (absent here) and archiving
                  # would shell out to /controller/manager. Last value in auto.conf wins.
                  cat >> "$PGDATA/postgresql.auto.conf" <<PGCONF
                  restore_command = 'barman-cloud-wal-restore --endpoint-url $S3_ENDPOINT $S3_DEST $SERVER %f %p'
                  recovery_target = immediate
                  recovery_target_action = promote
                  ssl = off
                  archive_mode = off
                  logging_collector = off
                  unix_socket_directories = '/tmp'
                  PGCONF
                  touch "$PGDATA/recovery.signal"

                  # throwaway pod: allow passwordless local connections for the health query
                  # (the CNPG superuser has no password, app creds aren't mounted here).
                  # PREPEND — pg_hba is first-match, CNPG's scram rules must not win first.
                  { printf '%s\n' "local all all trust" "host all all 127.0.0.1/32 trust" "host all all ::1/128 trust"; cat "$PGDATA/pg_hba.conf"; } > "$PGDATA/pg_hba.conf.tmp"
                  mv "$PGDATA/pg_hba.conf.tmp" "$PGDATA/pg_hba.conf"

                  echo "==> Starting PostgreSQL..."
                  pg_ctl -D "$PGDATA" -o "-p 5433 -c listen_addresses=localhost" start -w -t 60

                  echo "==> Checking readiness..."
                  pg_isready -h localhost -p 5433

                  # `postgres` (the CNPG superuser) rather than an app role: the app roles'
                  # passwords live in Secrets this throwaway pod deliberately does not mount.
                  echo "==> Running health query..."
                  WORKSTREAMS=$(psql -h localhost -p 5433 -U postgres -d agora -tAc "SELECT count(*) FROM product.workstreams;")
                  SESSIONS=$(psql -h localhost -p 5433 -U postgres -d agora -tAc "SELECT count(*) FROM product.sessions;")
                  echo "restored: $WORKSTREAMS workstreams, $SESSIONS sessions"
                  # The real product schema must be there AND carry data. A restore that comes
                  # back structurally intact but empty is a failed restore, not a passing drill.
                  if [ "$WORKSTREAMS" -lt 1 ]; then
                    echo "FAIL: restored database has no workstreams" >&2
                    exit 1
                  fi

                  echo "==> Stopping PostgreSQL..."
                  pg_ctl -D "$PGDATA" stop -m fast

                  echo "==> Restore test PASSED"
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 2Gi
