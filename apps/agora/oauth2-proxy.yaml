# OIDC gate (ADR 0021/0022) in front of the server: it creates sandboxes and reads their ACP traffic,
# so ALLOWED_GROUPS=admin, on top of the Pocket-ID client's own group restriction. SSE (the threads)
# passes through unchanged. The server does not take the gate's word for who calls (Agora's
# docs/specs/log.md, "Identity"; IDENTITY=oidc in server.yaml): the gate passes the ID token Pocket-ID
# signed, `Authorization: Bearer`, in place of any the client sent, and the server checks its signature,
# issuer, audience and expiry. X-Forwarded-Email is still set, and the server ignores it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: agora
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy
  template:
    metadata:
      labels:
        app: oauth2-proxy
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
          args:
            - --http-address=0.0.0.0:4180
          securityContext:
            runAsUser: 2000
            runAsGroup: 2000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - { name: OAUTH2_PROXY_PROVIDER, value: oidc }
            - { name: OAUTH2_PROXY_OIDC_ISSUER_URL, value: https://id.bretagne.dev }
            - { name: OAUTH2_PROXY_REDIRECT_URL, value: https://agora.bretagne.dev/oidc/callback }
            - { name: OAUTH2_PROXY_PROXY_PREFIX, value: /oidc }
            - { name: OAUTH2_PROXY_UPSTREAMS, value: http://server.agora.svc.cluster.local:8080 }
            - { name: OAUTH2_PROXY_SCOPE, value: openid email profile groups }
            - { name: OAUTH2_PROXY_OIDC_GROUPS_CLAIM, value: groups }
            - { name: OAUTH2_PROXY_ALLOWED_GROUPS, value: admin }
            - { name: OAUTH2_PROXY_EMAIL_DOMAINS, value: '*' }
            - { name: OAUTH2_PROXY_COOKIE_SECURE, value: "true" }
            - { name: OAUTH2_PROXY_COOKIE_DOMAINS, value: agora.bretagne.dev }
            - { name: OAUTH2_PROXY_WHITELIST_DOMAINS, value: agora.bretagne.dev }
            - { name: OAUTH2_PROXY_REVERSE_PROXY, value: "true" }
            - { name: OAUTH2_PROXY_SKIP_PROVIDER_BUTTON, value: "true" }
            # Pocket-ID does not emit email_verified (known upstream gap, ADR 0021)
            - { name: OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL, value: "true" }
            # The session's ID token, to the server, as `Authorization: Bearer <id_token>`; the client's own
            # Authorization is dropped first (skip-auth-strip-headers, true by default).
            - { name: OAUTH2_PROXY_PASS_AUTHORIZATION_HEADER, value: "true" }
            # Pocket-ID 2.18.0's ID tokens live 1 hour (fosite's default; not set per client). A session older
            # than 30 minutes is refreshed at its next request, before it is passed on: the token the server
            # gets is at most 30 minutes old. Pocket-ID gives a refresh token at every code exchange, whatever
            # the scope (RefreshTokenScopes empty), valid 30 days and rotated, with a 1-minute grace for
            # parallel refreshes; its refresh answer carries a new ID token (openid granted).
            - { name: OAUTH2_PROXY_COOKIE_REFRESH, value: 30m }
          envFrom:
            - secretRef:
                name: oauth2-proxy
          ports:
            - containerPort: 4180
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
          readinessProbe:
            httpGet: { path: /ping, port: 4180 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /ping, port: 4180 }
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
  namespace: agora
spec:
  selector:
    app: oauth2-proxy
  ports:
    - { port: 4180, targetPort: 4180 }
