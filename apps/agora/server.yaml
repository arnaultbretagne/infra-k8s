# Agora's server (apps/server on arnaultbretagne/agora): the client, the execution mechanics and the
# log, on agora.bretagne.dev (docs/specs/executions.md, log.md, credentials.md, assistant-ui.md).
# TEST_ROUTES adds the routes and the page that play the specs' cases (/api/test/…, /test/). Its
# ServiceAccount creates and re-arms claims in agora-sandboxes (apps/agora-sandboxes/rbac.yaml) and
# reviews the Pods' projected tokens; it signs bridge tokens with the private key, and each
# execution's grants for Agora's gateway (docs/credentials.md, ADR 0001). What it remembers — the
# log, the anchors the Pods push — is in the `agora` database (apps/agora-system), through three
# runtime logins. One replica, Recreate: the log admits one owner, and a second Pod would wait for
# the first to let go of the database.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: server
---
# TokenReview: who is pushing an anchor (the Pod a projected token is bound to). Nothing else
# cluster-wide.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agora-server-token-review
rules:
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agora-server-token-review
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agora-server-token-review
subjects:
  - kind: ServiceAccount
    name: server
    namespace: agora
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      serviceAccountName: server
      # Every workspace goes through the server: shed last, like the IdP.
      priorityClassName: bretagne-critical
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: ghcr.io/arnaultbretagne/agora-server # its digest: kustomization.yaml, images
          ports:
            - name: http
              containerPort: 8080
            - name: anchors
              containerPort: 8081
          env:
            - { name: SANDBOX_NAMESPACE, value: agora-sandboxes }
            - { name: SIGNING_KEY_FILE, value: /etc/agora/signing/private.pem }
            # Bounded with the namespace quota (apps/agora-sandboxes/quota.yaml): change both.
            - { name: MAX_ACTIVE, value: "16" }
            - { name: TEST_ROUTES, value: "true" }
            - { name: NODE_OPTIONS, value: "--max-old-space-size=768" }
            # The API server's CA, for the global fetch of the Kubernetes client.
            - { name: NODE_EXTRA_CA_CERTS, value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt }
            # docs/credentials.md: the server signs the execution's grants for Agora's gateway, which
            # sandboxes reach through their bridge.
            - { name: GATEWAY_PROXY, value: "gateway.agora-gateway.svc.cluster.local:3000" }
            - { name: GRANTS_KEY_FILE, value: /etc/agora/grants/private.pem }
            # What the composer's access picker offers, each at its widest access (Agora's
            # docs/specs/credentials.md, "Offered profiles"). The gateway's GitHub PAT
            # (agora-gateway/upstream-credentials) must reach each repository: the grants only narrow
            # it. `internet` is the gateway's route without hosts, public addresses only
            # (apps/agora-gateway): off unless picked for an execution.
            - { name: OFFERED_PROFILES, value: "github:arnaultbretagne/agora:write,github:arnaultbretagne/infra-k8s:write,internet" }
            # Agora's docs/specs/credentials.md, "Limits": the server reads each account's limits
            # through the gateway, with a grant bound to its own address, checked against the
            # gateway's root (gateway-ca.yaml).
            - name: POD_IP
              valueFrom:
                fieldRef: { fieldPath: status.podIP }
            - { name: GATEWAY_CA_FILE, value: /etc/agora/gateway-ca/ca.pem }
          # LOG_WRITER_URL, LOG_PROJECTOR_URL, LOG_ANCHORS_URL.
          envFrom:
            - secretRef:
                name: log
          startupProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 20
            periodSeconds: 3
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
          # The log keeps the Workstreams it follows in memory: a long run of large answers needs
          # room, and Node's heap is sized to the container's limit. The request is the 7-day p95
          # (204Mi, 2026-10-07) plus margin; its CPU is the request-path floor (docs/hosting-an-app.md
          # §4.3), the share it keeps when sandboxes saturate the node.
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - { name: signing, mountPath: /etc/agora/signing, readOnly: true }
            - { name: grants, mountPath: /etc/agora/grants, readOnly: true }
            - { name: gateway-ca, mountPath: /etc/agora/gateway-ca, readOnly: true }
      volumes:
        - name: signing
          secret:
            secretName: signing-key
            defaultMode: 0440
        # Signs each execution's grants for the gateway (its public half: apps/agora-gateway).
        - name: grants
          secret:
            secretName: grants-key
            defaultMode: 0440
        - name: gateway-ca
          configMap:
            name: gateway-ca
---
apiVersion: v1
kind: Service
metadata:
  name: server
spec:
  selector:
    app: server
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: anchors
      port: 8081
      targetPort: anchors
