# Agora's server (apps/server on arnaultbretagne/agora): the client, the execution mechanics and the
# log, on agora.bretagne.dev (docs/specs/executions.md, log.md, credentials.md, assistant-ui.md).
# TEST_ROUTES adds the routes and the page that play the specs' cases (/api/test/…, /test/). Its
# ServiceAccount creates and re-arms claims in agora-sandboxes (apps/agora-sandboxes/rbac.yaml) and
# reviews the Pods' projected tokens; it signs bridge tokens with the private key, and each
# execution's grants for Agora's gateway (docs/credentials.md, ADR 0001). What it remembers — the
# log, the anchors the Pods push — is in the `agora` database (apps/agora-system), through three
# runtime logins. One replica, Recreate: the log admits one owner, and a second Pod would wait for
# the first to let go of the database.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: server
---
# TokenReview: who is pushing an anchor (the Pod a projected token is bound to). Nothing else
# cluster-wide.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agora-server-token-review
rules:
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agora-server-token-review
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agora-server-token-review
subjects:
  - kind: ServiceAccount
    name: server
    namespace: agora
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      serviceAccountName: server
      # Every workspace goes through the server: shed last, like the IdP.
      priorityClassName: bretagne-critical
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: ghcr.io/arnaultbretagne/agora-server # its digest: kustomization.yaml, images
          ports:
            - name: http
              containerPort: 8080
            - name: anchors
              containerPort: 8081
            - name: mcp
              containerPort: 8082
          env:
            - { name: SANDBOX_NAMESPACE, value: agora-sandboxes }
            - { name: SIGNING_KEY_FILE, value: /etc/agora/signing/private.pem }
            # Bounded with the namespace quota (apps/agora-sandboxes/quota.yaml): change both.
            - { name: MAX_ACTIVE, value: "16" }
            - { name: TEST_ROUTES, value: "true" }
            - { name: NODE_OPTIONS, value: "--max-old-space-size=768" }
            # The API server's CA, for the global fetch of the Kubernetes client.
            - { name: NODE_EXTRA_CA_CERTS, value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt }
            # docs/credentials.md: the server signs the execution's grants for Agora's gateway, which
            # sandboxes reach through their bridge.
            - { name: GATEWAY_PROXY, value: "gateway.agora-gateway.svc.cluster.local:3000" }
            - { name: GRANTS_KEY_FILE, value: /etc/agora/grants/private.pem }
            # What the composer's access picker offers, each at its widest access (Agora's
            # docs/specs/credentials.md, "Offered profiles"). The gateway's GitHub Apps
            # (agora-gateway/github-refresher.yaml) are installed on every repository of the account: the
            # grants narrow them; a write offered offers the review too, as agora-reviewer. `internet` is the gateway's route without hosts, public addresses only
            # (apps/agora-gateway): off unless picked for an execution. `vault:write` covers `vault:read` too (the
            # vault MCP, route `vault`); `kubernetes:read` reads the cluster (route `kubernetes`); `previews`
            # reaches the previews through their gateway gate (route `previews`), and a judge is given it;
            # `agora:read` opens Agora's own MCP server to the agent — search and read its person's Workstreams (route `agora`);
            # `agora:delegate` lets it hand work to another agent there, a sub-stream of its Workstream, rights beyond its own
            # waiting for the person's Approve (Agora's docs/specs/delegation.md). `antigravity` opens Cloud Code and
            # the user info on the cluster's own Google login (routes `antigravity`, `antigravity-userinfo`) to an
            # execution on any harness, not only agy's pool, whose base profile it is.
            - { name: OFFERED_PROFILES, value: "github:arnaultbretagne/agora:write,github:arnaultbretagne/infra-k8s:write,internet,antigravity,vault:write,kubernetes:read,previews,agora:read,agora:delegate" }
            # Agora's docs/specs/credentials.md, "Limits": the server reads each account's limits
            # through the gateway, with a grant bound to its own address, checked against the
            # gateway's root (gateway-ca.yaml).
            - name: POD_IP
              valueFrom:
                fieldRef: { fieldPath: status.podIP }
            - { name: GATEWAY_CA_FILE, value: /etc/agora/gateway-ca/ca.pem }
            # Agora's docs/specs/files.md, "The server": the files live in R2, in the bucket agora-files; the
            # server alone writes there (networkpolicy.yaml), with the token of files.secrets.yaml.
            - { name: FILES_ENDPOINT, value: "https://938f9d4cdcf888eddea773d0f68615bc.r2.cloudflarestorage.com" }
            - { name: FILES_BUCKET, value: agora-files }
            # Agora's docs/specs/log.md, "Identity": who calls port 8080 is what the request proves, never where
            # it comes from. The browser's proof is the ID token Pocket-ID signed for the client `agora`, which
            # oauth2-proxy passes (oauth2-proxy.yaml); the server checks it against Pocket-ID's published keys
            # (discovered at IDENTITY_ISSUER, fetched over HTTPS: networkpolicy.yaml). The audience is that
            # client's id: OAUTH2_PROXY_CLIENT_ID of oauth2-proxy.secrets.yaml, not a secret; a client recreated
            # in Pocket-ID changes both. Without a valid proof, 401; X-Forwarded-Email grants nothing.
            - { name: IDENTITY, value: oidc }
            - { name: IDENTITY_ISSUER, value: "https://id.bretagne.dev" }
            - { name: IDENTITY_AUDIENCE, value: 83e98a94-9882-4e10-a0eb-784fb6187d9e }
            # A caller without a browser — a script, an operator tool on the node — presents a service token
            # (service-tokens.secrets.yaml), read once at start: a changed token takes a restart.
            - { name: IDENTITY_TOKENS_DIR, value: /etc/agora/service-tokens }
          # LOG_WRITER_URL, LOG_PROJECTOR_URL, LOG_ANCHORS_URL; FILES_ACCESS_KEY_ID, FILES_SECRET_ACCESS_KEY;
          # PUSH_VAPID_PUBLIC_KEY, PUSH_VAPID_PRIVATE_KEY, PUSH_SUBJECT, PUBLIC_URL — all four from one Secret, or none:
          # Agora's server refuses to start with some of them (docs/specs/notifications.md, "Configuration"). It sends
          # to the push services (web.push.apple.com, fcm.googleapis.com…) over HTTPS to the world (networkpolicy.yaml).
          envFrom:
            - secretRef:
                name: log
            - secretRef:
                name: files
            - secretRef:
                name: push
                optional: true
          # A projector version bump rebuilds every projection before the server answers: about 61 s
          # for 490,000 entries in 2026-11 (Agora PR #214). 300 s leaves room for the log to grow.
          startupProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 100
            periodSeconds: 3
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
          # The log keeps the Workstreams it follows in memory: a long run of large answers needs
          # room, and Node's heap is sized to the container's limit. The request is the 7-day p95
          # (204Mi, 2026-10-07) plus margin; its CPU is the request-path floor (docs/hosting-an-app.md
          # §4.3), the share it keeps when sandboxes saturate the node.
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - { name: signing, mountPath: /etc/agora/signing, readOnly: true }
            - { name: grants, mountPath: /etc/agora/grants, readOnly: true }
            - { name: gateway-ca, mountPath: /etc/agora/gateway-ca, readOnly: true }
            - { name: service-tokens, mountPath: /etc/agora/service-tokens, readOnly: true }
      volumes:
        - name: signing
          secret:
            secretName: signing-key
            defaultMode: 0440
        # Signs each execution's grants for the gateway (its public half: apps/agora-gateway).
        - name: grants
          secret:
            secretName: grants-key
            defaultMode: 0440
        - name: gateway-ca
          configMap:
            name: gateway-ca
        # One file per caller, the identity its token stands for (service-tokens.secrets.yaml).
        - name: service-tokens
          secret:
            secretName: service-tokens
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: server
spec:
  selector:
    app: server
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: anchors
      port: 8081
      targetPort: anchors
    - name: mcp
      port: 8082
      targetPort: mcp
