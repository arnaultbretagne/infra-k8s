# What the server's image is built from (kustomization.yaml, images, holds its digest). Written by
# Agora's CI when it proposes a new image (arnaultbretagne/agora, .github/workflows/ci.yml); never
# applied.
apiVersion: v1
kind: ConfigMap
metadata:
  name: agora-server-image
  annotations:
    config.kubernetes.io/local-config: "true"
data:
  source: arnaultbretagne/agora main 799d33d
  inputs: "25bd3c4a475c7ba5"
