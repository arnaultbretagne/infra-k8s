# The `agora` namespace's own east-west policy (docs/hosting-an-app.md §7, ADR 0006/0020) —
# CiliumNetworkPolicy throughout (not plain NetworkPolicy) because the controller's own
# kube-apiserver egress needs Cilium's `toEntities: [kube-apiserver]`, unavailable in the plain API
# — kept consistent across all three components rather than mixing frameworks.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agora-web
  namespace: agora
spec:
  endpointSelector:
    matchLabels:
      app: agora-web
  ingress:
    - fromEntities: [host] # kubelet probes
      toPorts:
        - ports: [{ port: "8080", protocol: TCP }]
    - fromEndpoints:
        - matchLabels:
            app: oauth2-proxy
      toPorts:
        - ports: [{ port: "8080", protocol: TCP }]
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports: [{ port: "53", protocol: UDP }, { port: "53", protocol: TCP }]
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: agora-pg
      toPorts:
        - ports: [{ port: "5432", protocol: TCP }]
    - toEndpoints:
        - matchLabels:
            app: agora-controller
      toPorts:
        - ports: [{ port: "8443", protocol: TCP }]
    # Found live, P11: apps/web now calls the Broker's real POST /v1/execution-grants (issue) and
    # POST /v1/execution-grants/{id}/renew directly (broker-grant-client.ts) — this egress rule
    # never existed before because that call didn't either (FAKE_EXECUTION_GRANT_REF placeholder).
    - toEndpoints:
        - matchLabels:
            app: agora-broker
      toPorts:
        - ports: [{ port: "8443", protocol: TCP }]
    # Found live, P11: apps/web's own connectAcpBridge (orchestration.ts) dials the Session
    # Runtime Pod's own IP DIRECTLY (the controller's handleOpenAcpConnection mints
    # `${podIp}:${bridge.listenPort}`, never proxying through itself) — same path
    # agora-controller's own equivalent egress rule below already covers for ITS OWN bridge
    # connections; agora-runs's own ingress rule is the other half (agora-runs/networkpolicy.yaml).
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agora-runs
            agora.dev/app: session-runtime
      toPorts:
        - ports: [{ port: "8080", protocol: TCP }]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agora-controller
  namespace: agora
spec:
  endpointSelector:
    matchLabels:
      app: agora-controller
  ingress:
    - fromEntities: [host] # kubelet probes
      toPorts:
        - ports: [{ port: "8443", protocol: TCP }]
    - fromEndpoints:
        - matchLabels:
            app: agora-web
      toPorts:
        - ports: [{ port: "8443", protocol: TCP }]
    # Session Runtime Pods pulling their custody restore stream (agora-runs's own egress rule,
    # the other half of this same path).
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agora-runs
            agora.dev/app: session-runtime
      toPorts:
        - ports: [{ port: "8443", protocol: TCP }]
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports: [{ port: "53", protocol: UDP }, { port: "53", protocol: TCP }]
    # Pod/ServiceAccount CRUD in agora-runs — rbac.yaml (agora-runs) scopes what it can actually do.
    # Found live, P11: 443 is the kubernetes.default.svc ClusterIP's own exposed port (what
    # k8s-client.ts's API_PORT actually dials) — but Cilium's kube-apiserver entity match enforces
    # against the REAL backend port (6443, the node's own API server), same as apps/agent's own
    # already-working equivalent rule (networkpolicy.yaml, agent-runs/agora-pg). 443 here silently
    # timed out every real materialize call (connect ETIMEDOUT 10.96.0.1:443) — no Pod, no error
    # until this segment's own Problem.detail surfacing fix made the real cause visible at all.
    - toEntities: [kube-apiserver]
      toPorts:
        - ports: [{ port: "6443", protocol: TCP }]
    - toEndpoints:
        - matchLabels:
            app: agora-broker
      toPorts:
        - ports: [{ port: "8443", protocol: TCP }]
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: agora-pg
      toPorts:
        - ports: [{ port: "5432", protocol: TCP }]
    # The controller's own ACP bridge connection into a Session Runtime Pod (agora-runs's own
    # ingress rule, the other half of this same path).
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agora-runs
            agora.dev/app: session-runtime
      toPorts:
        - ports: [{ port: "8080", protocol: TCP }]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agora-broker
  namespace: agora
spec:
  endpointSelector:
    matchLabels:
      app: agora-broker
  ingress:
    - fromEntities: [host] # kubelet probes
      toPorts:
        - ports: [{ port: "8443", protocol: TCP }]
    - fromEndpoints:
        - matchLabels:
            app: agora-controller
      toPorts:
        - ports: [{ port: "8443", protocol: TCP }]
    # Found live, P11: apps/web's own real execution-grant issue/renew calls (the other half of
    # agora-web's own new egress rule above).
    - fromEndpoints:
        - matchLabels:
            app: agora-web
      toPorts:
        - ports: [{ port: "8443", protocol: TCP }]
    # Session Runtime Pods' access relay traffic (agora-runs's own egress rule, the other half).
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agora-runs
            agora.dev/app: session-runtime
      toPorts:
        - ports: [{ port: "8444", protocol: TCP }]
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports: [{ port: "53", protocol: UDP }, { port: "53", protocol: TCP }]
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: agora-pg
      toPorts:
        - ports: [{ port: "5432", protocol: TCP }]
    # Found live, P11: relay.ts's own real workload-identity source (k8s-pod-lookup.ts, read-only
    # get/list pods in agora-runs, apps/agora-runs/rbac.yaml). 6443, not 443 — Cilium's
    # toEntities: [kube-apiserver] match enforces against the real backend port, not the
    # kubernetes.default.svc ClusterIP's own exposed port (already found live once this same
    # session, apps/agora-runs's own egress rule right above this one's controller equivalent).
    - toEntities: [kube-apiserver]
      toPorts:
        - ports: [{ port: "6443", protocol: TCP }]
    # The one path to any provider — agora-onecli's own ingress rule already scopes this to
    # agora-broker specifically (apps/agora-onecli/networkpolicy.yaml).
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agora-onecli
            app: onecli
      toPorts:
        - ports: [{ port: "10254", protocol: TCP }, { port: "10255", protocol: TCP }]
---
# The public OIDC gate (agora.bretagne.dev) — mirrors apps/code-server's/apps/agora-onecli's own
# oauth2-proxy CiliumNetworkPolicy exactly.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: oauth2-proxy
  namespace: agora
spec:
  endpointSelector:
    matchLabels:
      app: oauth2-proxy
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik
      toPorts:
        - ports: [{ port: "4180", protocol: TCP }]
    - fromEntities: [host] # kubelet probes
      toPorts:
        - ports: [{ port: "4180", protocol: TCP }]
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports: [{ port: "53", protocol: UDP }, { port: "53", protocol: TCP }]
    - toEndpoints:
        - matchLabels:
            app: agora-web
      toPorts:
        - ports: [{ port: "8080", protocol: TCP }]
    # -> id.bretagne.dev (OIDC discovery/token). The public IP resolves to the node, then
    # kube-proxy DNATs to the Traefik pod — allow both paths.
    - toEntities: [world, host]
      toPorts:
        - ports: [{ port: "443", protocol: TCP }]
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik
      toPorts:
        - ports: [{ port: "8443", protocol: TCP }]
---
# --- agora-pg: this namespace's own product database (cluster.yaml) ---
#
# Cilium is default-deny for any endpoint a policy selects, and a CNPG instance needs FOUR distinct
# ingress paths, not one. Found live on the retired cluster: a policy carrying only the app rule
# left the operator unable to reach the instance manager's status endpoint, surfacing as a
# permanent "Instance Status Extraction Error" with the database itself perfectly healthy.
#
# Equally load-bearing, and learned the hard way on 2026-08-06: `kubectl port-forward` and kubelet
# probes both BYPASS Cilium's pod-to-pod enforcement, so neither proves connectivity here. The
# missing app->postgres rule on the retired cluster survived several rounds of "verified the
# database is reachable" for exactly that reason. Verify from inside a real pod, with a real query.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agora-pg
  namespace: agora
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: agora-pg
  ingress:
    # 1. the three workloads -> postgres
    - fromEndpoints:
        - matchLabels:
            app: agora-web
        - matchLabels:
            app: agora-controller
        - matchLabels:
            app: agora-broker
      toPorts:
        - ports: [{ port: "5432", protocol: TCP }]
    # 2. CNPG operator -> instance (status :8000 + SQL :5432 for management)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
            k8s:app.kubernetes.io/name: cloudnative-pg
      toPorts:
        - ports:
            - { port: "8000", protocol: TCP }
            - { port: "5432", protocol: TCP }
    # 3. intra-cluster (replication / future HA) + kubelet probes -> status :8000
    - fromEndpoints:
        - matchLabels:
            cnpg.io/cluster: agora-pg
      toPorts:
        - ports:
            - { port: "5432", protocol: TCP }
            - { port: "8000", protocol: TCP }
    - fromEntities: [host]
      toPorts:
        - ports: [{ port: "8000", protocol: TCP }]
    # 4. Prometheus (observability) -> CNPG metrics :9187 (PodMonitor)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports: [{ port: "9187", protocol: TCP }]
  egress:
    # instance manager -> kube-apiserver. 6443, not 443: Cilium's kube-apiserver entity match
    # enforces against the real backend port, not the kubernetes.default.svc ClusterIP's.
    - toEntities: [kube-apiserver]
      toPorts:
        - ports: [{ port: "6443", protocol: TCP }]
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
    # barman backups -> S3 / Cloudflare R2 (external HTTPS). Tighten to toFQDNs later.
    - toEntities: [world]
      toPorts:
        - ports: [{ port: "443", protocol: TCP }]
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: agora-pg
      toPorts:
        - ports:
            - { port: "5432", protocol: TCP }
            - { port: "8000", protocol: TCP }
