# Default-deny plus the flows of the server: Traefik → oauth2-proxy → server; the server reaches the
# Kubernetes API (claims), the sandboxes' bridge port, its database, the gateway (the accounts'
# limits), R2 (the files), id.bretagne.dev (Pocket-ID's keys, to check who calls) and the Web Push
# services (the notifications, push.secrets.yaml), nothing else.
# The other half of the bridge flow is apps/agora-sandboxes/networkpolicy.yaml,
# of the gateway's apps/agora-gateway/networkpolicy.yaml.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny
spec:
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: server
spec:
  endpointSelector:
    matchLabels:
      app: server
  ingress:
    - fromEndpoints:
        - matchLabels:
            app: oauth2-proxy
      toPorts:
        - ports: [{ port: "8080", protocol: TCP }]
    # kubelet probes (/healthz, open), and the scripted cases and operator tools run from the node, each
    # with its service token: reaching the port proves nothing (server.yaml, IDENTITY).
    - fromEntities: [host]
      toPorts:
        - ports: [{ port: "8080", protocol: TCP }, { port: "8081", protocol: TCP }]
    # The MCP server (Agora's docs/specs/mcp.md): the gateway alone, whose route `agora` has checked the
    # execution's JWT and forwards it, which the server checks again — reaching the port proves nothing
    # (apps/agora-gateway/networkpolicy.yaml, the other half). No other Pod, the sandboxes included; the node
    # reaches it anyway, as Cilium lets a node reach every port of its Pods (measured 2026-11-02: 401 from g4).
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agora-gateway
            app: gateway
      toPorts:
        - ports: [{ port: "8082", protocol: TCP }]
    # The anchor receiver: the sandboxes push there when their Pod ends, and reach nothing else.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agora-sandboxes
            app.kubernetes.io/part-of: agora-sandboxes
      toPorts:
        - ports: [{ port: "8081", protocol: TCP }]
  egress:
    # kubernetes.default.svc has to resolve before the API server can be reached.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports: [{ port: "53", protocol: UDP }, { port: "53", protocol: TCP }]
    - toEntities: [kube-apiserver]
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agora-sandboxes
            app.kubernetes.io/part-of: agora-sandboxes
      toPorts:
        - ports: [{ port: "8080", protocol: TCP }]
    # The log's database (apps/agora-system/postgres.yaml).
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agora-system
            cnpg.io/cluster: agora-pg
      toPorts:
        - ports: [{ port: "5432", protocol: TCP }]
    # The gateway, for the accounts' limits it reads there itself (Agora's credentials.md, "Limits").
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agora-gateway
            app: gateway
      toPorts:
        - ports: [{ port: "3000", protocol: TCP }]
    # R2, where Agora's files live (Agora's docs/specs/files.md): the bucket `agora-files` on
    # *.r2.cloudflarestorage.com. HTTPS to the world, as for the other apps (no toFQDNs: docs/hosting-an-app.md).
    # Also id.bretagne.dev, Pocket-ID's discovery document and keys (server.yaml, IDENTITY_ISSUER): over
    # HTTPS by its public name, the address its discovery document gives, so the keys are the ones its
    # certificate vouches for — the in-cluster Service is plain HTTP on 1411. The name resolves to the
    # line's public address (world), which the router sends back to the node; a node holding the
    # address itself is `host`, and Cilium may translate it to the Traefik Pod: the three ways every
    # gate's policy allows (oauth2-proxy below). And the Web Push services a subscription names —
    # web.push.apple.com, fcm.googleapis.com, updates.push.services.mozilla.com, *.notify.windows.com (Agora's
    # docs/specs/notifications.md, "Subscriptions") —, over the same HTTPS to the world.
    - toEntities: [world, host]
      toPorts:
        - ports: [{ port: "443", protocol: TCP }]
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik
      toPorts:
        - ports: [{ port: "8443", protocol: TCP }]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: oauth2-proxy
spec:
  endpointSelector:
    matchLabels:
      app: oauth2-proxy
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik
      toPorts:
        - ports: [{ port: "4180", protocol: TCP }]
    - fromEntities: [host] # kubelet probes
      toPorts:
        - ports: [{ port: "4180", protocol: TCP }]
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports: [{ port: "53", protocol: UDP }, { port: "53", protocol: TCP }]
    - toEndpoints:
        - matchLabels:
            app: server
      toPorts:
        - ports: [{ port: "8080", protocol: TCP }]
    # -> id.bretagne.dev (OIDC discovery/token): the public IP resolves to the node, then kube-proxy
    # DNATs to Traefik — both paths, as for agent-vault's gate.
    - toEntities: [world, host]
      toPorts:
        - ports: [{ port: "443", protocol: TCP }]
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik
      toPorts:
        - ports: [{ port: "8443", protocol: TCP }]
