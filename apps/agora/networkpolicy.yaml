# Default-deny plus the flows of the server: Traefik → oauth2-proxy → server; the server reaches the
# Kubernetes API (claims), the sandboxes' bridge port, its database and the gateway (the accounts'
# limits), nothing else. The other half of the bridge flow is apps/agora-sandboxes/networkpolicy.yaml,
# of the gateway's apps/agora-gateway/networkpolicy.yaml.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny
spec:
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: server
spec:
  endpointSelector:
    matchLabels:
      app: server
  ingress:
    - fromEndpoints:
        - matchLabels:
            app: oauth2-proxy
      toPorts:
        - ports: [{ port: "8080", protocol: TCP }]
    - fromEntities: [host] # kubelet probes, and the scripted cases run from the node
      toPorts:
        - ports: [{ port: "8080", protocol: TCP }, { port: "8081", protocol: TCP }]
    # Prefect's worker (apps/prefect): its flows drive Workstreams through the API, without the OIDC
    # gate, so this rule is what bounds who may act on Agora from inside the cluster.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: prefect
            app.kubernetes.io/name: prefect-worker
      toPorts:
        - ports: [{ port: "8080", protocol: TCP }]
    # The anchor receiver: the sandboxes push there when their Pod ends, and reach nothing else.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agora-sandboxes
            app.kubernetes.io/part-of: agora-sandboxes
      toPorts:
        - ports: [{ port: "8081", protocol: TCP }]
  egress:
    # kubernetes.default.svc has to resolve before the API server can be reached.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports: [{ port: "53", protocol: UDP }, { port: "53", protocol: TCP }]
    - toEntities: [kube-apiserver]
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agora-sandboxes
            app.kubernetes.io/part-of: agora-sandboxes
      toPorts:
        - ports: [{ port: "8080", protocol: TCP }]
    # The log's database (apps/agora-system/postgres.yaml).
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agora-system
            cnpg.io/cluster: agora-pg
      toPorts:
        - ports: [{ port: "5432", protocol: TCP }]
    # The gateway, for the accounts' limits it reads there itself (Agora's credentials.md, "Limits").
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agora-gateway
            app: gateway
      toPorts:
        - ports: [{ port: "3000", protocol: TCP }]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: oauth2-proxy
spec:
  endpointSelector:
    matchLabels:
      app: oauth2-proxy
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik
      toPorts:
        - ports: [{ port: "4180", protocol: TCP }]
    - fromEntities: [host] # kubelet probes
      toPorts:
        - ports: [{ port: "4180", protocol: TCP }]
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports: [{ port: "53", protocol: UDP }, { port: "53", protocol: TCP }]
    - toEndpoints:
        - matchLabels:
            app: server
      toPorts:
        - ports: [{ port: "8080", protocol: TCP }]
    # -> id.bretagne.dev (OIDC discovery/token): the public IP resolves to the node, then kube-proxy
    # DNATs to Traefik — both paths, as for agent-vault's gate.
    - toEntities: [world, host]
      toPorts:
        - ports: [{ port: "443", protocol: TCP }]
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik
      toPorts:
        - ports: [{ port: "8443", protocol: TCP }]
