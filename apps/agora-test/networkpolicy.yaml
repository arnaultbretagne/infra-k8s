# Default-deny plus the only two flows a static page needs: Traefik in, kubelet probes in.
# No egress beyond DNS: the page makes no outbound call, and nginx resolves nothing.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: showcase
spec:
  endpointSelector:
    matchLabels:
      app: showcase
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik
      toPorts:
        - ports: [{ port: "8080", protocol: TCP }]
    - fromEntities: [host] # kubelet probes
      toPorts:
        - ports: [{ port: "8080", protocol: TCP }]
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports: [{ port: "53", protocol: UDP }, { port: "53", protocol: TCP }]
