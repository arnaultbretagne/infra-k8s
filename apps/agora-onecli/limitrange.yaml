# docs/hosting-an-app.md §8: defaults-only safety net (never rejects; backstops pods that forget
# requests/limits). Every workload here already sets explicit values — this is the belt.
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: agora-onecli
spec:
  limits:
    - type: Container
      defaultRequest: { cpu: 25m, memory: 64Mi }
      default: { memory: 256Mi }
