# OneCLI's own backing store — the SAME image/config apps/broker/live-verification/03-postgres.yaml
# proved live, promoted here to a real Deployment (not a bare Pod) for restart resilience, PVC-backed
# so data survives a restart (unlike the ORIGINAL spike's `emptyDir`, which lost CA continuity —
# ONECLI-SPIKE.md).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: onecli-postgres-data
  namespace: agora-onecli
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onecli-postgres
  namespace: agora-onecli
spec:
  replicas: 1
  strategy:
    type: Recreate          # RWO PVC
  selector:
    matchLabels:
      app: onecli-postgres
  template:
    metadata:
      labels:
        app: onecli-postgres
    spec:
      # docs/hosting-an-app.md §12 gotcha: local-path PVs are hostPath-backed, kubelet skips
      # fsGroup on them — a non-root postgres (uid 70, confirmed via `docker run --entrypoint sh
      # postgres:17-alpine -c 'id postgres'`) can't write a freshly-provisioned root:shared dir.
      # Root init chown, idempotent, rebuild-safe.
      initContainers:
        - name: fix-permissions
          image: postgres:17-alpine
          command: ["sh", "-c", "chown -R 70:70 /var/lib/postgresql/data"]
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
          securityContext:
            runAsUser: 0
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - { name: POSTGRES_DB, value: onecli }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: onecli-postgres, key: POSTGRES_PASSWORD }
          ports:
            - containerPort: 5432
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data, subPath: pgdata }
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 2
            periodSeconds: 2
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: onecli-postgres-data
        - { name: run, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: onecli-postgres
  namespace: agora-onecli
spec:
  selector:
    app: onecli-postgres
  ports:
    - { port: 5432, targetPort: 5432 }
