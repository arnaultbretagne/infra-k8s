# Disaster-recovery capture of OneCLI's /app/data — the half of OneCLI that cluster.yaml's CNPG
# backup does NOT protect.
#
# WHY THIS EXISTS. The CNPG backup covers the database, and its restore drill (restore-test.yaml)
# proves that database comes back. But every provider credential in that database is CIPHERTEXT
# under `secret-encryption-key`, and `gateway/ca.key`+`ca.pem` are the CA every Session Runtime
# Pod pins (mounted as the `agora-onecli-ca` ConfigMap in the `agora` namespace). All three live
# on a `local-path` PVC — node-local, single copy, no backup of any kind. Losing that disk means:
# the database restores perfectly and NONE of it can be decrypted, and every Session breaks on a CA
# that no longer matches. A backup of the ciphertext alone is not a backup. Found 2026-08-07 while
# auditing P11's own task list, which asks in as many words to prove restore of
# "OneCLI DB + CA/private key + encryption key".
#
# WHY A SOPS FILE AND NOT A DEPLOYED SECRET. This is deliberately NOT in kustomization.yaml. Its
# job is to exist encrypted in git under the age key (backed up off-site), not to be materialised
# into etcd — a second live copy of the encryption key would widen exposure and buy nothing, since
# OneCLI reads these from its own volume, not from a Secret.
#
# DRIFT. OneCLI generated all of this once at first boot (2026-08-06 09:36) and has not rotated it
# since. If OneCLI ever regenerates the CA, this capture goes stale and the restore silently
# produces a CA that no Pod trusts — re-capture after any event that touches /app/data.
#
# RESTORE. Recreate the PVC, then write the four files back into /app/data (mode 0600 for
# secret-encryption-key and gateway/ca.key, 0644 for the rest, owner 1000:1000) BEFORE starting
# OneCLI — it generates fresh ones if they are absent, which would orphan every stored credential.
# Then restore the database from CNPG as usual.
