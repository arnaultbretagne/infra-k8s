# Unlike apps/broker/live-verification/08-network-policy.yaml's "same-namespace-only" rule (fine
# for a disposable test instance nothing else needed to reach), this is a REAL cross-namespace
# dependency: agora-broker (namespace `agora`) is the one workload allowed to reach OneCLI's control
# API and gateway. OneCLI's own OUTBOUND egress is intentionally left unrestricted by this policy —
# unlike a Session Runtime Pod, OneCLI itself is the ONE component this architecture expects to
# reach providers directly (ADR 0014).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: onecli-ingress-from-broker-only
  namespace: agora-onecli
spec:
  podSelector:
    matchLabels:
      app: onecli
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agora
          podSelector:
            matchLabels:
              app: agora-broker
      ports:
        - { protocol: TCP, port: 10254 }
        - { protocol: TCP, port: 10255 }
    # The oauth2-proxy gate — same-namespace, dashboard/API port only (never the gateway port,
    # human operators never need it).
    - from:
        - podSelector:
            matchLabels:
              app: oauth2-proxy
      ports:
        - { protocol: TCP, port: 10254 }
---
# docs/hosting-an-app.md §7/§10.3: the oauth2-proxy gate itself — mirrors apps/code-server's own
# oauth2-proxy CiliumNetworkPolicy (Cilium enforces both plain NetworkPolicy and this CRD; this one
# needs `toEntities`, which the plain API can't express).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: oauth2-proxy
  namespace: agora-onecli
spec:
  endpointSelector:
    matchLabels:
      app: oauth2-proxy
  ingress:
    # Traefik serves onecli.bretagne.dev -> proxy :4180
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik
      toPorts:
        - ports: [{ port: "4180", protocol: TCP }]
    # kubelet probes
    - fromEntities: [host]
      toPorts:
        - ports: [{ port: "4180", protocol: TCP }]
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
    # -> upstream OneCLI dashboard/API
    - toEndpoints:
        - matchLabels:
            app: onecli
      toPorts:
        - ports: [{ port: "10254", protocol: TCP }]
    # -> id.bretagne.dev (OIDC discovery/token). The public IP resolves to the node, then
    # kube-proxy DNATs to the Traefik pod — allow both paths (code-server's own pattern).
    - toEntities: [world, host]
      toPorts:
        - ports:
            - { port: "443", protocol: TCP }
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik
      toPorts:
        - ports: [{ port: "8443", protocol: TCP }]
---
# The CNPG-managed store (cluster.yaml). Modelled on apps/pocket-id/networkpolicy.yaml's own CNPG
# block — found live, P11: my first version only allowed onecli->5432 and observability->9187, which
# left the operator unable to reach the instance manager's status port and the Cluster reported
# "Instance Status Extraction Error: HTTP communication issue". A CNPG instance needs FOUR ingress
# paths, not one.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: onecli-pg
  namespace: agora-onecli
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: onecli-pg
  ingress:
    # OneCLI itself -> postgres
    - fromEndpoints:
        - matchLabels:
            app: onecli
      toPorts:
        - ports: [{ port: "5432", protocol: TCP }]
    # CNPG operator -> instance (status :8000 + SQL :5432 for management)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
            k8s:app.kubernetes.io/name: cloudnative-pg
      toPorts:
        - ports:
            - { port: "8000", protocol: TCP }
            - { port: "5432", protocol: TCP }
    # intra-cluster (replication / future HA)
    - fromEndpoints:
        - matchLabels:
            cnpg.io/cluster: onecli-pg
      toPorts:
        - ports:
            - { port: "5432", protocol: TCP }
            - { port: "8000", protocol: TCP }
    # kubelet probes -> status :8000
    - fromEntities: [host]
      toPorts:
        - ports: [{ port: "8000", protocol: TCP }]
    # Prometheus -> CNPG metrics :9187 (PodMonitor)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports: [{ port: "9187", protocol: TCP }]
