apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: onecli
  namespace: agora-onecli
spec:
  parentRefs:
    - name: bretagne-gateway
      namespace: traefik
      sectionName: https-onecli
  hostnames:
    - onecli.bretagne.dev
  rules:
    - filters:
        # HSTS (S8). Conservative 1-day max-age for the initial rollout.
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: "max-age=86400; includeSubDomains"
      backendRefs:
        - name: oauth2-proxy
          port: 4180
