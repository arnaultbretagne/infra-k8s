# P11 (agora refactoring branch): the production, GitOps-managed self-hosted OneCLI instance the
# real `agora-broker` (namespace `agora`) talks to. Deliberately a FRESH instance, not a promotion
# of `agora-onecli-test` (apps/broker/live-verification/, applied out-of-band via `kubectl apply -f`,
# bare Pods, disposable-by-its-own-README) — the operator chose a clean build over reusing the test
# instance's already-linked credentials (2026-08-06). Own namespace, same as the test instance and
# the OLD system's own agent-runtime OneCLI precedent: OneCLI is the one component this architecture
# expects to reach providers directly (ADR 0014), so it deliberately sits outside both `agora` and
# `agora-runs`'s own narrower trust boundaries.
apiVersion: v1
kind: Namespace
metadata:
  name: agora-onecli
  labels:
    agora.dev/purpose: onecli-production
    # 'restricted' rejects ANY root container, init or not — verified live: it blocked the
    # chown initContainers postgres.yaml/onecli.yaml need for the local-path/fsGroup gotcha
    # (docs/hosting-an-app.md §12). 'baseline' is that same doc's own sanctioned escape hatch
    # ("Infra components that can't (yet) run non-root... leave a # TODO: restricted") — main
    # containers still declare full non-root/drop-ALL/no-priv-esc hardening, just not
    # admission-enforced at the init-container step.
    # TODO: restricted — revisit if a non-root-compatible chown path is found (e.g. a
    # storageClass that isn't hostPath-backed, so fsGroup itself would suffice).
    pod-security.kubernetes.io/enforce: baseline
