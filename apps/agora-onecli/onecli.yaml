# Self-hosted OneCLI (ADR 0013), pinned by digest. This IS a fresh instance (2026-08-06 operator
# decision, not a promotion of the test one), PVC-backed `/app/data` from the start.
#
# 2026-08-09, agora P13 / ADR 0015 — pinned 1.43.3 -> 1.45.0. READ BEFORE APPLYING SEPARATELY:
#
# This bump is COUPLED to the agora-broker image bump in ../agora/broker.yaml and neither half
# works with the other's old half. Measured, not assumed:
#   * old broker + OneCLI >=1.44: `/v1/policy/rules` + `/v1/policy/publish` answer `410 Gone`
#     ("project rules are compiled from agent credential grants, not authored directly"), so the
#     broker's grant-issue path fails on every request;
#   * new broker + OneCLI 1.43.3: `GET /v1/agents/{id}/grants` answers `404` (verified live against
#     this very instance), so the broker's credential-grant sync fails on every request.
# Land them in one commit. Rolling back means rolling BOTH back.
#
# On first start of 1.45.0 the `[grant-conversion]` boot converter materializes each existing
# `secretMode: all` Agent's whole credential pool as explicit per-Agent grants. The broker does not
# trust that outcome: it refuses to issue for any Agent whose effective credential set is larger
# than what it attached, and its orphan reaper deletes the `sagt-` Agents no live Session accounts
# for. Expect the pre-upgrade orphans to disappear within one reap cycle of the new broker.
#
# 1.45.0 = ghcr.io/onecli/onecli:1.45.0, resolved to the digest below from the GHCR manifest on
# 2026-08-09; it is the newest tag the upstream repository publishes.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: onecli-app-data
  namespace: agora-onecli
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onecli
  namespace: agora-onecli
spec:
  replicas: 1
  strategy:
    type: Recreate          # RWO PVC
  selector:
    matchLabels:
      app: onecli
  template:
    metadata:
      labels:
        app: onecli
    spec:
      # docs/hosting-an-app.md §12 gotcha: local-path PVs are hostPath-backed, kubelet skips
      # fsGroup on them — the image's own `node` user (uid 1000, confirmed via `docker run id`)
      # can't write a freshly-provisioned root:shared dir. Root init chown, idempotent, rebuild-safe.
      initContainers:
        - name: fix-permissions
          image: ghcr.io/onecli/onecli@sha256:d0177458b1f9ecece4abbe9abb6c5f925475357c1734f50a675d83a2ef9c8687
          command: ["sh", "-c", "chown -R 1000:1000 /app/data"]
          volumeMounts:
            - { name: data, mountPath: /app/data }
          securityContext:
            runAsUser: 0
      containers:
        - name: onecli
          image: ghcr.io/onecli/onecli@sha256:d0177458b1f9ecece4abbe9abb6c5f925475357c1734f50a675d83a2ef9c8687
          env:
            # CNPG-managed credential (cluster.yaml). Points at the -rw service and is rotated by
            # the operator — no hand-maintained password in SOPS any more, and no second copy of it
            # to drift. Same shape the OLD system already used for agora-pg (`…-app` secret, `uri`).
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: onecli-pg-app, key: uri }
            - { name: APP_URL, value: http://onecli.agora-onecli.svc.cluster.local:10254 }
            - { name: GATEWAY_PORT, value: "10255" }
            # Without this, OneCLI defaults its advertised gateway host to `host.docker.internal`
            # (a Docker-Desktop convention) — unreachable from this k0s/containerd cluster's Pods.
            # No scheme here: the server prepends `http://<bearer>@` itself; a scheme in this value
            # produces a broken double-scheme proxy URL (verified live — live-verification/06's own
            # comment).
            - { name: GATEWAY_BASE_URL, value: onecli.agora-onecli.svc.cluster.local:10255 }
            - { name: LOG_LEVEL, value: info }
          ports:
            - { containerPort: 10254, name: api }
            - { containerPort: 10255, name: gateway }
          volumeMounts:
            - { name: data, mountPath: /app/data }
            - { name: tmp, mountPath: /tmp }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe:
            httpGet: { path: /v1/health, port: 10254 }
            initialDelaySeconds: 5
            periodSeconds: 3
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: onecli-app-data
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: onecli
  namespace: agora-onecli
spec:
  selector:
    app: onecli
  ports:
    - { name: api, port: 10254, targetPort: 10254 }
    - { name: gateway, port: 10255, targetPort: 10255 }
