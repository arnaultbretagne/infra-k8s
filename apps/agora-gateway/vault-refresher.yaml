# Keeps the gateway's vault credential fresh (route `vault`; docs/specs/credentials.md on
# arnaultbretagne/agora, "Vault"): a Pocket-ID access token of the machine client `agora_gateway_vault`
# (apps/pocket-id/oidc-reconciler/spec.json), minted by client_credentials without `resource`. The token
# lives 15 minutes (the client's accessTokenDurationMinutes); a new one every 5 minutes. Minting spends
# nothing: a run that fails, or is retried, loses nothing. Nobody mints a token by hand.
#
# The client secret is in `vault-client` (vault-client.secrets.yaml, SOPS), mounted here and nowhere else:
# never in the gateway, never in a sandbox. The token goes to `vault-token`, which only the gateway mounts
# and watches. Logs dates and error codes, never a token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-refresher
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vault-refresher
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [vault-token]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vault-refresher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vault-refresher
subjects:
  - kind: ServiceAccount
    name: vault-refresher
---
# Where the token lands. Created empty by Flux, then never touched by it again (IfNotPresent): the
# refresher owns its content. Until the first run, the gateway sends an empty Bearer and the vault
# answers 401. Deleting this file from git prunes the Secret.
apiVersion: v1
kind: Secret
metadata:
  name: vault-token
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
type: Opaque
data:
  access_token: ""
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-refresher
data:
  refresh.mjs: |
    import { readFileSync } from 'node:fs'

    // The Secret it writes and the client secret it reads; the API server and the ServiceAccount's
    // files as a Pod has them (KUBE_API and SA_DIR stand in for them in tests/agora-gateway).
    const NAME = process.env.TOKEN_SECRET ?? 'vault-token'
    const SA = process.env.SA_DIR ?? '/var/run/secrets/kubernetes.io/serviceaccount'
    const api = process.env.KUBE_API ?? `https://${process.env.KUBERNETES_SERVICE_HOST}:${process.env.KUBERNETES_SERVICE_PORT}`
    const namespace = readFileSync(`${SA}/namespace`, 'utf8').trim()
    const url = `${api}/api/v1/namespaces/${namespace}/secrets/${NAME}`
    const clientId = process.env.CLIENT_ID
    const clientSecret = readFileSync(process.env.CLIENT_SECRET_FILE ?? '/etc/vault-client/client_secret', 'utf8').trim()
    const minLife = Number(process.env.MIN_LIFE_MINUTES ?? 10) * 60_000
    const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms))

    if (!clientSecret || clientSecret === 'set-me') {
      console.error('vault-client has no client_secret yet: create it in Pocket-ID and put it in vault-client.secrets.yaml')
      process.exit(4)
    }

    // No `resource`: without it, aud is the client's own id, which the vault MCP accepts
    // (MCP_ALLOWED_AUDIENCE in apps/obsidian/mcp-server.yaml).
    const answer = await fetch(process.env.TOKEN_URL, {
      method: 'POST',
      headers: {
        'content-type': 'application/x-www-form-urlencoded',
        authorization: `Basic ${Buffer.from(`${encodeURIComponent(clientId)}:${encodeURIComponent(clientSecret)}`).toString('base64')}`,
      },
      body: new URLSearchParams({ grant_type: 'client_credentials' }),
      signal: AbortSignal.timeout(30_000),
    })
    if (!answer.ok) {
      const detail = await answer.json().catch(() => ({}))
      console.error(`token refused: ${answer.status} ${String(detail.error ?? '')}`)
      process.exit(1)
    }
    const fresh = await answer.json()
    const expiresAt = Date.now() + fresh.expires_in * 1000
    // A lifetime shorter than two runs would let the token lapse between them: say it, after writing.
    const status = fresh.expires_in * 1000 < minLife ? 3 : 0

    for (let attempt = 1; ; attempt++) {
      const got = await fetch(url, {
        headers: { authorization: `Bearer ${readFileSync(`${SA}/token`, 'utf8').trim()}`, accept: 'application/json' },
        signal: AbortSignal.timeout(15_000),
      })
      if (got.ok) {
        const current = await got.json()
        const data = { ...current.data, access_token: Buffer.from(fresh.access_token).toString('base64') }
        const put = await fetch(url, {
          method: 'PUT',
          headers: { authorization: `Bearer ${readFileSync(`${SA}/token`, 'utf8').trim()}`, 'content-type': 'application/json' },
          body: JSON.stringify({ ...current, data }),
          signal: AbortSignal.timeout(15_000),
        })
        if (put.ok) break
        console.error(`writing ${NAME}: ${put.status}`)
      } else {
        console.error(`reading ${NAME}: ${got.status}`)
      }
      if (attempt === 5) process.exit(2)
      await sleep(Number(process.env.RETRY_MS ?? 2000) * attempt)
    }
    if (status) console.error(`the token lives ${fresh.expires_in} s, under ${minLife / 1000} s: raise the client's access token duration`)
    console.log(`written: token valid until ${new Date(expiresAt).toISOString()}`)
    process.exit(status)
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-refresher
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Minting is idempotent: a second Pod may retry.
      backoffLimit: 1
      activeDeadlineSeconds: 240
      template:
        metadata:
          labels:
            app: vault-refresher
        spec:
          serviceAccountName: vault-refresher
          restartPolicy: Never
          priorityClassName: bretagne-low
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            # Reads vault-client (0440).
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: refresher
              image: node:24-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
              command: ["node", "/app/refresh.mjs"]
              env:
                - name: NODE_EXTRA_CA_CERTS
                  value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                # Pocket-ID in the cluster, as the OIDC reconciler reaches it: the issuer in the token is
                # its APP_URL (https://id.bretagne.dev) whatever address the request takes.
                - name: TOKEN_URL
                  value: http://pocket-id.pocket-id.svc.cluster.local:1411/api/oidc/token
                # agora_gateway_vault, pinned in apps/pocket-id/oidc-reconciler/spec.json.
                - name: CLIENT_ID
                  value: 7d54f86c-7456-4cbd-b79d-a9bb7452bb62
                # A token must outlive two runs (5 minutes apart): below 10 minutes, the run says so.
                - name: MIN_LIFE_MINUTES
                  value: "10"
              resources:
                requests: { cpu: 10m, memory: 64Mi }
                limits: { memory: 128Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - { name: script, mountPath: /app, readOnly: true }
                - { name: client, mountPath: /etc/vault-client, readOnly: true }
          volumes:
            - name: script
              configMap:
                name: vault-refresher
            - name: client
              secret:
                secretName: vault-client
                defaultMode: 0440
                items:
                  - { key: client_secret, path: client_secret }
