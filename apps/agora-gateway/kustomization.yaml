# Agora's credential gateway (docs/credentials.md on arnaultbretagne/agora, branch feat/credentials,
# "La passerelle"): agentgateway, standalone. Sandboxes reach it through their bridge; it verifies the
# execution's grants (a JWT signed by Agora, apps/agora-lab) and sets the upstream credential.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agora-gateway
resources:
  - namespace.yaml
  - limitrange.yaml
  - gateway-ca.secrets.yaml
  - upstream-credentials.secrets.yaml
  - chatgpt-refresher.yaml
  - gateway.yaml
  - networkpolicy.yaml
