# Agora's credential gateway (docs/credentials.md on arnaultbretagne/agora, branch feat/credentials,
# "La passerelle"): agentgateway, standalone. Sandboxes reach it through their bridge; it verifies the
# execution's grants (a JWT signed by Agora, apps/agora) and sets the upstream credential.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agora-gateway
resources:
  - namespace.yaml
  - limitrange.yaml
  - gateway-ca.secrets.yaml
  - upstream-credentials.secrets.yaml
  - chatgpt-refresher.yaml
  - claude-refresher.yaml
  - vault-client.secrets.yaml
  - vault-refresher.yaml
  - gateway.yaml
  - networkpolicy.yaml
# The gateway's configuration, and Agora's public key for the grants JWT (the private half is
# apps/agora/grants-key.secrets.yaml): each ConfigMap's name carries its content's hash, so a change renames
# it in the Deployment (gateway.yaml) and Flux rolls the gateway. agentgateway reads them at start only.
configMapGenerator:
  - name: gateway-config
    files:
      - config/config.yaml
  - name: grants-jwks
    files:
      - config/jwks.json
