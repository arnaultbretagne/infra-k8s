# agentgateway v1.6.0, standalone. Port 3000 takes CONNECT from the sandboxes' bridges; each tunnel to
# :443 re-enters the internal bind, where TLS is terminated with Agora's gateway CA (the sandboxes trust
# it), the JWT is verified, the grants are checked, and the host's credential is set. The JWT names the
# Pod's address (`ip`, from its Sandbox): the agent can read the token out of its bridge (same uid), so
# only the address it comes from, which the network vouches for, keeps it from working elsewhere.
# `source.address` is the sandbox's own address, kept across the CONNECT (verified on g4: src.addr).
frontendPolicies:
  accessLog:
    add:
      execution: jwt.sub
      grants: jwt.jti
config:
  adminAddr: 127.0.0.1:15000
  statsAddr: "off"
  readinessAddr: 0.0.0.0:15021
binds:
  - port: 3000
    tunnelProtocol: connect
    listeners: []
  - port: 443
    mode: internal
    listeners:
      - protocol: HTTPS
        tls:
          mode: dynamicCa
          cert: /etc/agentgateway/ca/ca-cert.pem
          key: /etc/agentgateway/ca/ca-key.pem
        # The listener's policies run before a route is picked (read in agentgateway 1.6.0's code), so
        # the routes can be chosen by what they set.
        policies:
          jwtAuth:
            mode: strict
            # The execution's JWT rides on the CONNECT, in Proxy-Authorization (set by the bridge).
            location:
              expression: 'source.connectHeaders["proxy-authorization"].stripPrefix("Bearer ")'
            issuer: agora
            audiences: [agora-gateway]
            jwks: { file: /etc/agentgateway/jwks/jwks.json }
          # GitHub has two routes per host: one for what a grant covers, one for the rest. This header,
          # always overwritten here and removed before GitHub, says which: "covered" when the rule of
          # the routes with a credential would let the request through. It only steers: each route
          # checks the request again, so a header the sandbox sends itself gains nothing.
          transformations:
            conditional:
              - condition: 'request.host == "api.github.com" || request.host == "github.com"'
                request:
                  set:
                    x-gateway-grant: 'jwt.ip == source.address && !request.pathAndQuery.matches("(?i)(/[.][.]?(/|[?]|$)|%2e|%2f)") && jwt.grants.exists(g, g.host == request.host && (!has(g.path) || request.pathAndQuery.matches(g.path)) && (!has(g.methods) || request.method in g.methods)) ? "covered" : "none"'
        routes:
            # Claude's usage limits (5-hour and weekly windows): the cluster's own login, kept alive by
            # claude-refresher.yaml — the setup-token below lacks the `user:profile` scope this one path
            # asks for. Its exact path outranks the `anthropic` route, which takes every other path.
            - name: anthropic-usage
              hostnames: [api.anthropic.com]
              matches:
                - path: { exact: /api/oauth/usage }
                  method: GET
              backends:
                - dynamic: {}
                  policies:
                    backendTLS: {}
              policies:
                authorization:
                  rules:
                    # One rule for every composition: from the Pod the JWT is bound to, no path tricks,
                    # and some grant of the JWT covers this host, path and query, and method.
                    - allow: 'jwt.ip == source.address && !request.pathAndQuery.matches("(?i)(/[.][.]?(/|[?]|$)|%2e|%2f)") && jwt.grants.exists(g, g.host == request.host && (!has(g.path) || request.pathAndQuery.matches(g.path)) && (!has(g.methods) || request.method in g.methods))'
                backendAuth:
                  key:
                    value: { file: /etc/agentgateway/claude/access_token }
                    location: { header: { name: authorization, prefix: "Bearer " } }
            # Claude: the operator's setup-token replaces the harness's placeholder.
            - name: anthropic
              hostnames: [api.anthropic.com]
              backends:
                - dynamic: {}
                  policies:
                    backendTLS: {}
              policies:
                authorization:
                  rules:
                    # One rule for every composition: from the Pod the JWT is bound to, no path tricks,
                    # and some grant of the JWT covers this host, path and query, and method.
                    - allow: 'jwt.ip == source.address && !request.pathAndQuery.matches("(?i)(/[.][.]?(/|[?]|$)|%2e|%2f)") && jwt.grants.exists(g, g.host == request.host && (!has(g.path) || request.pathAndQuery.matches(g.path)) && (!has(g.methods) || request.method in g.methods))'
                backendAuth:
                  key:
                    value: { file: /etc/agentgateway/credentials/anthropic }
                    location: { header: { name: authorization, prefix: "Bearer " } }
            # z.ai (GLM): the operator's API key, as a Bearer, for its OpenAI- and Anthropic-compatible APIs alike.
            - name: zai
              hostnames: [api.z.ai]
              backends:
                - dynamic: {}
                  policies:
                    backendTLS: {}
              policies:
                authorization:
                  rules:
                    # One rule for every composition: from the Pod the JWT is bound to, no path tricks,
                    # and some grant of the JWT covers this host, path and query, and method.
                    - allow: 'jwt.ip == source.address && !request.pathAndQuery.matches("(?i)(/[.][.]?(/|[?]|$)|%2e|%2f)") && jwt.grants.exists(g, g.host == request.host && (!has(g.path) || request.pathAndQuery.matches(g.path)) && (!has(g.methods) || request.method in g.methods))'
                backendAuth:
                  key:
                    value: { file: /etc/agentgateway/credentials/zai }
                    location: { header: { name: authorization, prefix: "Bearer " } }
            # The vault's MCP server (apps/obsidian), for `vault:read` and `vault:write`. agentgateway
            # speaks MCP here: it opens its own session with the server, so it reads each tools/list and
            # tools/call and applies mcpAuthorization to them — a tool the grants do not cover is left
            # out of tools/list and refused on tools/call. The bearer is a token of the cluster's own
            # Pocket-ID machine client (`agora_gateway_vault`), minted by vault-refresher; the sandbox's
            # Authorization never reaches the server. Straight to the Service, not through Traefik: the
            # gateway reaches nothing else in the cluster (networkpolicy.yaml).
            # Stateless: agentgateway sets up its upstream client, policies included, once per session, so
            # a stateful session would keep the bearer it opened with. Stateless, every message builds it
            # again from the current configuration: a rotated token reaches the sessions already open.
            # Each message is then initialize + the message + DELETE to the server, which ends its session.
            - name: vault
              hostnames: [vault.bretagne.dev]
              backends:
                - mcp:
                    statefulMode: stateless
                    targets:
                      - name: vault
                        mcp:
                          host: http://obsidian-mcp.obsidian.svc.cluster.local:4000/mcp
                        policies:
                          backendAuth:
                            key:
                              value: { file: /etc/agentgateway/vault/access_token }
                              location: { header: { name: authorization, prefix: "Bearer " } }
              policies:
                authorization:
                  rules:
                    # One rule for every composition: from the Pod the JWT is bound to, no path tricks,
                    # and some grant of the JWT covers this host, path and query, and method.
                    - allow: 'jwt.ip == source.address && !request.pathAndQuery.matches("(?i)(/[.][.]?(/|[?]|$)|%2e|%2f)") && jwt.grants.exists(g, g.host == request.host && (!has(g.path) || request.pathAndQuery.matches(g.path)) && (!has(g.methods) || request.method in g.methods))'
                # Read or write (docs/specs/credentials.md on arnaultbretagne/agora, "The vault", tool rule): a
                # vault grant without `tools` (vault:write) opens the whole server — tools, prompts,
                # resources; with `tools` (vault:read), only those tools. agentgateway runs it on tools/call,
                # prompts/get and resources/read, and filters the lists. `has(mcp.tool)` must stay: on a prompt
                # or a resource `mcp.tool` is absent, and 1.6.0's `exists` stops at the first grant that
                # errors — without it, vault:read before vault:write would refuse the prompt write opens.
                mcpAuthorization:
                  rules:
                    - allow: 'jwt.grants.exists(g, g.host == "vault.bretagne.dev" && (!has(g.tools) || (has(mcp.tool) && mcp.tool.name in g.tools)))'
            # ChatGPT, for codex: the cluster's own session (chatgpt-refresher.yaml keeps it alive). The
            # sandbox's auth.json is a placeholder; its account id is dropped, the token alone names
            # the account.
            - name: chatgpt
              hostnames: [chatgpt.com]
              backends:
                - dynamic: {}
                  policies:
                    backendTLS: {}
              policies:
                authorization:
                  rules:
                    # One rule for every composition: from the Pod the JWT is bound to, no path tricks,
                    # and some grant of the JWT covers this host, path and query, and method.
                    - allow: 'jwt.ip == source.address && !request.pathAndQuery.matches("(?i)(/[.][.]?(/|[?]|$)|%2e|%2f)") && jwt.grants.exists(g, g.host == request.host && (!has(g.path) || request.pathAndQuery.matches(g.path)) && (!has(g.methods) || request.method in g.methods))'
                requestHeaderModifier:
                  remove: [chatgpt-account-id]
                backendAuth:
                  key:
                    value: { file: /etc/agentgateway/chatgpt/access_token }
                    location: { header: { name: authorization, prefix: "Bearer " } }
            # GitHub REST, what a grant covers (GraphQL stays closed: no grant covers /graphql). A header
            # match outranks the route without one for the same host.
            - name: github-api
              hostnames: [api.github.com]
              matches:
                - headers:
                    - { name: x-gateway-grant, value: { exact: covered } }
              backends:
                - dynamic: {}
                  policies:
                    backendTLS: {}
              policies:
                authorization:
                  rules:
                    # One rule for every composition: from the Pod the JWT is bound to, no path tricks,
                    # and some grant of the JWT covers this host, path and query, and method.
                    - allow: 'jwt.ip == source.address && !request.pathAndQuery.matches("(?i)(/[.][.]?(/|[?]|$)|%2e|%2f)") && jwt.grants.exists(g, g.host == request.host && (!has(g.path) || request.pathAndQuery.matches(g.path)) && (!has(g.methods) || request.method in g.methods))'
                requestHeaderModifier:
                  remove: [x-gateway-grant]
                backendAuth:
                  key:
                    value: { file: /etc/agentgateway/credentials/github }
                    location: { header: { name: authorization, prefix: "Bearer " } }
            # git smart HTTP, what a grant covers: Basic x-access-token:<PAT>.
            - name: github-git
              hostnames: [github.com]
              matches:
                - headers:
                    - { name: x-gateway-grant, value: { exact: covered } }
              backends:
                - dynamic: {}
                  policies:
                    backendTLS: {}
              policies:
                authorization:
                  rules:
                    # One rule for every composition: from the Pod the JWT is bound to, no path tricks,
                    # and some grant of the JWT covers this host, path and query, and method.
                    - allow: 'jwt.ip == source.address && !request.pathAndQuery.matches("(?i)(/[.][.]?(/|[?]|$)|%2e|%2f)") && jwt.grants.exists(g, g.host == request.host && (!has(g.path) || request.pathAndQuery.matches(g.path)) && (!has(g.methods) || request.method in g.methods))'
                requestHeaderModifier:
                  remove: [x-gateway-grant]
                backendAuth:
                  key:
                    value: { file: /etc/agentgateway/credentials/github-basic }
                    location: { header: { name: authorization, prefix: "Basic " } }
            # Public GitHub through the Internet: what no grant covers, read only, with the same PAT. A
            # fine-grained PAT reads every public repository, so a repository given no grant reads as
            # the public sees it. Reads only, because the PAT can write to the repositories offered;
            # GraphQL stays closed (always a POST). Open to a grant on "*" (Agora's `internet` profile).
            - name: github-api-public
              hostnames: [api.github.com]
              backends:
                - dynamic: {}
                  policies:
                    backendTLS: {}
              policies:
                authorization:
                  rules:
                    - allow: 'jwt.ip == source.address && !request.pathAndQuery.matches("(?i)(/[.][.]?(/|[?]|$)|%2e|%2f)") && request.method in ["GET", "HEAD"] && jwt.grants.exists(g, g.host == "*" && (!has(g.path) || request.pathAndQuery.matches(g.path)) && (!has(g.methods) || request.method in g.methods))'
                requestHeaderModifier:
                  remove: [x-gateway-grant]
                backendAuth:
                  key:
                    value: { file: /etc/agentgateway/credentials/github }
                    location: { header: { name: authorization, prefix: "Bearer " } }
            # git smart HTTP through the Internet: clone and fetch (git-upload-pack, which POSTs too),
            # never push (git-receive-pack, from its first GET on).
            - name: github-git-public
              hostnames: [github.com]
              backends:
                - dynamic: {}
                  policies:
                    backendTLS: {}
              policies:
                authorization:
                  rules:
                    - allow: 'jwt.ip == source.address && !request.pathAndQuery.matches("(?i)(/[.][.]?(/|[?]|$)|%2e|%2f)") && ((request.method in ["GET", "HEAD"] && !request.pathAndQuery.matches("git-receive-pack")) || (request.method == "POST" && request.pathAndQuery.matches("^/[^/?]+/[^/?]+/git-upload-pack$"))) && jwt.grants.exists(g, g.host == "*" && (!has(g.path) || request.pathAndQuery.matches(g.path)) && (!has(g.methods) || request.method in g.methods))'
                requestHeaderModifier:
                  remove: [x-gateway-grant]
                backendAuth:
                  key:
                    value: { file: /etc/agentgateway/credentials/github-basic }
                    location: { header: { name: authorization, prefix: "Basic " } }
            # The cluster's API server, for `kubernetes:read` (docs/specs/credentials.md on arnaultbretagne/agora,
            # "Kubernetes"). `kubernetes.agora.internal` resolves nowhere: only this route knows it. The grant
            # lets through GET and HEAD on /api, /apis, /openapi, /version; what may be read is the RBAC of
            # the gateway's own ServiceAccount (kubernetes-read.yaml), whose projected token is set here in
            # place of whatever Authorization kubectl sent. The kubelet renews that file before it expires;
            # the gateway watches it, and reads the credential again for every request.
            - name: kubernetes
              hostnames: [kubernetes.agora.internal]
              backends:
                - host: kubernetes.default.svc.cluster.local:443
                  policies:
                    backendTLS:
                      root: /etc/agentgateway/kube-ca/ca.crt
                      hostname: kubernetes.default.svc
              policies:
                authorization:
                  rules:
                    # One rule for every composition: from the Pod the JWT is bound to, no path tricks,
                    # and some grant of the JWT covers this host, path and query, and method.
                    - allow: 'jwt.ip == source.address && !request.pathAndQuery.matches("(?i)(/[.][.]?(/|[?]|$)|%2e|%2f)") && jwt.grants.exists(g, g.host == request.host && (!has(g.path) || request.pathAndQuery.matches(g.path)) && (!has(g.methods) || request.method in g.methods))'
                backendAuth:
                  key:
                    value: { file: /etc/agentgateway/kubernetes/token }
                    location: { header: { name: authorization, prefix: "Bearer " } }
            # The Internet: no hostnames, so agentgateway picks it last, for a host none of the routes
            # above names — those keep their own grants, and their credentials, whatever this one
            # allows. No credential set: the request leaves as the sandbox sent it. Its own rule: a
            # grant on host "*" (Agora's `internet` profile). The home network and the cluster are cut
            # off by networkpolicy.yaml, not here.
            - name: internet
              backends:
                - dynamic: {}
                  policies:
                    backendTLS: {}
              policies:
                authorization:
                  rules:
                    # From the Pod the JWT is bound to, and a grant on "*".
                    - allow: 'jwt.ip == source.address && jwt.grants.exists(g, g.host == "*" && (!has(g.path) || request.pathAndQuery.matches(g.path)) && (!has(g.methods) || request.method in g.methods))'