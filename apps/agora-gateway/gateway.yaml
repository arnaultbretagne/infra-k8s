# The gateway (docs/specs/credentials.md on arnaultbretagne/agora, "The gateway"). One replica: it keeps
# no state, but one is enough for the lab. Its configuration is not watched: a change here takes
# `kubectl -n agora-gateway rollout restart deploy/gateway`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
data:
  config.yaml: |
    # agentgateway v1.5.0, standalone. Port 3000 takes CONNECT from the sandboxes' bridges; each tunnel to
    # :443 re-enters the internal bind, where TLS is terminated with Agora's gateway CA (the sandboxes trust
    # it), the JWT is verified, the grants are checked, and the host's credential is set. The JWT names the
    # Pod's address (`ip`, from its Sandbox): the agent can read the token out of its bridge (same uid), so
    # only the address it comes from, which the network vouches for, keeps it from working elsewhere.
    # `source.address` is the sandbox's own address, kept across the CONNECT (verified on g4: src.addr).
    frontendPolicies:
      accessLog:
        add:
          execution: jwt.sub
          grants: jwt.jti
    config:
      adminAddr: 127.0.0.1:15000
      statsAddr: "off"
      readinessAddr: 0.0.0.0:15021
    binds:
      - port: 3000
        tunnelProtocol: connect
        listeners: []
      - port: 443
        mode: internal
        listeners:
          - protocol: HTTPS
            tls:
              mode: dynamicCa
              cert: /etc/agentgateway/ca/ca-cert.pem
              key: /etc/agentgateway/ca/ca-key.pem
            routes:
                # Claude's usage limits (5-hour and weekly windows): the cluster's own login, kept alive by
                # claude-refresher.yaml — the setup-token below lacks the `user:profile` scope this one path
                # asks for. Its exact path outranks the `anthropic` route, which takes every other path.
                - name: anthropic-usage
                  hostnames: [api.anthropic.com]
                  matches:
                    - path: { exact: /api/oauth/usage }
                      method: GET
                  backends:
                    - dynamic: {}
                      policies:
                        backendTLS: {}
                  policies:
                    jwtAuth:
                      mode: strict
                      # The execution's JWT rides on the CONNECT, in Proxy-Authorization (set by the bridge).
                      location:
                        expression: 'source.connectHeaders["proxy-authorization"].stripPrefix("Bearer ")'
                      issuer: agora
                      audiences: [agora-gateway]
                      jwks: { file: /etc/agentgateway/jwks/jwks.json }
                    authorization:
                      rules:
                        # One rule for every composition: from the Pod the JWT is bound to, no path tricks,
                        # and some grant of the JWT covers this host, path and query, and method.
                        - allow: 'jwt.ip == source.address && !request.pathAndQuery.matches("(?i)(/[.][.]?(/|[?]|$)|%2e|%2f)") && jwt.grants.exists(g, g.host == request.host && (!has(g.path) || request.pathAndQuery.matches(g.path)) && (!has(g.methods) || request.method in g.methods))'
                    backendAuth:
                      key:
                        value: { file: /etc/agentgateway/claude/access_token }
                        location: { header: { name: authorization, prefix: "Bearer " } }
                # Claude: the operator's setup-token replaces the harness's placeholder.
                - name: anthropic
                  hostnames: [api.anthropic.com]
                  backends:
                    - dynamic: {}
                      policies:
                        backendTLS: {}
                  policies:
                    jwtAuth:
                      mode: strict
                      # The execution's JWT rides on the CONNECT, in Proxy-Authorization (set by the bridge).
                      location:
                        expression: 'source.connectHeaders["proxy-authorization"].stripPrefix("Bearer ")'
                      issuer: agora
                      audiences: [agora-gateway]
                      jwks: { file: /etc/agentgateway/jwks/jwks.json }
                    authorization:
                      rules:
                        # One rule for every composition: from the Pod the JWT is bound to, no path tricks,
                        # and some grant of the JWT covers this host, path and query, and method.
                        - allow: 'jwt.ip == source.address && !request.pathAndQuery.matches("(?i)(/[.][.]?(/|[?]|$)|%2e|%2f)") && jwt.grants.exists(g, g.host == request.host && (!has(g.path) || request.pathAndQuery.matches(g.path)) && (!has(g.methods) || request.method in g.methods))'
                    backendAuth:
                      key:
                        value: { file: /etc/agentgateway/credentials/anthropic }
                        location: { header: { name: authorization, prefix: "Bearer " } }
                # z.ai (GLM): the operator's API key, as a Bearer, for its OpenAI- and Anthropic-compatible APIs alike.
                - name: zai
                  hostnames: [api.z.ai]
                  backends:
                    - dynamic: {}
                      policies:
                        backendTLS: {}
                  policies:
                    jwtAuth:
                      mode: strict
                      # The execution's JWT rides on the CONNECT, in Proxy-Authorization (set by the bridge).
                      location:
                        expression: 'source.connectHeaders["proxy-authorization"].stripPrefix("Bearer ")'
                      issuer: agora
                      audiences: [agora-gateway]
                      jwks: { file: /etc/agentgateway/jwks/jwks.json }
                    authorization:
                      rules:
                        # One rule for every composition: from the Pod the JWT is bound to, no path tricks,
                        # and some grant of the JWT covers this host, path and query, and method.
                        - allow: 'jwt.ip == source.address && !request.pathAndQuery.matches("(?i)(/[.][.]?(/|[?]|$)|%2e|%2f)") && jwt.grants.exists(g, g.host == request.host && (!has(g.path) || request.pathAndQuery.matches(g.path)) && (!has(g.methods) || request.method in g.methods))'
                    backendAuth:
                      key:
                        value: { file: /etc/agentgateway/credentials/zai }
                        location: { header: { name: authorization, prefix: "Bearer " } }
                # ChatGPT, for codex: the cluster's own session (chatgpt-refresher.yaml keeps it alive). The
                # sandbox's auth.json is a placeholder; its account id is dropped, the token alone names
                # the account.
                - name: chatgpt
                  hostnames: [chatgpt.com]
                  backends:
                    - dynamic: {}
                      policies:
                        backendTLS: {}
                  policies:
                    jwtAuth:
                      mode: strict
                      # The execution's JWT rides on the CONNECT, in Proxy-Authorization (set by the bridge).
                      location:
                        expression: 'source.connectHeaders["proxy-authorization"].stripPrefix("Bearer ")'
                      issuer: agora
                      audiences: [agora-gateway]
                      jwks: { file: /etc/agentgateway/jwks/jwks.json }
                    authorization:
                      rules:
                        # One rule for every composition: from the Pod the JWT is bound to, no path tricks,
                        # and some grant of the JWT covers this host, path and query, and method.
                        - allow: 'jwt.ip == source.address && !request.pathAndQuery.matches("(?i)(/[.][.]?(/|[?]|$)|%2e|%2f)") && jwt.grants.exists(g, g.host == request.host && (!has(g.path) || request.pathAndQuery.matches(g.path)) && (!has(g.methods) || request.method in g.methods))'
                    requestHeaderModifier:
                      remove: [chatgpt-account-id]
                    backendAuth:
                      key:
                        value: { file: /etc/agentgateway/chatgpt/access_token }
                        location: { header: { name: authorization, prefix: "Bearer " } }
                # GitHub REST (GraphQL stays closed: no grant covers /graphql).
                - name: github-api
                  hostnames: [api.github.com]
                  backends:
                    - dynamic: {}
                      policies:
                        backendTLS: {}
                  policies:
                    jwtAuth:
                      mode: strict
                      # The execution's JWT rides on the CONNECT, in Proxy-Authorization (set by the bridge).
                      location:
                        expression: 'source.connectHeaders["proxy-authorization"].stripPrefix("Bearer ")'
                      issuer: agora
                      audiences: [agora-gateway]
                      jwks: { file: /etc/agentgateway/jwks/jwks.json }
                    authorization:
                      rules:
                        # One rule for every composition: from the Pod the JWT is bound to, no path tricks,
                        # and some grant of the JWT covers this host, path and query, and method.
                        - allow: 'jwt.ip == source.address && !request.pathAndQuery.matches("(?i)(/[.][.]?(/|[?]|$)|%2e|%2f)") && jwt.grants.exists(g, g.host == request.host && (!has(g.path) || request.pathAndQuery.matches(g.path)) && (!has(g.methods) || request.method in g.methods))'
                    backendAuth:
                      key:
                        value: { file: /etc/agentgateway/credentials/github }
                        location: { header: { name: authorization, prefix: "Bearer " } }
                # git smart HTTP: Basic x-access-token:<PAT>.
                - name: github-git
                  hostnames: [github.com]
                  backends:
                    - dynamic: {}
                      policies:
                        backendTLS: {}
                  policies:
                    jwtAuth:
                      mode: strict
                      # The execution's JWT rides on the CONNECT, in Proxy-Authorization (set by the bridge).
                      location:
                        expression: 'source.connectHeaders["proxy-authorization"].stripPrefix("Bearer ")'
                      issuer: agora
                      audiences: [agora-gateway]
                      jwks: { file: /etc/agentgateway/jwks/jwks.json }
                    authorization:
                      rules:
                        # One rule for every composition: from the Pod the JWT is bound to, no path tricks,
                        # and some grant of the JWT covers this host, path and query, and method.
                        - allow: 'jwt.ip == source.address && !request.pathAndQuery.matches("(?i)(/[.][.]?(/|[?]|$)|%2e|%2f)") && jwt.grants.exists(g, g.host == request.host && (!has(g.path) || request.pathAndQuery.matches(g.path)) && (!has(g.methods) || request.method in g.methods))'
                    backendAuth:
                      key:
                        value: { file: /etc/agentgateway/credentials/github-basic }
                        location: { header: { name: authorization, prefix: "Basic " } }
                # The Internet: no hostnames, so agentgateway picks it last, for a host none of the routes
                # above names — those keep their own grants, and their credentials, whatever this one
                # allows. No credential set: the request leaves as the sandbox sent it. Its own rule: a
                # grant on host "*" (Agora's `internet` profile). The home network and the cluster are cut
                # off by networkpolicy.yaml, not here.
                - name: internet
                  backends:
                    - dynamic: {}
                      policies:
                        backendTLS: {}
                  policies:
                    jwtAuth:
                      mode: strict
                      # The execution's JWT rides on the CONNECT, in Proxy-Authorization (set by the bridge).
                      location:
                        expression: 'source.connectHeaders["proxy-authorization"].stripPrefix("Bearer ")'
                      issuer: agora
                      audiences: [agora-gateway]
                      jwks: { file: /etc/agentgateway/jwks/jwks.json }
                    authorization:
                      rules:
                        # From the Pod the JWT is bound to, and a grant on "*".
                        - allow: 'jwt.ip == source.address && jwt.grants.exists(g, g.host == "*" && (!has(g.path) || request.pathAndQuery.matches(g.path)) && (!has(g.methods) || request.method in g.methods))'
---
# Agora's public key for the grants JWT (the private half is apps/agora/grants-key.secrets.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grants-jwks
data:
  jwks.json: |
    {"keys":[{"crv":"Ed25519","x":"U_PyUtCN-FJeNrctkdeFPC4MkrlSyhyRr3EMTpP_icA","kty":"OKP","kid":"agora-grants-1","alg":"EdDSA","use":"sig"}]}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      priorityClassName: bretagne-low
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: ghcr.io/agentgateway/agentgateway:v1.5.0@sha256:bf2f339ef326d32def2aaeb44b1b4549801293c19b89e764a4228667d97d9896
          args: ["-f", "/etc/agentgateway/config/config.yaml"]
          ports:
            - name: connect
              containerPort: 3000
            - name: readiness
              containerPort: 15021
          readinessProbe:
            httpGet: { path: /healthz/ready, port: readiness }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz/ready, port: readiness }
            periodSeconds: 30
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - { name: config, mountPath: /etc/agentgateway/config, readOnly: true }
            - { name: jwks, mountPath: /etc/agentgateway/jwks, readOnly: true }
            - { name: ca, mountPath: /etc/agentgateway/ca, readOnly: true }
            # Watched by the gateway: rotating a credential needs no restart.
            - { name: credentials, mountPath: /etc/agentgateway/credentials, readOnly: true }
            # The ChatGPT session's access token, rewritten by chatgpt-refresher: watched the same way.
            - { name: chatgpt, mountPath: /etc/agentgateway/chatgpt, readOnly: true }
            # The Claude login's access token, rewritten by claude-refresher: watched the same way.
            - { name: claude, mountPath: /etc/agentgateway/claude, readOnly: true }
      volumes:
        - name: config
          configMap:
            name: gateway-config
        - name: jwks
          configMap:
            name: grants-jwks
        - name: ca
          secret:
            secretName: gateway-ca
            defaultMode: 0440
        - name: credentials
          secret:
            secretName: upstream-credentials
            defaultMode: 0440
        # Created by hand, outside git (chatgpt-refresher.yaml): optional, so the gateway starts without it.
        - name: chatgpt
          secret:
            secretName: chatgpt-session
            optional: true
            defaultMode: 0440
            items:
              - { key: access_token, path: access_token }
        # Created by hand, outside git (claude-refresher.yaml): optional, so the gateway starts without it.
        - name: claude
          secret:
            secretName: claude-session
            optional: true
            defaultMode: 0440
            items:
              - { key: access_token, path: access_token }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector:
    app: gateway
  ports:
    - name: connect
      port: 3000
      targetPort: connect
