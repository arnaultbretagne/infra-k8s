# The gateway (docs/specs/credentials.md on arnaultbretagne/agora, "The gateway"). One replica: it keeps
# no state, but one is enough for the lab. Its configuration (config/config.yaml) and Agora's public key
# (config/jwks.json) are generated into ConfigMaps whose names carry their content's hash
# (kustomization.yaml): a change renames them here, and Flux rolls the gateway. Nobody restarts it by hand.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      # Every sandbox reaches its model through here: shed last, like the server.
      priorityClassName: bretagne-critical
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: ghcr.io/agentgateway/agentgateway:v1.6.0@sha256:9d3e6044ddcdc0878b1787f77bd401252b95e22684203fb5e874c4c42d2ed90c
          args: ["-f", "/etc/agentgateway/config/config.yaml"]
          ports:
            - name: connect
              containerPort: 3000
            - name: readiness
              containerPort: 15021
          readinessProbe:
            httpGet: { path: /healthz/ready, port: readiness }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz/ready, port: readiness }
            periodSeconds: 30
          # CPU: the request-path floor (docs/hosting-an-app.md §4.3), its share when sandboxes
          # saturate the node; its load grows with the number of parallel sandboxes.
          resources:
            requests: { cpu: 50m, memory: 80Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - { name: config, mountPath: /etc/agentgateway/config, readOnly: true }
            - { name: jwks, mountPath: /etc/agentgateway/jwks, readOnly: true }
            - { name: ca, mountPath: /etc/agentgateway/ca, readOnly: true }
            # Watched by the gateway: rotating a credential needs no restart.
            - { name: credentials, mountPath: /etc/agentgateway/credentials, readOnly: true }
            # The previews' token, rewritten by previews-refresher every 5 minutes: watched the same way.
            - { name: previews, mountPath: /etc/agentgateway/previews, readOnly: true }
            # The ChatGPT session's access token, rewritten by chatgpt-refresher: watched the same way.
            - { name: chatgpt, mountPath: /etc/agentgateway/chatgpt, readOnly: true }
            # The Claude login's access token, rewritten by claude-refresher: watched the same way.
            - { name: claude, mountPath: /etc/agentgateway/claude, readOnly: true }
      volumes:
        - name: config
          configMap:
            name: gateway-config
        - name: jwks
          configMap:
            name: grants-jwks
        - name: ca
          secret:
            secretName: gateway-ca
            defaultMode: 0440
        - name: credentials
          secret:
            secretName: upstream-credentials
            defaultMode: 0440
        # Created empty by Flux, filled by previews-refresher (previews-refresher.yaml).
        - name: previews
          secret:
            secretName: previews-session
            optional: true
            defaultMode: 0440
            items:
              - { key: access_token, path: access_token }
        # Created by hand, outside git (chatgpt-refresher.yaml): optional, so the gateway starts without it.
        - name: chatgpt
          secret:
            secretName: chatgpt-session
            optional: true
            defaultMode: 0440
            items:
              - { key: access_token, path: access_token }
        # Created by hand, outside git (claude-refresher.yaml): optional, so the gateway starts without it.
        - name: claude
          secret:
            secretName: claude-session
            optional: true
            defaultMode: 0440
            items:
              - { key: access_token, path: access_token }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector:
    app: gateway
  ports:
    - name: connect
      port: 3000
      targetPort: connect
