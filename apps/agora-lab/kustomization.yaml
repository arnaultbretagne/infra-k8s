# agora-lab.bretagne.dev — Agora's lab: the execution mechanics (claims in agora-sandboxes, bridge
# connections), the log on the `agora` database (apps/agora-system), and a bare page that plays
# every case of their contracts. Source: arnaultbretagne/agora, apps/lab. Operators only (OIDC, admin).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agora-lab
resources:
  - namespace.yaml
  - limitrange.yaml
  - ghcr-pull.secrets.yaml
  - signing-key.secrets.yaml
  - grants-key.secrets.yaml
  - oauth2-proxy.secrets.yaml
  - log.secrets.yaml
  - lab.yaml
  - oauth2-proxy.yaml
  - httproute.yaml
  - networkpolicy.yaml
