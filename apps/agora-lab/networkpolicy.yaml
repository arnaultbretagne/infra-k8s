# Default-deny plus the flows of the lab: Traefik → oauth2-proxy → lab; the lab reaches the
# Kubernetes API (claims) and the sandboxes' bridge port, nothing else. The other half of the bridge
# flow is apps/agora-sandboxes/networkpolicy.yaml.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny
spec:
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: lab
spec:
  endpointSelector:
    matchLabels:
      app: lab
  ingress:
    - fromEndpoints:
        - matchLabels:
            app: oauth2-proxy
      toPorts:
        - ports: [{ port: "8080", protocol: TCP }]
    - fromEntities: [host] # kubelet probes, and the lab's scripted cases run from the node
      toPorts:
        - ports: [{ port: "8080", protocol: TCP }, { port: "8081", protocol: TCP }]
    # The anchor receiver: the sandboxes push there when their Pod ends, and reach nothing else.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agora-sandboxes
            app.kubernetes.io/part-of: agora-sandboxes
      toPorts:
        - ports: [{ port: "8081", protocol: TCP }]
  egress:
    # kubernetes.default.svc has to resolve before the API server can be reached.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports: [{ port: "53", protocol: UDP }, { port: "53", protocol: TCP }]
    - toEntities: [kube-apiserver]
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agora-sandboxes
            app.kubernetes.io/part-of: agora-sandboxes
      toPorts:
        - ports: [{ port: "8080", protocol: TCP }]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: oauth2-proxy
spec:
  endpointSelector:
    matchLabels:
      app: oauth2-proxy
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik
      toPorts:
        - ports: [{ port: "4180", protocol: TCP }]
    - fromEntities: [host] # kubelet probes
      toPorts:
        - ports: [{ port: "4180", protocol: TCP }]
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports: [{ port: "53", protocol: UDP }, { port: "53", protocol: TCP }]
    - toEndpoints:
        - matchLabels:
            app: lab
      toPorts:
        - ports: [{ port: "8080", protocol: TCP }]
    # -> id.bretagne.dev (OIDC discovery/token): the public IP resolves to the node, then kube-proxy
    # DNATs to Traefik — both paths, as for agent-vault's gate.
    - toEntities: [world, host]
      toPorts:
        - ports: [{ port: "443", protocol: TCP }]
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik
      toPorts:
        - ports: [{ port: "8443", protocol: TCP }]
