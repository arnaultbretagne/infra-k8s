# Default-deny. A sandbox is reached only by Agora (the lab) on the bridge port, and by the
# kubelet's readiness probe. It reaches Agora's anchor receiver and Agora's gateway, nothing
# else: every request of a harness goes out through the proxy, which sets the credential
# (docs/credentials.md on arnaultbretagne/agora). No route to the Internet. CiliumNetworkPolicy
# throughout, as in agora-system: `fromEntities: [host]` has no plain equivalent.
#
# No FQDN rule: inside a Kata VM, answers from Cilium's DNS proxy never reach the guest (lookups
# time out after 20-26 s; plain DNS answers in ~0.2 s — measured 2026-09-27).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny
spec:
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: bridge
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/part-of: agora-sandboxes
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agora-lab
            app: lab
      toPorts:
        - ports: [{ port: "8080", protocol: TCP }]
    - fromEntities: [host] # kubelet readiness probe
      toPorts:
        - ports: [{ port: "8080", protocol: TCP }]
---
# The one way out of every sandbox: pushing its anchor to Agora's receiver when the Pod ends
# (docs/executions.md, "La fin du Pod et l'anchor"). DNS is plain, without Cilium's DNS proxy (see below).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: anchor-push
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/part-of: agora-sandboxes
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports: [{ port: "53", protocol: UDP }, { port: "53", protocol: TCP }]
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agora-lab
            app: lab
      toPorts:
        - ports: [{ port: "8081", protocol: TCP }]
---
# The way out of every harness (docs/credentials.md, ADR 0001): the bridge forwards each CONNECT to
# Agora's gateway with the execution's grants. The other half is apps/agora-gateway/networkpolicy.yaml.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: credential-proxy
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/part-of: agora-sandboxes
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agora-gateway
            app: gateway
      toPorts:
        - ports: [{ port: "3000", protocol: TCP }]
