            name: credential-proxy-ca
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: codex-0eae81a379d7
  labels:
    agora.bretagne.dev/harness: codex
  annotations:
    # The base profiles (docs/specs/credentials.md): codex opens its Sessions against ChatGPT.
    agora.bretagne.dev/base-profiles: chatgpt
    # Full access, GPT-6.1 Sol, high reasoning effort.
    agora.bretagne.dev/session-config: mode=agent-full-access,model=gpt-6.1-sol,reasoning_effort=high
spec:
  replicas: 1
  sandboxTemplateRef:
    name: codex-0eae81a379d7
