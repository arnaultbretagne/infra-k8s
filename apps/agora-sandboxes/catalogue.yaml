# codex 0.159.3 + codex-acp 2.1.1, on the operator's ChatGPT subscription. Image from
# arnaultbretagne/agora feat/harness-codex, commit ddac202. Its session is set by the gateway (route
# chatgpt, kept alive by apps/agora-gateway/chatgpt-refresher.yaml); the image writes a placeholder
# login, which must name the account codex selects (codex-account.secrets.yaml).
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: codex-0eae81a379d7
spec:
  networkPolicyManagement: Unmanaged
  # The back-end reaches the bridge through this Service (status.sandbox.serviceFQDN).
  service: true
  podTemplate:
    metadata:
      labels:
        app.kubernetes.io/part-of: agora-sandboxes
