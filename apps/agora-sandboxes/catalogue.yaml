        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sandbox
          image: ghcr.io/arnaultbretagne/agora-harness-codex@sha256:0eae81a379d76ba3f73c6e865c626fda91caded960ea4c4929570575616ccef9
          ports:
