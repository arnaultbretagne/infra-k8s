# The catalogue of Agora's sandboxes (agent-sandbox.md): one template and one warm pool per image
# digest, named after it. Changing an image is a NEW template and pool, never an edit in place —
# a pool can still hand out sandboxes prepared from the old template.
#
# Images: arnaultbretagne/agora, branch spike/sandbox-backend, sandbox/images/Dockerfile (CI
# sandbox-backend, commit 926845c).
---
# The lab's mock ACP agent: no model, deterministic behaviours, a real native transcript.
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: mock-556cbcb8ee97
spec:
  networkPolicyManagement: Unmanaged
  podTemplate:
    metadata:
      labels:
        app.kubernetes.io/part-of: agora-sandboxes
        agora.bretagne.dev/harness: mock
    spec:
      runtimeClassName: kata
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      # The grace period is for one thing: the bridge stops the adapter and pushes the anchor.
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sandbox
          image: ghcr.io/arnaultbretagne/agora-sandbox-mock@sha256:556cbcb8ee978681278d0bf9e3e876c4cf92fc6a7a03bc8029bc0d0c0ee062d6
          ports:
            - name: bridge
              containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: BRIDGE_PUBLIC_KEY
              valueFrom:
                configMapKeyRef:
                  name: agora-bridge-key
                  key: public.pem
            - name: AGORA_ANCHOR_URL
              value: http://backend.agora-lab.svc.cluster.local:8081/anchors
            - name: AGORA_TOKEN_FILE
              value: /var/run/agora/token
          # Ready means ACP is servable: the adapter lives and answered initialize.
          readinessProbe:
            httpGet: { path: /healthz, port: bridge }
            periodSeconds: 2
            failureThreshold: 1
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - { name: home, mountPath: /home/harness }
            - { name: tmp, mountPath: /tmp }
            - { name: agora-token, mountPath: /var/run/agora, readOnly: true }
      volumes:
        - name: home
          emptyDir: { sizeLimit: 2Gi }
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
        # The Pod's identity when it pushes its anchor: minted and rotated by the kubelet, bound to
        # this Pod, only valid for the back-end's audience — useless against the API server.
        - name: agora-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: agora-anchors
                  expirationSeconds: 600
                  path: token
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: mock-556cbcb8ee97
  labels:
    agora.bretagne.dev/harness: mock
spec:
  replicas: 2
  sandboxTemplateRef:
    name: mock-556cbcb8ee97
---
