# The template every harness shares (docs/specs/executions.md, "What the template provides"). Its
# name, harness label and image come from the harness's own folder (harness.yaml, by its replacements).
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: harness
spec:
  networkPolicyManagement: Unmanaged
  # The back-end reaches the bridge through this Service (status.sandbox.serviceFQDN).
  service: true
  podTemplate:
    metadata:
      labels:
        app.kubernetes.io/part-of: agora-sandboxes
        agora.bretagne.dev/harness: harness
    spec:
      runtimeClassName: kata
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      # The grace period is for one thing: the bridge stops the adapter and pushes the anchor.
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sandbox
          image: image
          ports:
            - name: bridge
              containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: BRIDGE_PUBLIC_KEY
              valueFrom:
                configMapKeyRef:
                  name: agora-bridge-key
                  key: public.pem
            - name: AGORA_ANCHOR_URL
              value: http://server.agora.svc.cluster.local:8081/anchors
            - name: AGORA_TOKEN_FILE
              value: /var/run/agora/token
            # The gateway's root: the harness's TLS to the outside ends at the gateway.
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/agora/credential-proxy/ca.pem
            # The same root for git, whose libcurl does not read NODE_EXTRA_CA_CERTS: everything it
            # fetches or pushes goes through the gateway.
            - name: GIT_SSL_CAINFO
              value: /etc/agora/credential-proxy/ca.pem
            # Who commits: an address of no GitHub account, so a commit shows this name rather than
            # the operator's; the same for every execution until agents have names of their own.
            # Pushing is the gateway's PAT, whatever this says.
            - { name: GIT_AUTHOR_NAME, value: Agora }
            - { name: GIT_AUTHOR_EMAIL, value: agent@agora.bretagne.dev }
            - { name: GIT_COMMITTER_NAME, value: Agora }
            - { name: GIT_COMMITTER_EMAIL, value: agent@agora.bretagne.dev }
          # Ready means the adapter runs; Agora initializes it after allocation.
          readinessProbe:
            httpGet: { path: /healthz, port: bridge }
            periodSeconds: 2
            failureThreshold: 1
          # An idle sandbox uses ~1m CPU (measured 2026-09-27). The request only reserves scheduling
          # room on a 6-core node: at 250m (+100m Kata overhead) a cold sandbox could not be scheduled
          # while stopped ones waited for their deadline. A turn may still burst up to the limit.
          # Kata sizes the VM at the memory limit (+32Mi), so the limit is all the RAM the agent has:
          # at 1Gi, three sub-agents plus 25 `node` processes started at once ran the VM out and its
          # kernel killed Claude Code mid-turn (2026-10-30). The VM takes host RAM only when it first
          # touches it, and keeps it until the Pod ends (reclaim_guest_freed_memory is off).
          resources:
            requests: { cpu: 50m, memory: 512Mi }
            limits: { cpu: "1", memory: 4Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # The home and /tmp share one volume, so neither has a wall of its own: at 256Mi for /tmp, an
          # agent unpacking a 257 MB npm package there got its Pod evicted mid-turn (2026-10-13).
          volumeMounts:
            - { name: scratch, mountPath: /home/harness, subPath: home }
            - { name: scratch, mountPath: /tmp, subPath: tmp }
            - { name: agora-token, mountPath: /var/run/agora, readOnly: true }
            - { name: credential-proxy, mountPath: /etc/agora/credential-proxy, readOnly: true }
      volumes:
        # Past this size the kubelet evicts the Pod at once. It takes only what is written: at worst
        # MAX_ACTIVE (16) × 8Gi = 128Gi, against ~318 GB free on g4 (2026-10-13).
        - name: scratch
          emptyDir: { sizeLimit: 8Gi }
        # The Pod's identity when it pushes its anchor: minted and rotated by the kubelet, bound to
        # this Pod, only valid for the back-end's audience — useless against the API server.
        - name: agora-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: agora-anchors
                  expirationSeconds: 600
                  path: token
        - name: credential-proxy
          configMap:
            name: credential-proxy-ca
