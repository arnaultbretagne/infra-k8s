apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - harness.yaml
# Its data into the shared template and pool: the name — the harness and its image's digest, so that
# a new image is a new template and pool — the label and the image.
replacements:
  - source: { kind: ConfigMap, name: claude-code, fieldPath: data.name }
    targets:
      - select: { kind: SandboxTemplate }
        fieldPaths:
          - metadata.name
      - select: { kind: SandboxWarmPool }
        fieldPaths:
          - metadata.name
          - spec.sandboxTemplateRef.name
  - source: { kind: ConfigMap, name: claude-code, fieldPath: data.harness }
    targets:
      - select: { kind: SandboxTemplate }
        fieldPaths:
          - "spec.podTemplate.metadata.labels.[agora.bretagne.dev/harness]"
      - select: { kind: SandboxWarmPool }
        fieldPaths:
          - "metadata.labels.[agora.bretagne.dev/harness]"
  - source: { kind: ConfigMap, name: claude-code, fieldPath: data.image }
    targets:
      - select: { kind: SandboxTemplate }
        fieldPaths:
          - "spec.podTemplate.spec.containers.[name=sandbox].image"
patches:
  - target: { kind: SandboxWarmPool }
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          # The base profiles (docs/specs/credentials.md): Agora hands each warm Pod a token for
          # them, so the SDK reaches Anthropic from the start.
          agora.bretagne.dev/base-profiles: anthropic
          # The settings each Session starts with: no permission asked, Opus 5.5, high effort.
          agora.bretagne.dev/session-config: mode=bypassPermissions,model=opus,effort=high
