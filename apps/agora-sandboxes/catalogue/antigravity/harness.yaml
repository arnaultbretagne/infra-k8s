# agy, the Antigravity CLI, over its own ACP server, on the cluster's own Google login: a Google account
# dedicated to the cluster, never the operator's. The gateway sets its access token (routes antigravity and
# antigravity-userinfo, kept fresh by apps/agora-gateway/antigravity-refresher.yaml); the image writes a
# placeholder token file and nothing in the sandbox can refresh it (docs/specs/credentials.md on
# arnaultbretagne/agora, "Antigravity").
# `name`, `image`, `versions`, `source` and `inputs` are written by Agora's CI when it proposes a new
# image (arnaultbretagne/agora, .github/workflows/ci.yml). Added by hand, as main's CI published it at
# afdf6f6 (the image index its tag afdf6f694c41… names, as the other harnesses pin theirs) with the fingerprint
# of its inputs at that commit (scripts/inputs.ts): its next proposal comes when those inputs change.
apiVersion: v1
kind: ConfigMap
metadata:
  name: antigravity
  annotations:
    config.kubernetes.io/local-config: "true"
data:
  harness: antigravity
  name: antigravity-61199e77a810
  image: ghcr.io/arnaultbretagne/agora-harness-antigravity@sha256:61199e77a81062e5ab41924de05c512d4d9f34ff86437034bb406d546a400c85
  versions: agy 1.5.13
  source: arnaultbretagne/agora main aaec7a6
  inputs: "4e42b09eec092206"
