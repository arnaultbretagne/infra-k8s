# A pool is not a concurrency limit (claims come on top of the warm stock), so the namespace is
# bounded here; the back-end also caps its active sandboxes (MAX_ACTIVE, apps/agora/server.yaml).
# Kata's RuntimeClass overhead (100m / 256Mi per Pod) counts against these requests. Sized for 25
# Pods: MAX_ACTIVE (16) claims, the warm Pods of every pool (mock 2, claude-code, opencode, codex, antigravity),
# and 3 for a pool being replaced when its image changes. Per Pod: 150m / 768Mi requested,
# 1.1 CPU / 4.25Gi in limits.
#
# The memory limits overcommit the node on purpose: a sandbox holds 130-490Mi idle (measured
# 2026-10-07), well under its 4.25Gi ceiling. If many burst at once, the kubelet sheds the
# sandboxes above their request first; the server, gateway, log and IdP are bretagne-critical.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: sandbox-bounds
spec:
  hard:
    pods: "25"
    requests.cpu: "4"        # 25 × 150m = 3.75
    requests.memory: 19Gi    # 25 × 768Mi = 18.75Gi
    limits.cpu: "28"         # 25 × 1.1 = 27.5
    limits.memory: 107Gi     # 25 × 4.25Gi = 106.25Gi
