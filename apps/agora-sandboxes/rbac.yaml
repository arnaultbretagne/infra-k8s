# What the sandbox back-end may do here (docs/backend.md on feat/sandbox-backend): create claims and re-arm their deadline,
# read the catalogue and what the claims point to. No `delete` on anything: Agent Sandbox alone
# destroys, at the deadline.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agora-sandbox-backend
rules:
  - apiGroups: [extensions.agents.x-k8s.io]
    resources: [sandboxclaims]
    verbs: [get, list, watch, create, patch]
  - apiGroups: [extensions.agents.x-k8s.io]
    resources: [sandboxwarmpools, sandboxtemplates]
    verbs: [get, list, watch]
  - apiGroups: [agents.x-k8s.io]
    resources: [sandboxes]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agora-sandbox-backend
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agora-sandbox-backend
subjects:
  - kind: ServiceAccount
    name: backend
    namespace: agora-lab
