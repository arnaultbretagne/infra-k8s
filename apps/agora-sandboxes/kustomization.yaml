# Agora's sandboxes (docs/executions.md on arnaultbretagne/agora feat/executions). Driven by
# Agora's executions, mounted by its server in `agora`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agora-sandboxes
resources:
  - namespace.yaml
  - quota.yaml
  - ghcr-pull.secrets.yaml
  - codex-account.secrets.yaml
  - bridge-key.yaml
  - credential-proxy-ca.yaml
  - networkpolicy.yaml
  - rbac.yaml
  - catalogue
