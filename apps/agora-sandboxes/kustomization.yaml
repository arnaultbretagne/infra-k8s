# Agora's sandboxes (docs/backend.md on arnaultbretagne/agora feat/sandbox-backend). Driven by the
# sandbox back-end in agora-lab.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agora-sandboxes
resources:
  - namespace.yaml
  - quota.yaml
  - ghcr-pull.secrets.yaml
  - bridge-key.yaml
  - networkpolicy.yaml
  - rbac.yaml
  - catalogue.yaml
