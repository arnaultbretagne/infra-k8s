# ============================================================================
# TEMPORARY HEAD->GET SHIM FOR AIOSTREAMS DEBRID PLAYBACK — TO DECOMMISSION
 # ============================================================================
 # WHY THIS EXISTS (2026-09-27):
 #   AIOStreams v2 blocks HTTP HEAD on the whole /api/v1/debrid router
 #   (explicit middleware in packages/server/src/routes/api/debrid.ts,
 #   "block HEAD requests" -> 405). Verified present in v2.26.0, v2.35.0 and
 #   v2.35.9 (2026-10-07: HEAD on the playback route still answers 405).
 #   Stremio's streaming engine (server.js v4.21.x, dl.strem.io) probes every
 #   stream URL with `fetch(url, {method: "HEAD"})` and ABORTS playback when
 #   the response is not ok ("Failed to fetch Media URL"). Result: streams are
 #   found but no file ever loads.
 #   Upstream tracking: https://github.com/Viren070/AIOStreams/issues/1009
 #   (fix PR https://github.com/Viren070/AIOStreams/pull/1010 — NOT merged).
 #
 # HOW TO CHECK IF STILL NEEDED (after any AIOStreams upgrade):
 #   curl -sI -o /dev/null -w '%{http_code}\n' \
 #     https://stremio.bretagne.dev/api/v1/debrid/playback/x/y/z
 #   307/4xx-with-body => still needed (405 was the bug; any non-405 means
 #   HEAD reaches the route). Confirm with a real playback in a Stremio client.
 #
 # HOW TO DECOMMISSION (when upstream ships HEAD support):
 #   1. deployment.yaml: remove the `head-shim` container + its 3 volumes.
 #   2. Delete this file and drop it from kustomization.yaml.
 #   3. service.yaml: targetPort back to 3000.
 #   4. networkpolicy.yaml: aiostreams ingress (traefik, oauth2-proxy) ports
 #      8080 -> 3000, and the oauth2-proxy egress rule to the app 8080 -> 3000.
 # ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: aiostreams-head-shim
data:
  nginx.conf: |
    pid /tmp/nginx.pid;
    worker_processes 1;
    error_log /dev/stderr notice;

    events {
      worker_connections 256;
    }

    http {
      access_log /dev/stdout;
      include /etc/nginx/mime.types;
      client_max_body_size 10m;

      # HEAD->GET: only for the playback route. nginx automatically answers a
      # HEAD client with headers only, so the player still gets a HEAD-shaped
      # response (307 + Location, no body). GET/POST/... pass through as-is.
      map $request_method $upstream_method {
        HEAD    GET;
        default $request_method;
      }

      server {
        listen 8080;

        location /api/v1/debrid/playback/ {
          proxy_pass http://127.0.0.1:3000;
          proxy_method $upstream_method;
          proxy_buffering off;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          # Keep the REAL client first in XFF (AIOStreams reads split(',')[0]
          # for debrid link resolution — do not let the pod IP shadow it).
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
          proxy_read_timeout 65s;
        }

        location / {
          proxy_pass http://127.0.0.1:3000;
          proxy_buffering off;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
          proxy_read_timeout 65s;
        }
      }
    }
