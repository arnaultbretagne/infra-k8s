# AIOStreams canonical state lives in Postgres. /app/data is only a
# reconstructible cache (anime DB, SeaDex, temporary local files).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: aiostreams-pg
  annotations:
    cnpg.io/skipEmptyWalArchiveCheck: enabled
spec:
  instances: 1

  resources:
    requests:
      cpu: 25m
      memory: 160Mi
    limits:
      memory: 384Mi

  monitoring:
    enablePodMonitor: true

  storage:
    size: 1Gi
    storageClass: local-path

  bootstrap:
    recovery:
      source: aiostreams-pg-backup
      database: aiostreams
      owner: aiostreams

  externalClusters:
    - name: aiostreams-pg-backup
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: aiostreams-pg-r2
          serverName: aiostreams-pg

  # Base backups, WAL archiving and restores go through the Barman Cloud plugin
  # (infrastructure/controllers/cloudnativepg), into the ObjectStore below.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: aiostreams-pg-r2
        # One cluster, one barman server: never reuse this serverName for another cluster.
        serverName: aiostreams-pg
---
# Where aiostreams-pg's backups go: R2, under s3://bretagne-pg-backups/aiostreams/aiostreams-pg,
# the layout restore-test.yaml reads. The plugin's sidecar in the PostgreSQL Pod uses it.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: aiostreams-pg-r2
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  retentionPolicy: "3d"
  configuration:
    destinationPath: s3://bretagne-pg-backups/aiostreams
    endpointURL: https://938f9d4cdcf888eddea773d0f68615bc.r2.cloudflarestorage.com
    s3Credentials:
      accessKeyId: { name: cnpg-s3-creds, key: ACCESS_KEY_ID }
      secretAccessKey: { name: cnpg-s3-creds, key: SECRET_ACCESS_KEY }
    wal:
      compression: snappy
  instanceSidecarConfiguration:
    resources:
      requests: { cpu: 10m, memory: 64Mi }
      limits: { memory: 512Mi }
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: aiostreams-pg-daily
spec:
  # 6-field robfig cron (leading SECONDS), staggered after other app DB backups.
  schedule: "0 30 3 * * *"
  # Take a base backup as soon as this object is created, don't wait for the first
  # scheduled slot. Without it a fresh cluster has no backup until the next 03:30,
  # so cnpg_collector_last_available_backup_timestamp stays 0 and CNPGBackupTooOld
  # fires critical on every new DB. immediate only acts at creation time.
  immediate: true
  cluster:
    name: aiostreams-pg
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  backupOwnerReference: self
