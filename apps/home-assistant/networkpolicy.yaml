# Default-deny + allow-list (ADR 0020).
#
# HA reaches exactly six things: DNS, its own Postgres, the Zigbee coordinator, the LG TV, SSDP
# multicast (discovery), and HTTPS out (Pocket-ID discovery/JWKS via the public IP, PyPI + wheels.
# home-assistant.io for the one-time custom-component deps install, HA's own integrations).
# Nothing intra-cluster beyond CNPG.
#
# The Zigbee coordinator is an SLZB-06p10 on the IoT VLAN (10.10.40.10, serial-over-TCP :6638); the
# LG webOS TV sits on VLAN 30 (10.10.30.110, SSAP WebSocket :3001). Pod egress leaves g4 masqueraded
# as 10.10.20.10 (Cilium vxlan + masquerade), so the ROUTER must also allow VLAN 20 -> each of those
# IP:port pairs — those rules are not in this repo (README.md).
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  endpointSelector:
    matchLabels:
      app: home-assistant
  ingress:
    # Traefik serves ha.bretagne.dev -> HA :8123
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik
      toPorts:
        - ports: [{ port: "8123", protocol: TCP }]
    # kubelet probes
    - fromEntities: [host]
      toPorts:
        - ports: [{ port: "8123", protocol: TCP }]
    # <- the router's "destination unreachable" for the TV. In standby the TV leaves the network, so
    #    every webostv reconnect to :3001 (each 12 s) ends with an ICMP host-unreachable sent by the
    #    VLAN 30 gateway, not by the TV. Cilium relates an ICMP error to the connection only when it
    #    comes from the peer's own address, so without this rule the router's reply is dropped on
    #    policy and NetworkPolicyDrops fires whenever the TV is off.
    - fromCIDR:
        - 10.10.30.1/32
      icmps:
        - fields:
            - { type: 3, family: IPv4 }
  egress:
    # -> DNS
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
    # -> recorder database (CNPG, same namespace)
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: ha-pg
      toPorts:
        - ports: [{ port: "5432", protocol: TCP }]
    # -> Zigbee coordinator (SLZB-06p10, IoT VLAN), serial over TCP. This IP and port only.
    - toCIDR:
        - 10.10.40.10/32
      toPorts:
        - ports: [{ port: "6638", protocol: TCP }]
    # -> LG webOS TV (VLAN 30), the webostv integration's SSAP WebSocket over TLS (:3001). :3000 is
    #    here only so its refusal comes back: aiowebostv tries ws://:3000 first and falls back to
    #    wss://:3001 on a refused connection, but a silent drop here outlasts its 2 s connect timeout
    #    and the whole connect fails ("cannot connect", no prompt on the TV). The router refuses
    #    :3000 (RST), so the traffic stays TLS. The TV's SSH (:22) is never reachable from the pod.
    - toCIDR:
        - 10.10.30.110/32
      toPorts:
        - ports:
            - { port: "3001", protocol: TCP }
            - { port: "3000", protocol: TCP }
    # -> SSDP/UPnP discovery (default_config's ssdp integration): UDP 1900 to the SSDP
    #    multicast group and the local broadcast, nothing else. Without this rule the
    #    periodic discovery bursts feed NetworkPolicyDrops forever (hubble POLICY_DENIED).
    - toCIDR:
        - 239.255.255.250/32
        - 255.255.255.255/32
      toPorts:
        - ports: [{ port: "1900", protocol: UDP }]
    # -> id.bretagne.dev (OIDC discovery, token, JWKS) + PyPI/wheels (init) + HA integrations.
    #    The public IP resolves to the home line; kube-proxy/host may DNAT it to the Traefik pod
    #    — same three-way allow as the oauth2-proxy CNPs.
    - toEntities: [world, host]
      toPorts:
        - ports: [{ port: "443", protocol: TCP }]
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik
      toPorts:
        - ports: [{ port: "8443", protocol: TCP }]
---
# Backup + restore-drill jobs: DNS and R2 (HTTPS) only.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: home-assistant-jobs
  namespace: home-assistant
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/part-of: home-assistant-backup
  ingress: []
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
    - toEntities: [world]
      toPorts:
        - ports: [{ port: "443", protocol: TCP }]
