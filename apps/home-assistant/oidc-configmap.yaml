# Bootstrap identity values for HA — none of them is secret.
#
# owner_username / owner_name: the owner account onboard.py creates unattended at first start.
# MUST equal your Pocket-ID `preferred_username` (auth_oidc.features.automatic_user_linking lands
# the OIDC identity on this account, so you stay the single owner instead of getting a second,
# non-owner HA user).
#
# client_id: the Pocket-ID client_id of the `home-assistant` OIDC client (apps/pocket-id/
# oidc-reconciler/spec.json). PUBLIC client + PKCE => there is NO client_secret; this id is the only
# value to bootstrap, and it travels in every browser redirect anyway. Pocket-ID mints it at
# creation, so: merge -> run the reconciler -> read the id in Pocket-ID admin -> put it here -> PR.
# Until then HA boots with the placeholder: OIDC login fails cleanly and the native login stays
# reachable (README.md).
apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-oidc
data:
  owner_username: arnault.bretagne
  owner_name: Arnault Bretagne
  client_id: REPLACE_WITH_POCKET_ID_CLIENT_ID
