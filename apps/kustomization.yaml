apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - shared
  - pocket-id
  - stremio
  - code-server
  - obsidian
  # `agent` (the channels-era hub) was decommissioned 2026-08-07 — replaced by `agora`, and `agora`
  # itself was decommissioned 2026-09-08 — replaced by the rewritten engine in `agora-system`, whose
  # workloads come from the product's own repository (clusters/bretagne/agora.yaml).
  - agora-system
  - agora-onecli
  - agora-runs
  # The UI showcase of the redesign (agora-test.bretagne.dev), public, static, no backend.
  - agora-test
  # The redesign's sandbox back-end: Kata sandboxes (Agent Sandbox claims) and its lab
  # (agora-lab.bretagne.dev, OIDC-gated).
  - agora-sandboxes
  - agora-lab
  - agent-vault
  - home-assistant
  - terminal
