apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - shared
  - pocket-id
  - stremio
  - code-server
  - obsidian
  # `agent` (the channels-era hub) was decommissioned 2026-08-07 — replaced by `agora`, and `agora`
  # itself was decommissioned 2026-09-08 — replaced by the rewritten engine in `agora-system`, itself
  # retired 2026-10: `agora-system` now holds Agora's database, `agora-pg`, for the server's log.
  - agora-system
  - agora-onecli
  - agora-runs
  # The UI showcase of the redesign (agora-test.bretagne.dev), public, static, no backend.
  - agora-test
  # Agora: its sandboxes (Kata, Agent Sandbox claims) and its server (agora.bretagne.dev,
  # OIDC-gated).
  - agora-sandboxes
  - agora
  # Their credential gateway: the sandboxes' only way out (agentgateway, grants signed by the server).
  - agora-gateway
  - agent-vault
  - home-assistant
  - terminal
