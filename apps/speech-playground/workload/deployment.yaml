# The playground's server (server.mjs) on the public node image: the code, the page and the one
# config file (services.json) are ConfigMaps; editing one rolls the Deployment (name hash). It holds
# the Xiaomi MiMo key, mounted from the Secret `xiaomi-mimo` (SOPS, xiaomi-mimo.secret.yaml): optional,
# so the server starts without it and lists Xiaomi as unavailable; it reads the file on every
# request, so the Secret is picked up once the kubelet syncs it, without a restart.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: speech-playground
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: speech-playground
  template:
    metadata:
      labels:
        app: speech-playground
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      priorityClassName: bretagne-low
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: node:24-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
          command: [node, /app/server.mjs]
          env:
            - { name: PORT, value: "8080" }
            - { name: CONFIG_FILE, value: /config/services.json }
            - { name: WEB_DIR, value: /app }
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 10
            periodSeconds: 3
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: app, mountPath: /app, readOnly: true }
            - { name: config, mountPath: /config, readOnly: true }
            - { name: xiaomi-mimo, mountPath: /secrets/xiaomi-mimo, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: app
          configMap:
            name: speech-playground-app
        - name: config
          configMap:
            name: speech-playground-config
        - name: xiaomi-mimo
          secret:
            secretName: xiaomi-mimo
            optional: true
        - name: tmp
          emptyDir: { sizeLimit: 16Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: speech-playground
spec:
  selector:
    app: speech-playground
  ports:
    - name: http
      port: 8080
      targetPort: http
