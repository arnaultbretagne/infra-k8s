<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speech playground</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { max-width: 60rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.4; }
  h1 { font-size: 1.4rem; }
  section { border: 1px solid #8884; border-radius: .5rem; padding: 1rem; margin-bottom: 1.5rem; }
  h2 { margin-top: 0; font-size: 1.15rem; }
  label { display: inline-flex; flex-direction: column; gap: .2rem; margin: 0 1rem .8rem 0; font-size: .9rem; }
  select, textarea, button, input { font: inherit; }
  textarea { width: 100%; min-height: 6rem; box-sizing: border-box; }
  button { padding: .35rem .9rem; margin: 0 .5rem .5rem 0; cursor: pointer; }
  button:disabled { cursor: default; opacity: .5; }
  .result { white-space: pre-wrap; background: #8881; border-radius: .3rem; padding: .6rem; min-height: 1.4rem; }
  .metrics { font-variant-numeric: tabular-nums; font-size: .9rem; margin: .5rem 0; }
  .error { color: #c33; }
  .status { font-size: .85rem; opacity: .8; }
  table { border-collapse: collapse; width: 100%; font-size: .85rem; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: .25rem .5rem; border-bottom: 1px solid #8883; }
  audio { width: 100%; margin-top: .5rem; }
</style>
</head>
<body>
<h1>Speech playground</h1>
<p class="status" id="services-status">Chargement des services…</p>

<section id="stt">
  <h2>STT — reconnaissance vocale</h2>
  <label>Service <select id="stt-service"></select></label>
  <label>Modèle <select id="stt-model"></select></label>
  <label>Langue (optionnel) <input id="stt-language" size="4" placeholder="fr"></label>
  <div>
    <button id="stt-record">● Enregistrer</button>
    <button id="stt-stop" disabled>■ Arrêter</button>
    <label>ou un fichier <input type="file" id="stt-file" accept="audio/*"></label>
  </div>
  <p class="status" id="stt-input-status">Aucun audio.</p>
  <audio id="stt-preview" controls hidden></audio>
  <div><button id="stt-run" disabled>Transcrire</button></div>
  <div class="metrics" id="stt-metrics"></div>
  <div class="result" id="stt-result"></div>
</section>

<section id="tts">
  <h2>TTS — synthèse vocale</h2>
  <label>Service <select id="tts-service"></select></label>
  <label>Modèle <select id="tts-model"></select></label>
  <label>Voix <select id="tts-voice"></select></label>
  <textarea id="tts-input">Bonjour, ceci est un essai de synthèse vocale.</textarea>
  <div><button id="tts-run">Synthétiser</button></div>
  <div class="metrics" id="tts-metrics"></div>
  <div class="error" id="tts-error"></div>
  <audio id="tts-audio" controls hidden></audio>
</section>

<section>
  <h2>Historique</h2>
  <table>
    <thead><tr><th>Usage</th><th>Service</th><th>Modèle</th><th>Voix</th><th>1er octet</th><th>Durée totale</th><th>Service seul</th></tr></thead>
    <tbody id="history"></tbody>
  </table>
</section>

<script type="module" src="/app.js"></script>
</body>
</html>
