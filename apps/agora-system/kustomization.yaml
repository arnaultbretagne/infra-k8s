# Agora's database, `agora-pg`, and the log's schema on it (packages/log on arnaultbretagne/agora).
# Its client is Agora's server, in `agora`. The engine that ran here before — its workloads came from the
# agora repository through the `agora` Flux Kustomization — is retired, and this namespace now
# declares the database itself.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agora-system
resources:
  - namespace.yaml
  - limits.yaml
  - ghcr-pull.secrets.yaml
  - agora-owner-pg.secrets.yaml
  - agora-log-writer-pg.secrets.yaml
  - agora-log-projector-pg.secrets.yaml
  - agora-log-anchors-pg.secrets.yaml
  - postgres.yaml
  - log-migration.yaml
  - networkpolicy.yaml
  - restore-test.yaml
