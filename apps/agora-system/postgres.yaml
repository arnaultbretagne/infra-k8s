# Agora's database: the cluster `agora-pg`, its database `agora` and its owner `agora_owner`, the
# names it has carried since the rewritten engine. It moved here from the agora repository
# (deploy/overlays/live/postgres.yaml) when that engine was retired; the instance, its volume and
# its backup chain are the same ones.
#
# Never pruned: a refactor of this directory must not be able to delete the database. Removing it
# is a deliberate `kubectl delete`.
#
# The log's schema creates three NOLOGIN roles — agora_writer, agora_projector, agora_anchors
# (packages/log/sql/001.sql) — and the server connects with one login per role, declared below with
# passwords the environment owns. Until the migration Job has run once, their `inRoles` dangle and
# CNPG reports them as failed; that heals on its next reconcile. No login owns a table: the schema
# belongs to `agora_owner`, used by the migration only.
#
# It backs up, because what it holds is unreplayable: the log is the record, and an anchor is a
# native transcript no harness can reconstruct. `cnpg-s3-creds` is distributed into this namespace
# by apps/shared/cnpg-s3-creds.yaml.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: agora-pg
  namespace: agora-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    cnpg.io/skipEmptyWalArchiveCheck: enabled
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.4
  # The superuser applies nothing: it is the operator's connection, for a wipe or a repair by hand.
  enableSuperuserAccess: true
  enablePDB: true
  primaryUpdateStrategy: unsupervised
  monitoring:
    enablePodMonitor: true
  bootstrap:
    initdb:
      database: agora
      owner: agora_owner
      secret:
        name: agora-owner-pg
  storage:
    size: 10Gi
    storageClass: local-path
  # The log of every workspace: shed last. Memory request = 7-day measured usage (2026-10-07:
  # p95 508Mi, peak 609Mi); CPU = the request-path floor (docs/hosting-an-app.md §4.3).
  priorityClassName: bretagne-critical
  resources:
    requests: { cpu: 50m, memory: 640Mi }
    limits: { cpu: '2', memory: 1Gi }
  # A client gone without its connection's close ever reaching PostgreSQL (the lab's Pod, when it
  # moved to `agora`) leaves its backend idle — and the advisory lock that makes a server the log's
  # owner held, so every new server is refused — until the kernel's default keepalive, 2 h. Probed
  # after 30 s idle, every 10 s, dropped after 3 misses: the next server starts within about a minute.
  postgresql:
    parameters:
      tcp_keepalives_idle: "30"
      tcp_keepalives_interval: "10"
      tcp_keepalives_count: "3"

  managed:
    roles:
      # Applies the schema: it creates the three group roles, hence CREATEROLE.
      - name: agora_owner
        login: true
        createdb: true
        createrole: true
        passwordSecret:
          name: agora-owner-pg
      - name: agora_log_writer
        login: true
        inRoles: [agora_writer]
        passwordSecret:
          name: agora-log-writer-pg
      - name: agora_log_projector
        login: true
        inRoles: [agora_projector]
        passwordSecret:
          name: agora-log-projector-pg
      - name: agora_log_anchors
        login: true
        inRoles: [agora_anchors]
        passwordSecret:
          name: agora-log-anchors-pg
      # The retired engine's logins.
      - { name: agora_cp_login, ensure: absent }
      - { name: agora_rc_login, ensure: absent }
      - { name: agora_payload_login, ensure: absent }

  # Base backups, WAL archiving and restores go through the Barman Cloud plugin
  # (infrastructure/controllers/cloudnativepg), into the ObjectStore below.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: agora-pg-r2
        # One cluster, one barman server: never reuse this serverName for another cluster.
        serverName: agora-pg
---
# Where agora-pg's backups go: R2, under s3://bretagne-pg-backups/agora/agora-pg,
# the layout restore-test.yaml reads. The plugin's sidecar in the PostgreSQL Pod uses it.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: agora-pg-r2
  namespace: agora-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  retentionPolicy: "7d"
  configuration:
    destinationPath: s3://bretagne-pg-backups/agora
    endpointURL: https://938f9d4cdcf888eddea773d0f68615bc.r2.cloudflarestorage.com
    s3Credentials:
      accessKeyId: { name: cnpg-s3-creds, key: ACCESS_KEY_ID }
      secretAccessKey: { name: cnpg-s3-creds, key: SECRET_ACCESS_KEY }
    wal:
      compression: snappy
  instanceSidecarConfiguration:
    resources:
      requests: { cpu: 10m, memory: 64Mi }
      limits: { memory: 512Mi }
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: agora-pg-daily
  namespace: agora-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  # Six fields, seconds first (robfig/cron). 03:45, after stremio and OneCLI at 03:30, so no two
  # base backups contend on this single node.
  schedule: "0 45 3 * * *"
  immediate: true
  cluster:
    name: agora-pg
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  backupOwnerReference: self
