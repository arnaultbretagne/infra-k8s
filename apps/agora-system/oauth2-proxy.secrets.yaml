# ADR 0021/0022 — the Pocket-ID client "agora" (apps/pocket-id/oidc-reconciler/spec.json). Carried
# over unchanged from apps/agora at the cutover: same host, same callback URL, same client, so the
# door does not move when what is behind it does.
#
# TODO (owed, 2026-09-08): this client secret and cookie secret were exposed in an assistant session
# transcript and the operator chose to defer rotation. The cookie secret signs oauth2-proxy sessions
# for agora.bretagne.dev; the client secret is the OIDC client credential. Rotate both:
#   cookie: openssl rand -base64 32, straight into this file
#   client: POST /oidc/clients/{id}/secret against Pocket-ID (the reconciler never writes secrets)
