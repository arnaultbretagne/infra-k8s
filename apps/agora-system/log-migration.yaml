# The log's schema on `agora`, applied by its owner (packages/log/scripts/migrate.ts, from the server's
# image). Idempotent, in one transaction; named after the schema it applies, so a new schema is a new
# Job, applied before the server that needs it. The owner's password reaches node-postgres through
# PGUSER/PGPASSWORD: the URL names no credential.
# 012: 001.sql as of agora dfcdbf6, the files in R2 (agora docs/specs/files.md): the table files, entries.files with its GIN index, anchors.file, anchors.content nullable, their grants; additive, the server before keeps working
apiVersion: batch/v1
kind: Job
metadata:
  name: agora-log-migrate-012
  namespace: agora-system
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        agora.dev/job: log-migration
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/arnaultbretagne/agora-server@sha256:796009367c00497cc83aefd364cbf5c2eef0c5be1f4028c4c68feb0922bd1fb1 # main dfcdbf6
          command: [node, /app/packages/log/scripts/migrate.ts]
          env:
            - { name: LOG_MIGRATION_URL, value: "postgresql://agora-pg-rw.agora-system.svc.cluster.local:5432/agora" }
            - name: PGUSER
              valueFrom: { secretKeyRef: { name: agora-owner-pg, key: username } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: agora-owner-pg, key: password } }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
