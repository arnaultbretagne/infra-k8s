# The log's schema on `agora`, applied by its owner (packages/log/scripts/migrate.ts, from the server's
# image). Idempotent, in one transaction; named after the schema it applies, so a new schema is a new
# Job, applied before the server that needs it. The owner's password reaches node-postgres through
# PGUSER/PGPASSWORD: the URL names no credential.
# 005: 001.sql as of agora 799d33d, whose transcript functions are cheaper: transcript_text inlined, the user's case in transcript_user_text, each text computed once.
apiVersion: batch/v1
kind: Job
metadata:
  name: agora-log-migrate-005
  namespace: agora-system
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        agora.dev/job: log-migration
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/arnaultbretagne/agora-server@sha256:66ef0b7673c057e8b3b51bf24a70af8f7315dc64b8e560c0525d86ecf91a1813 # main 799d33d
          command: [node, /app/packages/log/scripts/migrate.ts]
          env:
            - { name: LOG_MIGRATION_URL, value: "postgresql://agora-pg-rw.agora-system.svc.cluster.local:5432/agora" }
            - name: PGUSER
              valueFrom: { secretKeyRef: { name: agora-owner-pg, key: username } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: agora-owner-pg, key: password } }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
