# The log's schema on `agora`, applied by its owner (packages/log/scripts/migrate.ts, from the server's
# image). Idempotent, in one transaction; named after the schema it applies, so a new schema is a new
# Job, applied before the server that needs it. The owner's password reaches node-postgres through
# PGUSER/PGPASSWORD: the URL names no credential.
# 010: 001.sql as of agora da5389a, whose transcript() says who wrote a message of another's: the function replaced, no table touched, no index rebuilt
apiVersion: batch/v1
kind: Job
metadata:
  name: agora-log-migrate-010
  namespace: agora-system
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        agora.dev/job: log-migration
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/arnaultbretagne/agora-server@sha256:55bb99d7f5cf409b1f645d7c49069e3fe43e8da991da7566ff1ff417deaf9752 # main da5389a
          command: [node, /app/packages/log/scripts/migrate.ts]
          env:
            - { name: LOG_MIGRATION_URL, value: "postgresql://agora-pg-rw.agora-system.svc.cluster.local:5432/agora" }
            - name: PGUSER
              valueFrom: { secretKeyRef: { name: agora-owner-pg, key: username } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: agora-owner-pg, key: password } }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
