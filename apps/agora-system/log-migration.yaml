# The log's schema on `agora`, applied by its owner (packages/log/scripts/migrate.ts, from the server's
# image). Idempotent, in one transaction; named after the schema it applies, so a new schema is a new
# Job, applied before the server that needs it. The owner's password reaches node-postgres through
# PGUSER/PGPASSWORD: the URL names no credential.
# 008: 001.sql as of agora 5ff8da9, which widens the entries' kinds for delegation's facts and an approval's expiry: the check dropped and added again NOT VALID, under a brief lock on entries, no row read again.
apiVersion: batch/v1
kind: Job
metadata:
  name: agora-log-migrate-008
  namespace: agora-system
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        agora.dev/job: log-migration
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/arnaultbretagne/agora-server@sha256:9e8693804f7f54b848e26ad7746661354c397052c5d108749d38b811e1473526 # main 5ff8da9
          command: [node, /app/packages/log/scripts/migrate.ts]
          env:
            - { name: LOG_MIGRATION_URL, value: "postgresql://agora-pg-rw.agora-system.svc.cluster.local:5432/agora" }
            - name: PGUSER
              valueFrom: { secretKeyRef: { name: agora-owner-pg, key: username } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: agora-owner-pg, key: password } }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
