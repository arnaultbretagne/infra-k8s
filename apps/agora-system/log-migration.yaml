# The log's schema on `agora`, applied by its owner (packages/log/scripts/migrate.ts, from the server's
# image). Idempotent, in one transaction; named after the schema it applies, so a new schema is a new
# Job, applied before the server that needs it. The owner's password reaches node-postgres through
# PGUSER/PGPASSWORD: the URL names no credential.
# 006: 001.sql as of agora 2dea024, which reads the thread from the objects: each object keeps the position of its last change, the thread table goes once its positions are carried over, and only the last anchor per Workstream and harness stays.
apiVersion: batch/v1
kind: Job
metadata:
  name: agora-log-migrate-006
  namespace: agora-system
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        agora.dev/job: log-migration
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/arnaultbretagne/agora-server@sha256:c1dff622968e6c0ea7d15d6644a201e7e33d006b05092a6dcad34dfb249a8e13 # main 2dea024
          command: [node, /app/packages/log/scripts/migrate.ts]
          env:
            - { name: LOG_MIGRATION_URL, value: "postgresql://agora-pg-rw.agora-system.svc.cluster.local:5432/agora" }
            - name: PGUSER
              valueFrom: { secretKeyRef: { name: agora-owner-pg, key: username } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: agora-owner-pg, key: password } }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
