# East-west policy for the database's namespace (docs/hosting-an-app.md §7): default-deny, then the
# flows that exist. CiliumNetworkPolicy throughout: `fromEntities: [host]` and
# `toEntities: [kube-apiserver]` cannot be written with the plain API, and mixing frameworks in one
# namespace is how a rule ends up silently not applying.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny
  namespace: agora-system
spec:
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - {}
---
# The database: its clients are Agora's server (agora) and the log's migration; then the CNPG operator,
# its own instances, the kubelet and Prometheus.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agora-pg
  namespace: agora-system
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: agora-pg
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agora
            app: server
        - matchLabels:
            agora.dev/job: log-migration
      toPorts:
        - ports: [{ port: "5432", protocol: TCP }]
    - fromEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/name: cloudnative-pg
            k8s:io.kubernetes.pod.namespace: cnpg-system
      toPorts:
        - ports: [{ port: "8000", protocol: TCP }, { port: "5432", protocol: TCP }]
    # Instances of this same cluster (replicas, and the operator's own probes through them).
    - fromEndpoints:
        - matchLabels:
            cnpg.io/cluster: agora-pg
      toPorts:
        - ports: [{ port: "5432", protocol: TCP }, { port: "8000", protocol: TCP }]
    - fromEntities: [host]
      toPorts:
        - ports: [{ port: "8000", protocol: TCP }]
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports: [{ port: "9187", protocol: TCP }]
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports: [{ port: "53", protocol: UDP }, { port: "53", protocol: TCP }]
    # Barman → R2: WAL archiving and base backups leave the cluster over TLS.
    - toEntities: [world]
      toPorts:
        - ports: [{ port: "443", protocol: TCP }]
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: agora-pg
    - toEntities: [kube-apiserver]
---
# The log's migration: the database, nothing else.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: log-migration
  namespace: agora-system
spec:
  endpointSelector:
    matchLabels:
      agora.dev/job: log-migration
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports: [{ port: "53", protocol: UDP }, { port: "53", protocol: TCP }]
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: agora-pg
      toPorts:
        - ports: [{ port: "5432", protocol: TCP }]
---
# The restore drill. It is the one Pod here that legitimately talks to the object store: it pulls a
# base backup and its WAL from R2 into a throwaway PostgreSQL and asks it a question.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: restore-drill
  namespace: agora-system
spec:
  endpointSelector:
    matchLabels:
      agora.dev/job: restore-drill
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports: [{ port: "53", protocol: UDP }, { port: "53", protocol: TCP }]
    - toEntities: [world]
      toPorts:
        - ports: [{ port: "443", protocol: TCP }]
