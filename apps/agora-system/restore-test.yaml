apiVersion: batch/v1
kind: CronJob
metadata:
  name: agora-pg-restore-test
  namespace: agora-system
spec:
  schedule: "45 5 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 600
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 26
            runAsGroup: 102
            fsGroup: 102
            seccompProfile:
              type: RuntimeDefault    # agora-system enforces PSS 'baseline'; keep the stricter shape anyway
          containers:
            - name: restore-test
              image: ghcr.io/cloudnative-pg/postgresql:17
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: cnpg-s3-creds
                      key: ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: cnpg-s3-creds
                      key: SECRET_ACCESS_KEY
                - name: PGDATA
                  value: /tmp/pgdata
              command:
                - bash
                - -euo
                - pipefail
                - -c
                - |
                  S3_DEST="s3://bretagne-pg-backups/agora"
                  S3_ENDPOINT="https://938f9d4cdcf888eddea773d0f68615bc.r2.cloudflarestorage.com"
                  SERVER="agora-pg"

                  echo "==> Listing backups..."
                  barman-cloud-backup-list --endpoint-url "$S3_ENDPOINT" "$S3_DEST" "$SERVER"

                  echo "==> Restoring latest backup..."
                  barman-cloud-restore --endpoint-url "$S3_ENDPOINT" "$S3_DEST" "$SERVER" latest "$PGDATA"

                  # barman-cloud-restore leaves PGDATA group-writable (fsGroup); PostgreSQL
                  # refuses to start unless the data dir is 0700/0750.
                  chmod 700 "$PGDATA"

                  # Recover: replay WALs then promote immediately. Also neutralise the
                  # CNPG-managed runtime config that doesn't exist in this standalone pod:
                  # TLS certs live at /controller/certificates (absent here) and archiving
                  # would shell out to /controller/manager. Last value in auto.conf wins.
                  cat >> "$PGDATA/postgresql.auto.conf" <<PGCONF
                  restore_command = 'barman-cloud-wal-restore --endpoint-url $S3_ENDPOINT $S3_DEST $SERVER %f %p'
                  recovery_target = immediate
                  recovery_target_action = promote
                  # Neutralise every CNPG runtime setting that points at /controller/*
                  # (absent in this standalone pod). auto.conf is read last => wins.
                  ssl = off
                  archive_mode = off
                  logging_collector = off
                  unix_socket_directories = '/tmp'
                  PGCONF
                  touch "$PGDATA/recovery.signal"

                  # throwaway pod: allow passwordless local connections for the health query
                  # (CNPG superuser has no password, app creds aren't mounted here).
                  # PREPEND — pg_hba is first-match, CNPG's scram rules must not win first.
                  { printf '%s\n' "local all all trust" "host all all 127.0.0.1/32 trust" "host all all ::1/128 trust"; cat "$PGDATA/pg_hba.conf"; } > "$PGDATA/pg_hba.conf.tmp"
                  mv "$PGDATA/pg_hba.conf.tmp" "$PGDATA/pg_hba.conf"

                  echo "==> Starting PostgreSQL..."
                  pg_ctl -D "$PGDATA" -o "-p 5433 -c listen_addresses=localhost" start -w -t 60

                  echo "==> Checking readiness..."
                  pg_isready -h localhost -p 5433

                  # Connect as the CNPG-managed `postgres` superuser (always present, and the
                  # trust rules above make it passwordless here) rather than the app role — the
                  # app role's password lives in a Secret this throwaway pod does not mount.
                  #
                  # Asserting a NON-ZERO table count is the whole point: `SELECT count(*)` alone
                  # succeeds just as happily against a restored-but-empty database, which is
                  # exactly the failure this drill exists to catch. Found live 2026-08-07 — the
                  # first real run of this drill failed on `role "pocketid" does not exist`,
                  # left over from the pocket-id drill this was copied from. The restore itself
                  # had worked (WAL replayed from R2, consistent state reached); only the health
                  # query was wrong, so a healthy backup was being reported as a failed drill.
                  echo "==> Running health query..."
                  # Not "are there tables" — are the tables that make this database worth restoring
                  # there. A restored-but-empty database answers a generic count just as happily,
                  # which is the failure this drill exists to catch; and `workstreams` /
                  # `workstream_facts` / `saves` are precisely what cannot be reconstructed from
                  # anywhere else if this backup turns out to be a fiction.
                  CORE=$(psql -h localhost -p 5433 -U postgres -d agora -tAc \
                    "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_name IN ('workstreams','workstream_facts','saves','anchors');")
                  echo "restored core tables present: $CORE of 4"
                  if [ "$CORE" -lt 4 ]; then
                    echo "FAIL: the restored database is missing core product tables" >&2
                    exit 1
                  fi
                  echo "==> Stopping PostgreSQL..."
                  pg_ctl -D "$PGDATA" stop -m fast

                  echo "==> Restore test PASSED"
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 2Gi
