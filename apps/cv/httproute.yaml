apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cv
spec:
  parentRefs:
    - name: bretagne-gateway
      namespace: traefik
      sectionName: https-cv
  hostnames:
    - arnault.bretagne.dev
  rules:
    - filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: "max-age=86400; includeSubDomains"
      backendRefs:
        - name: cv
          port: 8080
