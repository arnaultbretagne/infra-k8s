# The whole nginx configuration: one worker, temp files and pid under /tmp (the root filesystem is
# read-only), the site's files and a health check.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 256;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  charset utf-8;
  charset_types text/css application/javascript image/svg+xml;
  access_log off;
  server_tokens off;
  sendfile on;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  gzip on;
  gzip_types text/css application/javascript image/svg+xml;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Everything comes from this server but the repositories' numbers, which the page asks of
    # GitHub's API. No inline script or style.
    add_header Content-Security-Policy "default-src 'self'; connect-src https://api.github.com; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "no-cache" always;

    location = /healthz {
      default_type text/plain;
      return 200 "ok\n";
    }

    # English at /, French at /fr.
    location = /fr {
      try_files /fr.html =404;
    }

    location / {
      try_files $uri $uri/ =404;
    }
  }
}
