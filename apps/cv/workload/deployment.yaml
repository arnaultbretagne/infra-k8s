# nginx-unprivileged (uid 101, port 8080) serving the site's ConfigMap. Read-only root filesystem:
# nginx writes only its pid and temp files, which nginx.conf points at /tmp. The memory limit keeps
# the 64 Mi floor of previews, which run this Deployment under Kata.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cv
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: cv
  template:
    metadata:
      labels:
        app: cv
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.30.6-alpine
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 10
            periodSeconds: 3
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 5m, memory: 16Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - { name: site, mountPath: /usr/share/nginx/html, readOnly: true }
            - { name: conf, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: site
          configMap:
            name: cv-site
        - name: conf
          configMap:
            name: cv-nginx
        - name: tmp
          emptyDir: { sizeLimit: 16Mi }
