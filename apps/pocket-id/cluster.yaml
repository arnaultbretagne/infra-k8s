apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pocket-id-pg
  annotations:
    cnpg.io/skipEmptyWalArchiveCheck: enabled
spec:
  instances: 1

  # Survive node memory pressure (S5) — the IdP DB. Also bound it (was unbounded:
  # a runaway PG could contribute to a node OOM). It idles ~142Mi.
  priorityClassName: bretagne-critical
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi

  # Prometheus scrapes the instance (:9187) via the operator-managed PodMonitor —
  # feeds the CNPG backup/WAL-archiving alerts (observability/rules.yaml).
  monitoring:
    enablePodMonitor: true

  storage:
    size: 1Gi
    storageClass: local-path

  bootstrap:
    recovery:
      source: pocket-id-pg-backup
      database: pocketid
      owner: pocketid

  externalClusters:
    - name: pocket-id-pg-backup
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: pocket-id-pg-r2
          serverName: pocket-id-pg

  # Base backups, WAL archiving and restores go through the Barman Cloud plugin
  # (infrastructure/controllers/cloudnativepg), into the ObjectStore below.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: pocket-id-pg-r2
        # One cluster, one barman server: never reuse this serverName for another cluster.
        serverName: pocket-id-pg
---
# Where pocket-id-pg's backups go: R2, under s3://bretagne-pg-backups/pocket-id/pocket-id-pg,
# the layout restore-test.yaml reads. The plugin's sidecar in the PostgreSQL Pod uses it.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: pocket-id-pg-r2
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  retentionPolicy: "3d"
  configuration:
    destinationPath: s3://bretagne-pg-backups/pocket-id
    endpointURL: https://938f9d4cdcf888eddea773d0f68615bc.r2.cloudflarestorage.com
    s3Credentials:
      accessKeyId: { name: cnpg-s3-creds, key: ACCESS_KEY_ID }
      secretAccessKey: { name: cnpg-s3-creds, key: SECRET_ACCESS_KEY }
    wal:
      compression: snappy
  instanceSidecarConfiguration:
    resources:
      requests: { cpu: 10m, memory: 64Mi }
      limits: { memory: 512Mi }
