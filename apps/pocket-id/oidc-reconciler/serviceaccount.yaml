# The reconciler's identity (cronjob.yaml). It holds no right of its own in the cluster: an app whose client
# names a Secret (spec.json `secret`) grants this ServiceAccount `get` and `update` on that one Secret, in
# its own namespace (ADR 0022, amendment 2026-10-29).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: oidc-reconciler
