# The STT brick: speaches serving Parakeet TDT 0.6B v3 (ONNX, fp32) and Whisper large-v3-turbo (CTranslate2,
# int8) behind POST /v1/audio/transcriptions. Both models are downloaded from Hugging Face at start
# (PRELOAD_MODELS, before the server listens), loaded on first use and then kept (STT_MODEL_TTL=-1), so the
# memory a pod holds is the memory measured on the preview after one transcription per model.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stt
  labels:
    app: stt
spec:
  replicas: 1
  # One pod at a time: a rolling update would hold two copies of the models, several GiB, on a node that
  # has no such room. An update costs a few minutes of STT down (download + start).
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: stt
  template:
    metadata:
      labels:
        app: stt
    spec:
      priorityClassName: bretagne-low
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # the image's `ubuntu` user
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: speaches
          image: ghcr.io/speaches-ai/speaches:0.9.0-rc.3-cpu@sha256:2163775b6df5e451a71200e8f675fed68dbd8ab184fc604453d549e486f22fd2
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PRELOAD_MODELS
              value: '["istupakov/parakeet-tdt-0.6b-v3-onnx","deepdml/faster-whisper-large-v3-turbo-ct2"]'
            - name: STT_MODEL_TTL
              value: "-1"
            - name: WHISPER__INFERENCE_DEVICE
              value: cpu
            - name: WHISPER__COMPUTE_TYPE
              value: int8
            - name: ENABLE_UI
              value: "false"
            - name: LOG_LEVEL
              value: info
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: MPLCONFIGDIR
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 5Gi
            limits:
              memory: 7Gi
          # The download of ~4 GiB of models happens before the port opens: up to 30 minutes.
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 180
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4
          volumeMounts:
            - name: cache # Hugging Face hub cache: the models
              mountPath: /home/ubuntu/.cache
            - name: tmp
              mountPath: /tmp
            - name: stt-model-aliases
              mountPath: /home/ubuntu/speaches/model_aliases.json
              subPath: model_aliases.json
              readOnly: true
      volumes:
        # On the node's disk, not in memory. Bounded: the kubelet evicts the pod rather than let a download
        # fill the disk. Lost with the pod, so a new pod downloads again (see the PR's rollback notes).
        - name: cache
          emptyDir:
            sizeLimit: 8Gi
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: stt-model-aliases
          configMap:
            name: stt-model-aliases
---
apiVersion: v1
kind: Service
metadata:
  name: stt
  labels:
    app: stt
spec:
  selector:
    app: stt
  ports:
    - name: http
      port: 80
      targetPort: http
