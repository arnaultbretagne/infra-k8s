# The STT brick: speaches serving Parakeet TDT 0.6B v3 (ONNX, fp32) and Whisper large-v3-turbo (CTranslate2,
# int8) behind POST /v1/audio/transcriptions. Both models are downloaded from Hugging Face at start
# (PRELOAD_MODELS, before the server listens), loaded into memory by the postStart hook before the pod is Ready,
# and then kept (STT_MODEL_TTL=-1): the memory a pod holds from Ready on is its models' memory.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stt
  labels:
    app: stt
spec:
  replicas: 1
  # One pod at a time: a rolling update would hold two copies of the models, several GiB, on a node that
  # has no such room. An update costs a few minutes of STT down (download + start).
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: stt
  template:
    metadata:
      labels:
        app: stt
    spec:
      priorityClassName: bretagne-low
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # the image's `ubuntu` user
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: speaches
          image: ghcr.io/speaches-ai/speaches:0.9.0-rc.3-cpu@sha256:2163775b6df5e451a71200e8f675fed68dbd8ab184fc604453d549e486f22fd2
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PRELOAD_MODELS
              value: '["istupakov/parakeet-tdt-0.6b-v3-onnx","deepdml/faster-whisper-large-v3-turbo-ct2"]'
            - name: STT_MODEL_TTL
              value: "-1"
            - name: WHISPER__INFERENCE_DEVICE
              value: cpu
            - name: WHISPER__COMPUTE_TYPE
              value: int8
            - name: ENABLE_UI
              value: "false"
            - name: LOG_LEVEL
              value: info
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: MPLCONFIGDIR
              value: /tmp
          # Loads the models into memory before the pod is Ready (the kubelet runs no probe until postStart
          # returns), so Ready means "answers at once", and a pod takes its full memory at start, not at the
          # first request. A model that fails to load fails the hook: the container restarts, CrashLoop alerts.
          lifecycle:
            postStart:
              exec:
                command:
                  - python
                  - -c
                  - |
                    import sys, time, urllib.error, urllib.request
                    base = "http://127.0.0.1:8000"
                    deadline = time.time() + 1800  # the downloads come first (PRELOAD_MODELS)
                    while True:
                        try:
                            urllib.request.urlopen(base + "/health", timeout=5)
                            break
                        except Exception:
                            if time.time() > deadline:
                                sys.exit("speaches never answered /health")
                            time.sleep(5)
                    for model in sys.argv[1:]:  # python -c: argv[0] is "-c", the models follow
                        req = urllib.request.Request(base + "/api/ps/" + model, method="POST")
                        try:
                            urllib.request.urlopen(req, timeout=900)
                        except urllib.error.HTTPError as e:
                            if e.code != 409:  # 409: already loaded
                                raise
                  - istupakov/parakeet-tdt-0.6b-v3-onnx
                  - deepdml/faster-whisper-large-v3-turbo-ct2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 5Gi
            limits:
              memory: 7Gi
          # Probes start once postStart has returned: downloads and loading included, up to 30 minutes.
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 180
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4
          volumeMounts:
            - name: cache # Hugging Face hub cache: the models
              mountPath: /home/ubuntu/.cache
            - name: tmp
              mountPath: /tmp
            - name: stt-model-aliases
              mountPath: /home/ubuntu/speaches/model_aliases.json
              subPath: model_aliases.json
              readOnly: true
      volumes:
        # On the node's disk, not in memory. Bounded: the kubelet evicts the pod rather than let a download
        # fill the disk. Lost with the pod, so a new pod downloads again (see the PR's rollback notes).
        - name: cache
          emptyDir:
            sizeLimit: 8Gi
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: stt-model-aliases
          configMap:
            name: stt-model-aliases
---
apiVersion: v1
kind: Service
metadata:
  name: stt
  labels:
    app: stt
spec:
  selector:
    app: stt
  ports:
    - name: http
      port: 80
      targetPort: http
