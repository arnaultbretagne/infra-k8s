# The TTS brick: speaches serving Kokoro 82M v1.0 (ONNX) behind POST /v1/audio/speech, with its French voice
# ff_siwis. The model is downloaded from Hugging Face at start (PRELOAD_MODELS: to the disk only). Memory on
# demand: Kokoro is loaded into RAM by its first request and unloaded after TTS_MODEL_TTL seconds without one;
# nothing loads it at start.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tts
  labels:
    app: tts
spec:
  replicas: 1
  # One pod at a time, as for stt: no two copies of the model during an update.
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: tts
  template:
    metadata:
      labels:
        app: tts
    spec:
      priorityClassName: bretagne-low
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # the image's `ubuntu` user
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: speaches
          image: ghcr.io/speaches-ai/speaches:0.9.0-rc.3-cpu@sha256:2163775b6df5e451a71200e8f675fed68dbd8ab184fc604453d549e486f22fd2
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PRELOAD_MODELS
              value: '["speaches-ai/Kokoro-82M-v1.0-ONNX"]'
            # Unload a model after 5 min without a request (speaches' own default; each model has its own clock).
            # Long enough to cover a comparison session, where requests come minutes apart, without paying a
            # reload each time (Parakeet takes ~34 s to load, Whisper ~10 s, Kokoro ~2 s, measured on the preview);
            # short enough that the RAM comes back soon after a test, and that the unload can be measured.
            - name: TTS_MODEL_TTL
              value: "300"
            - name: ENABLE_UI
              value: "false"
            - name: LOG_LEVEL
              value: info
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: MPLCONFIGDIR
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          # Sized for loading on demand, measured on the preview of #371 (Kata, 2026-11-18, metrics.k8s.io):
          # 566 Mi at rest (server alone), 1424 Mi with Kokoro loaded. The request covers the rest, the limit covers
          # every model loaded (1424 Mi × 1.5). Not hosting §4.3, which sizes the request on the loaded working
          # set: that would reserve the models' RAM around the clock, which on demand they do not hold. Between a
          # first request and the unload the pod is above its request, so first in line for eviction under memory
          # pressure, as bretagne-low means anyway. CPU 50m: the floor for what a user waits on.
          resources:
            requests:
              cpu: 50m
              memory: 0.75Gi
            limits:
              memory: 2.5Gi
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4
          volumeMounts:
            - name: cache # Hugging Face hub cache: the model
              mountPath: /home/ubuntu/.cache
            - name: tmp
              mountPath: /tmp
            - name: tts-model-aliases
              mountPath: /home/ubuntu/speaches/model_aliases.json
              subPath: model_aliases.json
              readOnly: true
      volumes:
        - name: cache
          emptyDir:
            sizeLimit: 2Gi
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: tts-model-aliases
          configMap:
            name: tts-model-aliases
---
apiVersion: v1
kind: Service
metadata:
  name: tts
  labels:
    app: tts
spec:
  selector:
    app: tts
  ports:
    - name: http
      port: 80
      targetPort: http
