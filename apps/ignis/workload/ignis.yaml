# Ignis (github.com/Nystik-gh/ignis): the real Obsidian app served to a browser, its Electron and Node
# APIs replaced by a shim that talks to this server over HTTP and a WebSocket. It has no
# authentication: whatever reaches it reads and writes the vault. In production its gate is
# apps/obsidian/ignis-oauth2-proxy.yaml; in a preview, the preview's gate.
#
# The image's entrypoint runs as root (useradd, chown, then gosu), which PSS restricted refuses. So it
# is not used, and its two steps are done here:
#   - `obsidian`, an init container, puts the Obsidian release the image is pinned to
#     (IGNIS_OBSIDIAN_PIN, 1.14.4 for 0.9.0) in the cache, from Obsidian's GitHub releases, as the
#     entrypoint does. Obsidian is not in the image: its licence forbids redistribution. The cache
#     keeps it across restarts: it downloads only when the cache does not hold that version.
#   - `ignis` starts the server directly.
# What is left out is the entrypoint's `npm install -g obsidian-headless`: the image does not hold
# `ob`, nothing here installs it (the root filesystem is read-only), so Ignis's headless sync cannot
# run. The vault must never have a second sync client.
#
# Everything lives on one volume, `data`, in three subPaths:
#   - vault         the vault, at /vaults/Arvault: the folder itself, no copy;
#   - ignis-data    Ignis's settings (DATA_ROOT);
#   - obsidian-app  the Obsidian cache (OBSIDIAN_ASSETS_PATH).
# Here `data` is an emptyDir, which is what a preview gets: an empty vault, started from scratch on
# every restart. Production (apps/obsidian/kustomization.yaml) puts the PVC obsidian-data in its place,
# the one the MCP server and the clipper use.
#
# VAULT_ROOT is not /vaults but /vault-index: a folder holding nothing but a link, Arvault ->
# /vaults/Arvault, written by the init container and mounted read-only in the server. Ignis's "remove
# vault" (Obsidian's "Remove from list") deletes the vault's folder recursively, files included; on a
# link it can only delete the link, and on a read-only folder not even that: create, rename and remove
# all fail, so the vault stays the only one. The link's name, Arvault, is the vault's name in Ignis and
# its id: Ignis and Obsidian key their per-vault state by it (trusted vaults in ignis-data, the
# browser's localStorage and IndexedDB), so renaming it starts that state afresh. The files and the
# vault's own .obsidian/ settings stay where they are.
#
# WS_ORIGINS is the public origin; a preview replaces it with its own (catalogue entry, urlEnv), so
# Ignis refuses a WebSocket opened by another site.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ignis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ignis
  template:
    metadata:
      labels:
        app: ignis
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: obsidian
          image: nobbe/ignis:0.9.0
          command:
            - bash
            - -ceu
            - |
              v="$IGNIS_OBSIDIAN_PIN"
              app=/app/obsidian-app
              ln -sfn /vaults/Arvault /vault-index/Arvault
              if [ -f "$app/index.html" ] && [ "$(cat "$app/.obsidian-version" 2>/dev/null)" = "$v" ]; then
                echo "Obsidian $v already in the cache"
                exit 0
              fi
              echo "downloading Obsidian $v"
              find "$app" -mindepth 1 -delete
              curl -fsSL "https://github.com/obsidianmd/obsidian-releases/releases/download/v$v/obsidian-$v.asar.gz" \
                | gunzip > /tmp/obsidian.asar
              npx --yes @electron/asar@4.3.2 extract /tmp/obsidian.asar "$app"
              rm -f /tmp/obsidian.asar
              test -f "$app/index.html"
              echo "$v" > "$app/.obsidian-version"
              echo "Obsidian $v ready"
          env:
            - name: HOME
              value: /tmp
            - name: npm_config_update_notifier
              value: "false"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /app/obsidian-app
              subPath: obsidian-app
            - name: vault-index
              mountPath: /vault-index
            - name: tmp
              mountPath: /tmp
      containers:
        - name: ignis
          image: nobbe/ignis:0.9.0
          command: ["node", "/app/apps/ignis-server/server/index.js"]
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: VAULT_ROOT
              value: /vault-index
            - name: DATA_ROOT
              value: /data
            - name: OBSIDIAN_ASSETS_PATH
              value: /app/obsidian-app
            - name: WS_ORIGINS
              value: https://obsidian.bretagne.dev
            - name: HOME
              value: /tmp
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /api/version
              port: 8080
            failureThreshold: 24
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/version
              port: 8080
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/version
              port: 8080
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /vaults/Arvault
              subPath: vault
            - name: data
              mountPath: /data
              subPath: ignis-data
            - name: data
              mountPath: /app/obsidian-app
              subPath: obsidian-app
              readOnly: true
            - name: vault-index
              mountPath: /vault-index
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 2Gi
        - name: vault-index
          emptyDir:
            sizeLimit: 1Mi
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ignis
spec:
  selector:
    app: ignis
  ports:
    - port: 8080
      targetPort: 8080
