# Restores from the vault's backup (RESTORE.md). Not in kustomization.yaml: nothing applies it but
# the operator, by hand, after setting the two values below:
#
#   kubectl -n obsidian create -f apps/obsidian/backup/restore-job.yaml
#
# RESTORE_FROM: `current` (the last pass) or `history/<YYYYMMDDTHHMMSSZ>` (the versions that pass
# replaced or deleted). RESTORE_PATH: the note, relative to the vault (`Projects/Idea.md`), or empty
# for the whole of RESTORE_FROM. With the `versions` argument instead of `restore`, the Job only lists
# the stored versions of RESTORE_PATH, in its logs. The vault is mounted read-write, the rest is the
# backup's pod: same image, script, Secret and network policy.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: obsidian-vault-restore-
  namespace: obsidian
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: obsidian-vault-backup   # networkpolicy.yaml
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: restore
          image: rclone/rclone:1.76.0
          command: ["/bin/sh", "/scripts/vault-backup.sh", "restore"]
          env:
            - name: RESTORE_FROM
              value: current
            - name: RESTORE_PATH
              value: ""
          envFrom:
            - configMapRef:
                name: obsidian-vault-backup-env
            - secretRef:
                name: obsidian-vault-backup
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: vault
              mountPath: /vault
              subPath: vault
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: vault
          persistentVolumeClaim:
            claimName: obsidian-data
        - name: scripts
          configMap:
            name: obsidian-vault-backup-scripts
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
