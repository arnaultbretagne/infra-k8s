# obsidian.bretagne.dev: Ignis, the vault in a browser, entirely behind its OIDC gate. The route's one
# backend is the gate; Ignis itself is reachable from the gate only (ignis-networkpolicy.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ignis
spec:
  parentRefs:
    - name: bretagne-gateway
      namespace: traefik
      sectionName: https-obsidian
  hostnames:
    - obsidian.bretagne.dev
  rules:
    - filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: "max-age=86400; includeSubDomains"
      backendRefs:
        - name: ignis-oauth2-proxy
          port: 4180
