# Stateful exception (ADR 0005): the Obsidian vault, under the vault/ subPath,
# shared by the MCP server and the clipper — RWO is node-scoped, fine on
# single-node. This PVC holds the vault itself, the reference copy: no other
# client mirrors it, so it is not re-syncable from anywhere.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: obsidian-data
spec:
  storageClassName: local-path
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
