# The vault backup's credentials (vault-backup.yaml), loaded whole as environment variables. Every
# value is a placeholder until the operator fills it: `sops apps/obsidian/vault-backup.secrets.yaml`.
#   RCLONE_CONFIG_R2_ENDPOINT           https://<account id>.r2.cloudflarestorage.com
#   RCLONE_CONFIG_R2_ACCESS_KEY_ID      the access key of an R2 API token "Object Read & Write",
#   RCLONE_CONFIG_R2_SECRET_ACCESS_KEY  scoped to the bucket obsidian-backup only
#   CRYPT_PASSWORD, CRYPT_PASSWORD2     rclone crypt's password and salt, in clear, long and random
#                                       (`openssl rand -base64 48`). Keep both outside the cluster as
#                                       well: without them the backup can never be decrypted
#                                       (RESTORE.md). Never change them once a backup exists: the
#                                       stored objects stay encrypted with the old ones.
# While a crypt password is still REPLACE-ME the script refuses to run.
