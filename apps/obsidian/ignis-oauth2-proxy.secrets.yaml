# Ignis's OIDC gate (ignis-oauth2-proxy.yaml): the id and client secret of the Pocket-ID client
# `ignis`, and a cookie secret of 32 bytes (`openssl rand -base64 32 | tr -- '+/' '-_'`). Pocket-ID
# keeps only a hash of a client secret: to rotate it, mint a new one on the client (admin → OIDC
# clients → ignis, or POST /api/oidc/clients/<id>/secrets), write it here with `sops set`, then
# delete the old one in Pocket-ID.
