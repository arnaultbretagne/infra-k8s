# Ignis's OIDC gate (ignis-oauth2-proxy.yaml). Committed with placeholders, encrypted: the Pocket-ID
# client `ignis` mints its client secret when the reconciler first creates it, after the merge. Then,
# with `sops apps/obsidian/ignis-oauth2-proxy.secrets.yaml`: the client's id and secret from Pocket-ID,
# and a cookie secret of 32 bytes (`openssl rand -base64 32 | tr -- '+/' '-_'`). Until then the
# placeholders are refused (a cookie secret must be 16, 24 or 32 bytes): the gate does not start, and
# nothing is served at obsidian.bretagne.dev.
