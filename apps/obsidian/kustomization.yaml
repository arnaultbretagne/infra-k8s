apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: obsidian
resources:
  - namespace.yaml
  - pvc.yaml
  - clipper.yaml
  - mcp-server.yaml
  - httproute.yaml
  - networkpolicy.yaml
  - vault-backup.yaml
  - vault-backup.secrets.yaml
  # Ignis (obsidian.bretagne.dev): Obsidian in a browser, on the same vault, behind its OIDC gate.
  # Its workload is the one a preview applies (catalogue entry ignis); here it gets the real volume.
  - ../ignis/workload
  - ignis-oauth2-proxy.secrets.yaml
  - ignis-oauth2-proxy.yaml
  - ignis-httproute.yaml
  - ignis-networkpolicy.yaml
configMapGenerator:
  # The backup's one script (vault-backup.yaml). No hash suffix: backup/restore-job.yaml, applied by
  # hand outside this kustomization, mounts it by this name; a CronJob reads it at each run anyway.
  - name: obsidian-vault-backup-scripts
    files:
      - backup/vault-backup.sh
    options:
      disableNameSuffixHash: true
patches:
  # The workload's `data` emptyDir becomes the vault's PVC: the vault itself (subPath vault, the folder
  # the MCP server and the clipper use), Ignis's settings (ignis-data) and the Obsidian cache
  # (obsidian-app).
  - target:
      group: apps
      kind: Deployment
      name: ignis
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ignis
      spec:
        template:
          spec:
            volumes:
              - name: data
                emptyDir: null
                persistentVolumeClaim:
                  claimName: obsidian-data
