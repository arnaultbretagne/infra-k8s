# Regenerates the Tam-Taro templates (apps/stremio/templates/tamtaro-fr-*.json, one per
# overlay in tamtaro-fr/) from Tam-Taro's latest template (see apps/stremio/templates/README.md). When the result changed, it opens or
# updates one pull request as agora-contributor, the GitHub App that proposes code
# (apps/agora-gateway/github-refresher.yaml): a token minted for the run from the App's private key, secret
# CONTRIBUTOR_APP_PRIVATE_KEY, for this repository's contents and pull requests only. Only the operator merges.
name: Tam-Taro template

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tamtaro-template
  cancel-in-progress: false

env:
  TEMPLATE: apps/stremio/templates/tamtaro-fr-3vf-2vostfr.json
  TEMPLATES: apps/stremio/templates/tamtaro-fr-*.json
  BRANCH: auto/tamtaro-template

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Regenerate
        run: node apps/stremio/templates/tamtaro-fr/generate.mjs

      - name: Detect a change
        id: diff
        run: |
          if git diff --quiet -- $TEMPLATES; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Templates already up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- $TEMPLATES
          fi

      - name: A token as agora-contributor
        id: token
        if: steps.diff.outputs.changed == 'true'
        uses: actions/create-github-app-token@v3
        with:
          # agora-contributor, App 5666338.
          client-id: Iv23liAjK9DwbYJyOHA6
          private-key: ${{ secrets.CONTRIBUTOR_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open or update the pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          version=$(node -p "require('./$TEMPLATE').metadata.version")
          git config user.name "agora-contributor[bot]"
          git config user.email "354025670+agora-contributor[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add $TEMPLATES
          git commit -m "chore(stremio): regenerate the Tam-Taro FR templates ($version)"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"
          if [ "$(gh pr list --head "$BRANCH" --state open --json number --jq length)" = "0" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "chore(stremio): regenerate the Tam-Taro FR templates ($version)" \
              --body "Tam-Taro's template changed upstream; this is the regenerated instance template (version $version). Before merging, run \`check-live.mjs\` against an AIOStreams instance (apps/stremio/templates/README.md)."
          else
            echo "Open pull request updated."
          fi
