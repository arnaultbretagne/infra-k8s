# The gateway's vault token is minted by hand and lives 90 days (apps/agora-gateway/vault-token.secrets.yaml,
# its date in the annotation `agora.bretagne.dev/expires`). Every day, this run fails from 21 days before that
# date, and while no token is set: GitHub then mails the repository's owner, well before the vault answers 401.
# Not run on pull requests: an unset token is the normal state of the PR that adds the route.
name: agora-gateway vault token

on:
  schedule:
    - cron: '41 6 * * *'
  push:
    branches: [main]
    paths:
      - apps/agora-gateway/vault-token.secrets.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  expiry:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/agora-gateway/package-lock.json

      - name: Days left on the vault token
        run: |
          npm ci --prefix tests/agora-gateway --no-audit --no-fund
          node tests/agora-gateway/vault-token-expiry.mjs apps/agora-gateway/vault-token.secrets.yaml
        env:
          MIN_DAYS: '21'
