apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agent-vault
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  dependsOn:
  - name: infrastructure-controllers
  - name: infrastructure-shared-secrets
  # The HTTPRoute attaches to bretagne-gateway's https-agent-vault listener.
  - name: infrastructure-gateway
  path: ./infrastructure/agent-vault
  # TEMPORARY, for the move into the `apps` layer only. This Kustomization is about to be deleted;
  # with prune left on, removing it would garbage-collect the namespace, the CNPG Cluster and its
  # PVC. Pruning off first lets the `apps` layer adopt the live objects instead of recreating an
  # empty database. The follow-up commit deletes this file; nothing reinstates prune here.
  prune: false
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
