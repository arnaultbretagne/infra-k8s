apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agent-vault
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  dependsOn:
  - name: infrastructure-controllers
  - name: infrastructure-shared-secrets
  path: ./infrastructure/agent-vault
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
