# Barman Cloud plugin: the base backups, WAL archiving and restores of every CNPG cluster go
# through it (CNPG-I). The operator's own barmanObjectStore support is deprecated and leaves in
# CloudNativePG 1.31. Each cluster names an ObjectStore (same bucket and layout as before) in
# spec.plugins, and the plugin runs a sidecar next to each PostgreSQL instance.
# Lives next to the operator: CNPG discovers plugins through Services in its own namespace.
# The chart issues the operator <-> plugin mTLS certificates through cert-manager.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plugin-barman-cloud
  namespace: cnpg-system
spec:
  interval: 1h
  dependsOn:
    - name: cloudnative-pg
    - name: cert-manager
      namespace: cert-manager
  chart:
    spec:
      chart: plugin-barman-cloud
      version: "0.8.1"
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
