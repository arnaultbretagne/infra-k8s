apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 1h
  chart:
    spec:
      chart: cilium
      version: "1.20.2"
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # kube-proxy KEPT (ADR 0006 amended 2026-06-28): kpr attaches eBPF to eth0 → host SSH lockout
    # on this single-NIC VPS (cilium #46010). Cilium stays for CNI + Hubble + NetworkPolicy.
    kubeProxyReplacement: false
    k8sServiceHost: "localhost"
    k8sServicePort: "6443"

    # L2 announcement feature: OFF until the flip (Phase 7). On a single public IP / single
    # NIC, announcing it mid-build makes Cilium's eBPF datapath seize eth0 → SSH lockout
    # (post-mortem 2026-06-28). Re-enable together with cilium-lb at Phase 7.
    l2announcements:
      enabled: false
    k8sClientRateLimit:
      qps: 50
      burst: 100

    # Pod CIDR (must match k0s.yaml)
    ipam:
      operator:
        clusterPoolIPv4PodCIDRList:
          - 10.244.0.0/16

    # Hubble ON (ADR 0014/0020): agent-level flow observability ("the agent's eyes") + the
    # audit basis for NetworkPolicies (`hubble observe`). relay + UI deferred to Phase 6 — the
    # relay's mTLS bootstrap is finicky on single-node and isn't needed for the agent-level audit.
    hubble:
      enabled: true
      relay:
        enabled: false
      # Phase 1 metrics (research §4.2): careful contexts, NO httpV2 (needs the L7
      # proxy in-path — edge RED comes from Traefik instead). Dashboards ship as
      # ConfigMaps from the chart, picked up by the Grafana sidecar (folder annotation).
      metrics:
        enabled:
          - dns:query;ignoreAAAA
          - drop:sourceContext=identity;destinationContext=identity
          - tcp
          - flow
        serviceMonitor:
          enabled: true
        dashboards:
          enabled: true
          namespace: observability
          annotations:
            grafana_folder: Cilium

    # Agent metrics (:9962, hostNetwork — nftables rule required, see host config)
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true

    # Resources, sized on 7 days of measured usage (2026-10-07; docs/hosting-an-app.md §4.3).
    operator:
      replicas: 1          # single-node: avoid 2nd replica stuck Pending on hostPort conflict
      prometheus:
        serviceMonitor:
          enabled: true       # operator.prometheus.enabled is already chart-default true
      resources:
        requests:
          cpu: 10m
          memory: 224Mi
        limits:
          memory: 320Mi
    # The agent is the datapath: its request is the CPU it is guaranteed when sandboxes saturate
    # the node (p95 175m, 1.2 cores at boot). Its working set sat at the old 512Mi limit.
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        memory: 1Gi
    envoy:
      resources:
        requests:
          cpu: 10m
          memory: 96Mi
