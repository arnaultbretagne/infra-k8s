apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 1h
  chart:
    spec:
      chart: cert-manager
      version: "v1.21.2"
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    crds:
      enabled: true
      keep: true
    # Enable Gateway API support (no longer a feature gate since cert-manager 1.15)
    config:
      apiVersion: controller.config.cert-manager.io/v1alpha1
      kind: ControllerConfiguration
      enableGatewayAPI: true
    # Sized on 7 days of measured usage (2026-10-07; docs/hosting-an-app.md §4.3).
    resources:
      requests:
        cpu: 10m
        memory: 144Mi
      limits:
        memory: 192Mi
    webhook:
      resources:
        requests:
          cpu: 10m
          memory: 48Mi
        limits:
          memory: 128Mi   # peaked at 63Mi against the old 64Mi
    cainjector:
      resources:
        requests:
          cpu: 10m
          memory: 112Mi
        limits:
          memory: 128Mi
