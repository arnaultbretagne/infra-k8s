apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 1h
  chart:
    spec:
      chart: traefik
      version: "41.6.1"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  install:
    crds: Skip   # CRDs managed centrally in infrastructure-crds, not by this chart
    remediation:
      retries: 3
  upgrade:
    crds: Skip   # CRDs managed centrally in infrastructure-crds, not by this chart
    remediation:
      retries: 3
  values:
    # Pure Gateway API — no traefik.io CRDs / IngressRoute for now
    providers:
      kubernetesGateway:
        enabled: true
      kubernetesCRD:
        enabled: false

    # We use our own Gateway (bretagne-gateway), so disable the chart's default one.
    # GatewayClass "traefik" is still created by the chart (gatewayClass.enabled default true).
    gateway:
      enabled: false

    # No Traefik OIDC plugin: ADR 0010 (sevensolutions/traefik-oidc-auth) was superseded by
    # ADR 0021 — that plugin is a traefik.io Middleware CRD, incompatible with our pure
    # Gateway API setup (kubernetesCRD: false). Auth is oauth2-proxy (ForwardAuth) per app.

    # Entrypoints
    ports:
      web:
        port: 8000        # container port (non-privileged): Traefik runs non-root, can't bind :80. Service maps 80→8000.
        exposedPort: 80
        protocol: TCP
      websecure:
        port: 8443        # container port (non-privileged). Service maps 443→8443. (Phase 7: hostPort 80/443 → 8000/8443.)
        exposedPort: 443
        protocol: TCP

    # TLS certificates are provisioned by cert-manager via Gateway certificateRefs
    # (ADR 0008 updated) — Traefik's built-in ACME does not serve Gateway API anyway.

    # FLIP (Phase 7): bind the host public IP :80/:443 via Service externalIPs.
    # This rides kube-proxy (kept — kubeProxyReplacement=false), so it does NOT
    # touch the eBPF eth0 datapath / SSH, unlike Cilium L2 announcement (cilium-lb,
    # still deferred). externalIPs DNAT (kube-proxy) -> Traefik pod :8000/:8443.
    # The chart passes service.spec through as the Service spec (since chart 40): type and
    # externalIPs at service.* would be silently dropped, taking the edge off 10.10.20.10.
    service:
      spec:
        type: NodePort
        externalIPs:
          - 10.10.20.10

    # Every app's traffic goes through here: evicted last, and its CPU request is the share it is
    # guaranteed when sandboxes saturate the node (the request-path floor, docs/hosting-an-app.md
    # §4.3). Memory sized on 7 days of measured usage (2026-10-07: p95 197Mi, peak 205Mi).
    priorityClassName: bretagne-critical
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 384Mi

    # Edge RED (research 2026-07-04 §4.1): custom latency buckets — the default
    # [0.1,0.3,1.2,5.0] makes p95/p99 useless. addServices/EntryPoints labels are
    # chart defaults (true); addRoutersLabels stays off (cardinality for nothing).
    metrics:
      prometheus:
        buckets: "0.025,0.05,0.1,0.25,0.5,1.0,2.5,5.0,10.0"

    # Logs (the chart's keys follow Traefik's static configuration: log, accessLog)
    log:
      level: INFO
    accessLog:
      # JSON to stdout -> Alloy tails it -> Loki. Log everything (4.7 lines/s
      # baseline leaves huge headroom); filter to 4xx/5xx only if volume grows.
      enabled: true
      format: json
