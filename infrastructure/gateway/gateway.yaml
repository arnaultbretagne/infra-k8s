apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: bretagne-gateway
  namespace: traefik
  annotations:
    # gateway-shim keeps the stable listener hostnames in one multi-SAN Certificate.
    # The issuer validates them through Cloudflare DNS-01; public port 80 is not needed.
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  gatewayClassName: traefik
  listeners:
    - name: http
      port: 8000
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      port: 8443
      protocol: HTTPS
      hostname: id.bretagne.dev
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: bretagne-tls
      allowedRoutes:
        namespaces:
          from: All
    # Per-host listener for aiostreams. Stable listeners share bretagne-tls;
    # gateway-shim adds their hostnames to the multi-SAN Certificate.
    - name: https-stremio
      port: 8443
      protocol: HTTPS
      hostname: stremio.bretagne.dev
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: bretagne-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: https-grafana
      port: 8443
      protocol: HTTPS
      hostname: grafana.bretagne.dev
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: bretagne-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: https-code
      port: 8443
      protocol: HTTPS
      hostname: code.bretagne.dev
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: bretagne-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: https-vault
      port: 8443
      protocol: HTTPS
      hostname: vault.bretagne.dev
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: bretagne-tls
      allowedRoutes:
        namespaces:
          from: All
    # Web shell (host-level, ADR 0023). Backend is a host systemd oauth2-proxy reached
    # via a selector-less Service + manual EndpointSlice (apps/terminal), not a pod.
    - name: https-terminal
      port: 8443
      protocol: HTTPS
      hostname: terminal.bretagne.dev
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: bretagne-tls
      allowedRoutes:
        namespaces:
          from: All
    # The platform's public façade. Replaced the channels-era hub's own `https-agent`
    # (agent.bretagne.dev), removed at decommission on 2026-08-07. Same OIDC-gate posture
    # (single-operator hub).
    - name: https-agora
      port: 8443
      protocol: HTTPS
      hostname: agora.bretagne.dev
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: bretagne-tls
      allowedRoutes:
        namespaces:
          from: All
    # P11 (agora refactoring): OneCLI's own admin dashboard — the credential-gateway vault
    # (Claude Max / ChatGPT tokens, CA, route policy). Pocket-ID SSO gated (ALLOWED_GROUPS=admin),
    # same pattern as https-code — deliberately never left reachable without the OIDC gate.
    - name: https-onecli
      port: 8443
      protocol: HTTPS
      hostname: onecli.bretagne.dev
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: bretagne-tls
      allowedRoutes:
        namespaces:
          from: All
