apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https-redirect
  namespace: traefik
spec:
  parentRefs:
    - name: bretagne-gateway
      namespace: traefik
      sectionName: http        # attach ONLY to the :80 HTTP listener
  # No hostnames → matches every HTTP request. ACME uses DNS-01, so certificate
  # issuance and renewal do not depend on this listener or public port 80.
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
