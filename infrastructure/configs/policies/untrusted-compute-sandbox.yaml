# ADR 0027 §4 — untrusted-compute pods must be sandboxed. CNPG-managed pods exempt
# (trusted upstream software). The binding selects ONLY namespaces carrying the untrusted-compute
# profile label: today that is `agora-runs`, `agora-sandboxes` (infra-k8s ADR 0028 — run namespaces
# are labelled from birth, no "label later" debt) and every preview namespace `pv-<app>-pr<n>`,
# which preview-requires-kata.yaml further narrows to Kata alone. Two runtimes qualify as a
# sandbox: `sandboxed` (gVisor) and `kata` (one VM per Pod).
#
# `agent-runs` carried the label too until the channels-era system was decommissioned
# (2026-08-07); `agora-runs` inherited both the label and this binding unchanged.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: untrusted-compute-requires-sandbox
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  validations:
    - expression: >-
        (has(object.metadata.labels) && 'cnpg.io/cluster' in object.metadata.labels)
        || (has(object.spec.runtimeClassName) && object.spec.runtimeClassName in ['sandboxed', 'kata', 'kata-preview'])
      message: >-
        Pods in untrusted-compute namespaces must set runtimeClassName: sandboxed (gVisor), kata or
        kata-preview (VM) (ADR 0027).
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: untrusted-compute-requires-sandbox
spec:
  policyName: untrusted-compute-requires-sandbox
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        platform.bretagne.dev/profile: untrusted-compute
