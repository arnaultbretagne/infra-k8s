# ADR 0017 v4 §6 — a preview namespace runs the PR's code under Kata, one VM per Pod, and nothing
# else: no gVisor, no CNPG exception (preview databases live in preview-system). Stricter than
# untrusted-compute-requires-sandbox, which still applies to these namespaces too.
#
# The memory floor: under Kata, a container whose memory limit is 32 Mi never starts — the guest
# agent hangs creating it (ttrpc "Receive packet timeout") — while 64 Mi starts (measured
# 2026-10-23, whoami). A hung Kata VM also stalls the kubelet's stats endpoint, which took
# metrics-server down for the whole node. Refusing such a Pod at admission, with a clear message,
# is the cheap guard. Containers without a limit get the LimitRange's 256 Mi before this runs.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: preview-requires-kata
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  variables:
    - name: containers
      expression: >-
        object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : [])
  validations:
    - expression: has(object.spec.runtimeClassName) && object.spec.runtimeClassName == 'kata'
      message: Pods in preview namespaces must set runtimeClassName kata (ADR 0017 v4).
    - expression: >-
        variables.containers.all(c, has(c.resources) && has(c.resources.limits)
        && 'memory' in c.resources.limits
        && quantity(c.resources.limits['memory']).compareTo(quantity('64Mi')) >= 0)
      message: >-
        Every container in a preview needs a memory limit of at least 64Mi: under Kata a smaller one
        never starts (ADR 0017 v4 §6).
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: preview-requires-kata
spec:
  policyName: preview-requires-kata
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        preview.bretagne.dev/preview: "true"
