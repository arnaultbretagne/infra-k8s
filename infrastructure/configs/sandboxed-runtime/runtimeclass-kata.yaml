# Kata Containers (Cloud Hypervisor): one lightweight VM per Pod. The runtime of Agora's sandboxes
# (apps/agora-sandboxes), installed on the host by bootstrap/bootstrap.sh (handler `kata`, config
# /etc/kata-containers/configuration.toml). `sandboxed` keeps gVisor for the other untrusted-compute
# namespaces: a handler is immutable, so Kata arrives as a second class, not an in-place swap.
#
# The overhead is the one measured on this host (docs/agent-sandbox-evaluation.md): the scheduler and
# the namespace quota count it on top of the Pod's own requests.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata
handler: kata
overhead:
  podFixed:
    memory: 256Mi
    cpu: 100m
