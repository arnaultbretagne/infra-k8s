# The catalogue (ADR 0017 v4 §2): one file per previewable app, nothing else. No entry, no preview.
# Never add pocket-id, home-assistant, terminal, code-server, agora-gateway or any controller (§3).
# The filter.limit values of all entries add up to 4 at most (§10).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - preview-demo.yaml
  - rss.yaml
