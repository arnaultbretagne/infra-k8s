apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agent-sandbox-controller
  namespace: agent-sandbox-system
spec:
  endpointSelector:
    matchLabels:
      app: agent-sandbox-controller
  ingress:
  - fromEntities:
    - host
    toPorts:
    - ports:
      - port: '8081'
        protocol: TCP
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: observability
        app.kubernetes.io/name: prometheus
    toPorts:
    - ports:
      - port: '8080'
        protocol: TCP
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports:
      - port: '53'
        protocol: UDP
      - port: '53'
        protocol: TCP
  - toEntities:
    - kube-apiserver
    toPorts:
    - ports:
      - port: '443'
        protocol: TCP
      - port: '6443'
        protocol: TCP
